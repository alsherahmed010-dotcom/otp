<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Live - Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e1621;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .telegram-container {
            width: 100%;
            max-width: 450px;
            background-color: #17212b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0e1621;
        }

        /* Header */
        .tg-header {
            background-color: #242f3d;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #111822;
            min-height: 60px;
        }

        .tg-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tg-back-arrow {
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }

        .tg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #2b5278;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }

        .tg-title-info h2 {
            font-size: 17px;
            color: #ffffff;
            font-weight: 600;
        }

        .tg-title-info p {
            font-size: 13px;
            color: #7d8b99;
        }

        /* Main List */
        .main-list {
            flex: 1;
            overflow-y: auto;
            background-color: #0e1621;
        }

        .chat-row {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .chat-row:hover { background-color: rgba(255,255,255,0.03); }
        .chat-row .tg-avatar { width: 50px; height: 50px; font-size: 22px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .chat-row .preview { font-size: 14px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0e1621;
        }

        .msg-block {
            background-color: #182533;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            line-height: 1.6;
            color: #ffffff;
        }

        .msg-user { color: #64b5f6; font-weight: 600; }
        .num { color: #60a5fa; font-weight: 600; font-size: 17px; cursor: pointer; }
        .code { background-color: #f59e0b; color: #000; padding: 4px 12px; border-radius: 6px; font-weight: 700; display: inline-block; margin: 6px 0; font-size: 17px; cursor: pointer; }
        .time-tag { font-size: 12px; color: #7d8b99; text-align: left; margin-top: 6px; }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            text-align: center;
            background-color: #2b5278;
            width: 100%;
            margin-bottom: 8px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-green { background-color: #2e8b57; }
        .btn-gold { background-color: #f59e0b; color: #000; }
        .btn-row { display: flex; gap: 10px; }
        .btn-row .btn { flex: 1; margin-bottom: 0; }

        .number-item-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .number-item-row .btn {
            margin-bottom: 0;
            flex: 2;
            font-size: 15px;
        }
        .number-item-row .btn-fetch {
            flex: 1;
            background-color: #2675d3;
            font-size: 14px;
        }

        .btn-area {
            padding: 12px;
            border-top: 1px solid #111822;
            background-color: #17212b;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 52vh; 
            overflow-y: auto;
        }

        /* Chat Input Bar */
        .chat-input-bar {
            display: flex;
            padding: 10px;
            background-color: #17212b;
            border-top: 1px solid #111822;
            gap: 10px;
            align-items: center;
        }

        .chat-input-bar input {
            flex: 1;
            background-color: #0e1621;
            border: 1px solid #2b5278;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .chat-input-bar button {
            background-color: #5288c1;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Toast */
        #toast {
            visibility: hidden;
            min-width: 170px;
            background-color: #f59e0b;
            color: #000;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 99;
            left: 50%;
            bottom: 75px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: opacity 0.3s;
            opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }

        /* Bottom Nav */
        .bottom-nav { background-color: #17212b; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #111822; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 13px; font-weight: 500; cursor: pointer; gap: 4px; background: none; border: none; flex: 1; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 22px; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="telegram-container" id="app">
        <div id="toast">تم النسخ!</div>
    </div>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db = firebase.database();
        const PROXY = 'https://ai-proxy-eosin.vercel.app/api/panel';
        const API_KEY = 'np_live_6DknI4df2uZ0_BFv6CGGpX_BCBAq60TG1sKev64WPkw';
        
        let S = JSON.parse(localStorage.getItem('otp_session_v9') || '{}');
        let cur = S.cur || 'main', cSvc = S.cSvc || '', cCty = S.cCty || '', cFlag = S.cFlag || '', viewMode = S.viewMode || 'services';
        let known = new Set(), otpTimer = null, numBatchIndex = 0, currentNumbersPool = [];

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'click') {
                    osc.frequency.setValueAtTime(350, ctx.currentTime);
                    gain.gain.setValueAtTime(0.03, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.04);
                } else if (type === 'copy' || type === 'otp') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {}
        }

        function save() { localStorage.setItem('otp_session_v9', JSON.stringify({cur, cSvc, cCty, cFlag, viewMode})); }
        function api(p) { return fetch(PROXY + p).then(r => r.json()); }
        function el(id) { return document.getElementById(id); }

        function showToast(msg) {
            playSound('copy');
            let t = el('toast');
            if(!t) {
                t = document.createElement('div');
                t.id = 'toast';
                document.querySelector('.telegram-container').appendChild(t);
            }
            t.innerText = msg || "تم النسخ!";
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 1800);
        }

        function render() {
            playSound('click');
            const app = el('app');
            let toastHTML = '<div id="toast">تم النسخ!</div>';

            if (cur === 'main') {
                app.innerHTML = toastHTML + `
                    <div class="screen">
                        <div class="tg-header">
                            <div class="tg-header-left">
                                <div class="tg-avatar">✈️</div>
                                <div class="tg-title-info"><h2>Telegram</h2><p>Number Panel Live</p></div>
                            </div>
                        </div>
                        <div class="main-list">
                            <div class="chat-row" onclick="openChat('bot')">
                                <div class="tg-avatar" style="background:#2b5278;">🤖</div>
                                <div class="info">
                                    <div class="name">🤖 NUMBER BOT</div>
                                    <div class="preview">بوت استعراض أرقام الدول وأكوادها لجميع الخدمات</div>
                                </div>
                            </div>
                            <div class="chat-row" onclick="openChat('group')">
                                <div class="tg-avatar" style="background:#2e8b57;">👥</div>
                                <div class="info">
                                    <div class="name">👥 ALL TECH OTP</div>
                                    <div class="preview">بث مباشر ومراسلة جماعية لأكواد التفعيل</div>
                                </div>
                            </div>
                        </div>
                        <div class="bottom-nav">
                            <button class="nav-item ${viewMode !== 'hot_countries' && viewMode !== 'my_numbers' ? 'active' : ''}" onclick="openScreen('main'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                            <button class="nav-item ${viewMode === 'hot_countries' ? 'active' : ''}" onclick="showHotCountries();"><span class="nav-icon">🔥</span>الأكثر نشاطاً</button>
                            <button class="nav-item ${viewMode === 'my_numbers' ? 'active' : ''}" onclick="showMyNumbers();"><span class="nav-icon">📱</span>أرقامي النشطة</button>
                        </div>
                    </div>`;
            } else {
                app.innerHTML = toastHTML + `
                    <div class="screen">
                        <div class="tg-header">
                            <div class="tg-header-left">
                                <div class="tg-back-arrow" onclick="goBack()">←</div>
                                <div class="tg-avatar">${cur === 'bot' ? '🤖' : '👥'}</div>
                                <div class="tg-title-info">
                                    <h2>${cur === 'bot' ? '🤖 NUMBER BOT' : '👥 ALL TECH OTP'}</h2>
                                    <p>${cur === 'bot' ? 'متصل الآن' : '٨٣٤٣ عضواً، ١٥٣١ متصلاً'}</p>
                                </div>
                            </div>
                        </div>
                        <div class="chat-body" id="messages"></div>
                        ${cur === 'bot' ? '<div class="btn-area" id="btnArea"></div>' : `
                            <div class="chat-input-bar">
                                <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendGroupMsg()">
                                <button onclick="sendGroupMsg()">📤</button>
                            </div>
                        `}
                        <div class="bottom-nav">
                            <button class="nav-item ${viewMode !== 'hot_countries' && viewMode !== 'my_numbers' ? 'active' : ''}" onclick="openChat('bot'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                            <button class="nav-item ${viewMode === 'hot_countries' ? 'active' : ''}" onclick="showHotCountries();"><span class="nav-icon">🔥</span>الأكثر نشاطاً</button>
                            <button class="nav-item ${viewMode === 'my_numbers' ? 'active' : ''}" onclick="showMyNumbers();"><span class="nav-icon">📱</span>أرقامي النشطة</button>
                        </div>
                    </div>`;
            }
            bindEvents();
        }

        function bindEvents() {
            if (cur === 'bot') {
                if (viewMode === 'hot_countries') showHotCountries();
                else if (viewMode === 'my_numbers') showMyNumbers();
                else if (cCty) showNumbersList(cCty, cFlag);
                else if (cSvc) loadCountries(cSvc);
                else loadServices();
            } else if (cur === 'group') {
                el('messages').innerHTML = '<div class="msg-block">📡 نظام البث المباشر لأكواد التفعيل والمراسلة الحية.</div>';
                db.ref('messages').off();
                db.ref('messages').limitToLast(40).on('child_added', s => { if (cur === 'group') showGroupMessage(s.val()); });
                if (otpTimer) clearInterval(otpTimer);
                otpTimer = setInterval(fetchOTP, 3000);
                fetchOTP();
            }
        }

        function openScreen(s) { cur = s; save(); if (otpTimer) clearInterval(otpTimer); render(); }
        function openChat(t) { cur = t; save(); render(); }
        
        function goBack() { 
            if (viewMode === 'hot_countries' || viewMode === 'my_numbers') {
                viewMode = 'services'; save(); loadServices();
            } else if (cCty) { 
                cCty = ''; cFlag = ''; save(); loadCountries(cSvc); 
            } else if (cSvc) {
                cSvc = ''; viewMode = 'services'; save(); loadServices();
            } else { 
                cur = 'main'; save(); if (otpTimer) clearInterval(otpTimer); render(); 
            }
        }
        
        function showGroupMessage(m) {
            if (cur !== 'group') return;
            const t = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
            if (m.type === 'otp') {
                playSound('otp');
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">Alexender (المشرف)</span><br>
                        🌐 الخدمة: <b>${m.service || 'OTP'}</b><br>
                        📱 الرقم: <span class="num" onclick="copyText('${m.number}')">${m.number || ''}</span><br>
                        🔑 الكود: <span class="code" onclick="copyText('${m.code}')">${m.code}</span>
                        <div class="time-tag">${t}</div>
                    </div>`;
            } else if (m.type === 'chat') {
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">${m.user || 'عضو'}</span><br>
                        ${m.text}
                        <div class="time-tag">${t}</div>
                    </div>`;
            }
            el('messages').scrollTop = el('messages').scrollHeight;
        }

        function sendGroupMsg() {
            const input = el('chatInput');
            if(!input || !input.value.trim()) return;
            db.ref('messages').push({ type: 'chat', user: 'مستخدم (أنت)', text: input.value.trim() });
            input.value = '';
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            showToast('تم النسخ: ' + txt);
        }

        async function fetchOTP() {
            try {
                const d = await api('/api/otp?count=15');
                if (Array.isArray(d)) {
                    d.forEach(i => {
                        const k = i[1] + '-' + i[2];
                        if (!known.has(k)) {
                            known.add(k);
                            db.ref('messages').push({
                                type: 'otp', service: i[0], number: i[1],
                                code: i[2].match(/\d{4,8}/)?.[0] || i[2]
                            });
                        }
                    });
                }
            } catch (e) {}
        }

        async function showHotCountries() {
            viewMode = 'hot_countries'; cur = 'bot'; save(); render();
            el('messages').innerHTML = '<div class="msg-block">🔥 الدول الأكثر نشاطاً في المنصة الآن:</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري التحميل...</div>';
            
            try {
                const d = await api('/api/otp?count=80');
                let counts = {};
                if (Array.isArray(d)) {
                    d.forEach(i => { let c = i.length > 4 && i[4] ? i[4] : 'زيمبابوي 🇿🇼'; counts[c] = (counts[c] || 0) + 1; });
                }
                let sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
                if (sorted.length === 0) sorted = ['زيمبابوي 🇿🇼', 'إندونيسيا 🇮🇩'];

                let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                sorted.forEach(c => { btns += `<button class="btn" onclick="selectCountry('${c}','')">🌍 ${c}</button>`; });
                el('btnArea').innerHTML = btns;
            } catch(e) { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">🔙 رجوع</button>'; }
        }

        async function showMyNumbers() {
            viewMode = 'my_numbers'; cur = 'bot'; save(); render();
            el('messages').innerHTML = '<div class="msg-block">📱 أرقامك النشطة والمربوطة بمفتاح الـ API:</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري التحميل...</div>';

            try {
                const res = await fetch(PROXY + '/api/my_numbers', { headers: { 'Authorization': 'Bearer ' + API_KEY } });
                const data = await res.json();
                let nums = (data && data.success && Array.isArray(data.numbers)) ? data.numbers : ['+16282849090', '+6288269202428'];

                let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                nums.forEach(n => {
                    btns += `
                        <div class="number-item-row">
                            <button class="btn btn-green" onclick="copyText('${n}')">📱 ${n}</button>
                            <button class="btn btn-fetch" onclick="fetchSingleCode('${n}')">🔍 جلب الكود</button>
                        </div>`;
                });
                el('btnArea').innerHTML = btns;
            } catch(e) { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">🔙 رجوع</button>'; }
        }

        async function fetchSingleCode(num) {
            showToast('جاري فحص الكود...');
            try {
                const res = await fetch(PROXY + '/api/latest_otp?number=' + encodeURIComponent(num), { headers: { 'Authorization': 'Bearer ' + API_KEY } });
                const data = await res.json();
                if (data && data.success && data.has_otp) {
                    playSound('otp');
                    el('messages').innerHTML += `
                        <div class="msg-block">
                            📱 الرقم: <span class="num" onclick="copyText('${num}')">${num}</span><br>
                            🔑 الكود: <span class="code" onclick="copyText('${data.otp_code || data.verification_code || '---'}')">${data.otp_code || data.verification_code || '---'}</span>
                        </div>`;
                    el('messages').scrollTop = el('messages').scrollHeight;
                    showToast('تم العثور على الكود!');
                } else {
                    showToast('لا يوجد كود جديد حالياً');
                }
            } catch(err) { showToast('خطأ أثناء فحص الكود'); }
        }

        async function loadServices() {
            viewMode = 'services'; cur = 'bot'; cSvc = ''; cCty = ''; save(); render();
            el('messages').innerHTML = '<div class="msg-block">👋 أهلاً بك! اختر الخدمة المطلوبة:</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري تحميل الخدمات...</div>';
            try {
                const d = await api('/api/services');
                if (d.success && d.services) {
                    let btns = '';
                    d.services.forEach(s => { btns += `<button class="btn" onclick="loadCountries('${s.name}')">${s.name} (${s.count})</button>`; });
                    el('btnArea').innerHTML = btns;
                } else { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">❌ إعادة المحاولة</button>'; }
            } catch (e) { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">❌ خطأ بالاتصال</button>'; }
        }

        async function loadCountries(serviceName) {
            cSvc = serviceName; cCty = ''; cFlag = ''; viewMode = 'countries'; save();
            el('messages').innerHTML = `<div class="msg-block">🌐 الخدمة: <b>${serviceName}</b>.<br>اختر الدولة المتاحة لعرض أرقامها:</div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري تحميل الدول...</div>';
            try {
                const d = await api('/api/countries?service=' + encodeURIComponent(serviceName));
                if (d.success && d.countries) {
                    let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                    d.countries.forEach(c => { btns += `<button class="btn" onclick="selectCountry('${c.name}','${c.flag || ''}')">${c.flag || ''} ${c.name} (${c.count})</button>`; });
                    el('btnArea').innerHTML = btns;
                } else { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">🔙 رجوع</button>'; }
            } catch (e) {}
        }

        function selectCountry(country, flag) {
            cCty = country; cFlag = flag; viewMode = 'numbers'; numBatchIndex = 0; currentNumbersPool = []; save();
            showNumbersList(country, flag, true);
        }

        async function showNumbersList(country, flag, fetchNew = false) {
            el('messages').innerHTML = `
                <div class="msg-block">
                    🌐 الخدمة: <b>${cSvc || 'WhatsApp'}</b><br>
                    🌍 الدولة: ${flag || ''} <b>${country}</b><br>
                    📱 جاري جلب الأرقام (3 بـ 3)...
                </div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري جلب الأرقام...</div>';
            
            try {
                if (fetchNew || currentNumbersPool.length === 0) {
                    currentNumbersPool = [];
                    try {
                        const reqRes = await fetch(PROXY + '/api/request_number', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ service: cSvc || 'WhatsApp', country: country })
                        });
                        const reqData = await reqRes.json();
                        if (reqData && reqData.success && reqData.number) currentNumbersPool.push(reqData.number);
                    } catch(err) {}

                    const d = await api(`/api/otp?count=100`);
                    if (Array.isArray(d)) {
                        d.forEach(i => {
                            if (i.length > 4 && i[4] && i[4].toUpperCase().includes(country.toUpperCase()) && i[1]) {
                                currentNumbersPool.push(i[1]);
                            }
                        });
                    }
                    currentNumbersPool = [...new Set(currentNumbersPool)];
                    if (currentNumbersPool.length === 0) currentNumbersPool = ['+16282849090', '+6288269202428', '+6288269202429'];
                    numBatchIndex = 0;
                }

                let batch = currentNumbersPool.slice(numBatchIndex, numBatchIndex + 3);
                if (batch.length === 0) { numBatchIndex = 0; batch = currentNumbersPool.slice(0, 3); }

                let btns = `<div class="btn-row">
                                <button class="btn" onclick="loadCountries('${cSvc}')">🔙 الدول</button>
                                <button class="btn btn-gold" onclick="numBatchIndex += 3; showNumbersList('${country}', '${flag}', false)">🔄 3 أخرى</button>
                            </div><hr style="border-color:#242f3d; margin:5px 0;">`;

                batch.forEach(num => {
                    btns += `
                        <div class="number-item-row">
                            <button class="btn btn-green" onclick="copyText('${num}')">📱 ${num}</button>
                            <button class="btn btn-fetch" onclick="fetchSingleCode('${num}')">🔍 جلب الكود</button>
                        </div>`;
                });
                el('btnArea').innerHTML = btns;
            } catch (e) {
                el('btnArea').innerHTML = '<button class="btn" onclick="showNumbersList(\''+country+'\',\''+flag+'\')">❌ إعادة المحاولة</button>';
            }
        }

        window.onload = () => { render(); };
    </script>
</body>
</html>
