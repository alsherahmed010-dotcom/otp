<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0e1621; --surface: #17212b; --card: #1e293b; --accent: #3b82f6; --gold: #f59e0b; --green: #10b981; --text: #f1f5f9; --text2: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app { width: 100%; max-width: 430px; height: 100vh; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: var(--card); padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .back { color: #fff; font-size: 22px; cursor: pointer; }
        .av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; overflow: hidden; background: var(--accent); flex-shrink: 0; font-weight: bold; }
        .av img { width: 100%; height: 100%; object-fit: cover; }
        .hinfo { flex: 1; }
        .hinfo .n { font-size: 16px; font-weight: 600; color: #fff; }
        .hinfo .s { font-size: 12px; color: var(--text2); }
        .clist { flex: 1; overflow-y: auto; }
        .crow { display: flex; align-items: center; padding: 14px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .crow:hover { background: rgba(255,255,255,0.02); }
        .crow .av { width: 52px; height: 52px; font-size: 22px; }
        .crow .info { flex: 1; }
        .crow .n { font-size: 16px; color: #fff; margin-bottom: 3px; }
        .crow .p { font-size: 14px; color: var(--text2); }
        .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; animation: f 0.15s; }
        @keyframes f { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .mi { align-self: flex-start; background: var(--card); }
        .mo { align-self: flex-end; background: var(--accent); }
        .motp { align-self: flex-start; background: var(--card); border-right: 3px solid var(--gold); }
        .msg .num { color: #60a5fa; font-weight: 700; font-size: 15px; }
        .msg .code { background: var(--gold); color: #000; padding: 3px 10px; border-radius: 5px; font-weight: 700; display: inline-block; margin: 4px 0; font-size: 16px; }
        .msg .time { font-size: 11px; color: var(--text2); margin-top: 4px; }
        .center-num { flex: 1; display: flex; align-items: center; justify-content: center; }
        .center-num .big { text-align: center; font-size: 32px; font-weight: 700; color: #60a5fa; word-break: break-all; }
        .center-num .emoji { font-size: 50px; }
        .ba { padding: 12px; border-top: 1px solid rgba(255,255,255,0.05); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
        .btn { padding: 12px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-align: center; }
        .bblue { background: var(--accent); color: #fff; }
        .bgreen { background: var(--green); color: #fff; }
        .bgold { background: var(--gold); color: #000; }
        .brow { display: flex; gap: 8px; }
        .brow .btn { flex: 1; }
        .ibar { padding: 12px; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .ibar input { flex: 1; background: var(--card); border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
        .ibar button { background: var(--accent); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .nav { display: flex; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
        .ni { flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text2); font-size: 11px; cursor: pointer; gap: 3px; background: none; border: none; }
        .ni.ac { color: var(--accent); }
        .nic { font-size: 20px; }
        .fab { position: absolute; bottom: 85px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; border: none; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(59,130,246,0.4); }
        .fabm { position: absolute; bottom: 145px; right: 20px; display: none; flex-direction: column; gap: 8px; z-index: 10; }
        .fabm button { background: var(--card); color: #fff; padding: 12px 20px; border-radius: 25px; font-size: 14px; cursor: pointer; border: none; }
        .search { padding: 10px 16px; }
        .search input { width: 100%; background: var(--card); border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
        .setup { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 18px; background: var(--surface); }
        .setup h2 { color: #fff; font-size: 22px; }
        .setup .av { width: 85px; height: 85px; font-size: 38px; cursor: pointer; }
        .setup input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .setup input[type="file"] { display: none; }
        .setup .btn { width: 100%; }
        .prof { padding: 25px; text-align: center; flex: 1; overflow-y: auto; }
        .prof .av { width: 80px; height: 80px; font-size: 35px; margin: 0 auto 15px; cursor: pointer; }
        .prof input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 10px; color: #fff; font-size: 15px; text-align: center; margin: 8px 0; outline: none; }
        .admin-panel { padding: 12px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.05); }
        .admin-panel h4 { color: var(--gold); margin-bottom: 8px; }
        .admin-panel input { width: 100%; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #fff; margin-bottom: 8px; }
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        const ADMIN='201500972046';
        
        let S=JSON.parse(localStorage.getItem('t2')||'{}');
        let cur=S.cur||'setup',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let profile=S.profile||{name:'',phone:'',avatar:'',username:''};
        let known=new Set(),otpTimer=null;
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        
        function save(){S={cur,cSvc,cCty,curNum,profile};localStorage.setItem('t2',JSON.stringify(S));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        
        function render(){
            const app=document.getElementById('app');app.innerHTML='';
            if(!profile.name||!profile.phone){cur='setup';app.innerHTML=setupHTML();bindSetup();}
            else if(cur==='main'){app.innerHTML=mainHTML();bindMain();}
            else if(cur==='bot'){app.innerHTML=chatHTML('bot');bindBot();}
            else if(cur==='group'){app.innerHTML=chatHTML('group');bindGroup();}
            else if(cur==='profile'){app.innerHTML=profileHTML();bindProfile();}
            else if(cur==='search'){app.innerHTML=searchHTML();bindSearch();}
            else if(cur==='create_group'||cur==='create_channel'){app.innerHTML=createHTML(cur.replace('create_',''));bindCreate();}
            else if(cur.startsWith('grp_')){app.innerHTML=groupChatHTML(cur.replace('grp_',''));bindGroupChat(cur.replace('grp_',''));}
            else if(cur.startsWith('pv_')){app.innerHTML=privateHTML(cur.replace('pv_',''));bindPrivate(cur.replace('pv_',''));}
        }
        
        function setupHTML(){return '<div class="setup"><h2>🚀 أهلاً بك</h2><div class="av" id="avSetup" onclick="document.getElementById(\'fSetup\').click()">📷</div><input type="file" id="fSetup" accept="image/*" onchange="prevSetup()"><input id="inPhone" placeholder="رقم الهاتف" value="'+profile.phone+'"><input id="inName" placeholder="الاسم" value="'+profile.name+'"><input id="inUser" placeholder="يوزر نيم" value="'+profile.username+'"><button class="btn bblue" id="btnSetup" onclick="saveSetup()">🚀 دخول</button></div>';}
        function mainHTML(){return '<div class="screen"><div class="header"><div class="av">'+(profile.avatar?'<img src="'+profile.avatar+'">':(profile.name?profile.name[0]:'👤'))+'</div><div class="hinfo"><div class="n">Telegram</div><div class="s">'+profile.name+'</div></div></div><div class="search"><input type="text" id="searchInput" placeholder="🔍 بحث برقم أو يوزر..." onkeypress="if(event.key==\'Enter\')doSearch()"></div><div class="clist" id="mainList"><div class="crow" onclick="goTo(\'bot\')"><div class="av" style="background:#3b82f6;">🤖</div><div class="info"><div class="n">🤖 NUMBER BOT</div><div class="p">'+(curNum?'الرقم: '+curNum:'بوت الأرقام')+'</div></div></div><div class="crow" onclick="goTo(\'group\')"><div class="av" style="background:#e17076;">👥</div><div class="info"><div class="n">👥 OTP GROUP</div><div class="p">Live OTP</div></div></div></div><div class="nav"><button class="ni ac" onclick="goTo(\'main\')"><span class="nic">💬</span>محادثات</button><button class="ni" onclick="goTo(\'search\')"><span class="nic">🔍</span>بحث</button><button class="ni" onclick="goTo(\'profile\')"><span class="nic">👤</span>ملف</button></div><button class="fab" id="fabBtn">+</button><div class="fabm" id="fabMenu"><button onclick="goTo(\'create_group\')">👥 مجموعة</button><button onclick="goTo(\'create_channel\')">📢 قناة</button></div></div>';}
        function chatHTML(type){const b=type==='bot';return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="av" id="chatAv" style="background:'+(b?'#3b82f6':'#e17076')+';">'+(b?'🤖':'👥')+'</div><div class="hinfo"><div class="n" id="chatName">'+(b?'🤖 NUMBER BOT':'👥 OTP GROUP')+'</div><div class="s">'+(b?'online':'live')+'</div></div></div><div class="msgs" id="messages" style="'+(b?'':'display:flex;')+'"></div>'+(b?'<div class="ba" id="btnArea"></div><div class="admin-panel" id="adminPanel" style="display:none;"><h4>⚙️ إعدادات</h4><input id="adName" placeholder="الاسم"><input id="adAvatar" placeholder="رابط الصورة"><button class="btn bblue" style="width:100%;" onclick="saveAdmin(\''+type+'\')">💾 حفظ</button></div>':'<div class="ibar"><input type="text" id="groupInput" placeholder="رسالة..." onkeypress="if(event.key==\'Enter\')sendGroupMsg()"><button id="btnGroupSend">📤</button></div>')+'</div>';}
        function searchHTML(){return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="hinfo"><div class="n">🔍 بحث</div></div></div><div style="flex:1;padding:20px;"><input type="text" id="searchInput2" placeholder="رقم أو يوزر..." style="width:100%;background:var(--card);border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;margin-bottom:15px;"><button class="btn bblue" style="width:100%;" id="btnSearch">🔍 بحث</button><div id="searchResult" style="margin-top:15px;"></div></div></div>';}
        function profileHTML(){return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="hinfo"><div class="n">👤 الملف الشخصي</div></div></div><div class="prof"><div class="av" onclick="document.getElementById(\'fProf\').click()">'+(profile.avatar?'<img src="'+profile.avatar+'">':'📷')+'</div><input type="file" id="fProf" accept="image/*" onchange="prevProf()" style="display:none;"><input id="eName" value="'+profile.name+'"><input id="ePhone" value="'+profile.phone+'"><input id="eUser" value="'+profile.username+'"><button class="btn bblue" style="width:100%;margin-top:10px;" id="btnSaveProfile" onclick="saveProfile()">💾 حفظ</button></div></div>';}
        function createHTML(type){return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="hinfo"><div class="n">'+(type==='group'?'👥 مجموعة جديدة':'📢 قناة جديدة')+'</div></div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:18px;"><div class="av" id="avCreate" onclick="document.getElementById(\'fCreate\').click()">📷</div><input type="file" id="fCreate" accept="image/*" onchange="prevCreate()" style="display:none;"><input id="inCreateName" placeholder="الاسم" style="width:100%;background:var(--card);border:1px solid rgba(255,255,255,0.1);padding:15px;border-radius:12px;color:#fff;font-size:16px;text-align:center;"><button class="btn bblue" style="width:100%;" id="btnCreate" onclick="doCreate(\''+type+'\')">✅ إنشاء</button></div></div>';}
        function groupChatHTML(gid){return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="av" id="gAv" style="background:#8b5cf6;cursor:pointer;" onclick="groupSettings(\''+gid+'\')">👥</div><div class="hinfo"><div class="n" id="gName">...</div><div class="s" id="gStatus">...</div></div></div><div class="msgs" id="messages"></div><div class="ibar"><input type="text" id="groupInput2" placeholder="رسالة..." onkeypress="if(event.key==\'Enter\')sendGroupMsg2(\''+gid+'\')"><button id="btnGroupSend2" onclick="sendGroupMsg2(\''+gid+'\')">📤</button></div></div>';}
        function privateHTML(phone){return '<div class="screen"><div class="header"><div class="back" onclick="goTo(\'main\')">←</div><div class="av" id="pAv">👤</div><div class="hinfo"><div class="n" id="pName">...</div><div class="s" id="pStatus">...</div></div></div><div class="msgs" id="messages"></div><div class="ibar"><input type="text" id="privInput" placeholder="رسالة..." onkeypress="if(event.key==\'Enter\')sendPrivMsg(\''+phone+'\')"><button id="btnPrivSend" onclick="sendPrivMsg(\''+phone+'\')">📤</button></div></div>';}
        
        function bindSetup(){if(profile.avatar){const a=document.getElementById('avSetup');if(a)a.innerHTML='<img src="'+profile.avatar+'">';}}
        function bindMain(){const fb=document.getElementById('fabBtn');if(fb)fb.onclick=()=>{const m=document.getElementById('fabMenu');m.style.display=m.style.display==='flex'?'none':'flex';};setTimeout(loadMainGroups,300);}
        function bindBot(){if(profile.phone===ADMIN){document.getElementById('adminPanel').style.display='block';loadAdminData('bot');}if(curNum){document.getElementById('messages').innerHTML='<div class="center-num"><div><div class="emoji">📱</div><div class="big">'+curNum+'</div></div></div>';document.getElementById('btnArea').innerHTML='<div class="brow"><button class="btn bgreen" onclick="copyNum()">📋 نسخ</button><button class="btn bblue" onclick="loadServices()">🌍 دولة</button></div><div class="brow"><button class="btn bblue" onclick="getNumber(\''+cCty+'\',\'\')">🔄 تغيير</button><button class="btn bgold" onclick="checkCode()">📩 كود</button></div>';}else{showStart();}loadChatAvatar('bot');}
        function bindGroup(){if(profile.phone===ADMIN){document.getElementById('adminPanel').style.display='block';loadAdminData('group');}document.getElementById('messages').innerHTML='';const btn=document.getElementById('btnGroupSend');if(btn)btn.onclick=sendGroupMsg;db.ref('group_msgs').off();db.ref('group_msgs').limitToLast(50).on('child_added',s=>showOTPMsg(s.val()));if(otpTimer)clearInterval(otpTimer);otpTimer=setInterval(fetchOTP,2000);fetchOTP();loadChatAvatar('group');}
        function bindSearch(){document.getElementById('btnSearch').onclick=()=>doSearch(document.getElementById('searchInput2').value);}
        function bindProfile(){}
        function bindCreate(){}
        function bindGroupChat(gid){db.ref('groups/'+gid).once('value').then(snap=>{const g=snap.val();if(!g)return goTo('main');const a=document.getElementById('gAv');if(a){if(g.avatar)a.innerHTML='<img src="'+g.avatar+'">';else a.textContent='👥';}document.getElementById('gName').textContent=g.name;document.getElementById('gStatus').textContent=(g.members?g.members.length:0)+' أعضاء';});document.getElementById('messages').innerHTML='';db.ref('groups/'+gid+'/messages').off();db.ref('groups/'+gid+'/messages').limitToLast(50).on('child_added',snap=>{const m=snap.val();const isMe=m.from===profile.phone;document.getElementById('messages').innerHTML+='<div class="msg '+(isMe?'mo':'mi')+'">'+(m.text||'')+'<div class="time">'+(m.time||'')+'</div></div>';document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;});}
        function bindPrivate(phone){db.ref('users/'+btoa(phone)).once('value').then(snap=>{const u=snap.val();if(!u)return goTo('main');const a=document.getElementById('pAv');if(a){if(u.avatar)a.innerHTML='<img src="'+u.avatar+'">';else a.textContent='👤';}document.getElementById('pName').textContent=u.name;document.getElementById('pStatus').textContent=u.phone;});const chatId=[profile.phone,phone].sort().join('_');document.getElementById('messages').innerHTML='';db.ref('chats/'+chatId).off();db.ref('chats/'+chatId).limitToLast(50).on('child_added',snap=>{const m=snap.val();const isMe=m.from===profile.phone;document.getElementById('messages').innerHTML+='<div class="msg '+(isMe?'mo':'mi')+'">'+(m.text||'')+'<div class="time">'+(m.time||'')+'</div></div>';document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;});}
        
        function loadAdminData(type){db.ref('bot_settings').once('value').then(snap=>{const s=snap.val()||{};document.getElementById('adName').value=s[type==='bot'?'name':'otp_name']||'';document.getElementById('adAvatar').value=s[type==='bot'?'avatar':'otp_avatar']||'';});}
        function saveAdmin(type){const n=document.getElementById('adName').value.trim();const a=document.getElementById('adAvatar').value.trim();if(n){db.ref('bot_settings/'+(type==='bot'?'name':'otp_name')).set(n);document.getElementById('chatName').textContent=n;}if(a){db.ref('bot_settings/'+(type==='bot'?'avatar':'otp_avatar')).set(a);document.getElementById('chatAv').innerHTML='<img src="'+a+'">';}alert('✅ تم الحفظ');}
        
        function loadChatAvatar(type){db.ref('bot_settings').once('value').then(snap=>{const s=snap.val()||{};const key=type==='bot'?'avatar':'otp_avatar';const nk=type==='bot'?'name':'otp_name';if(s[key]){const a=document.getElementById('chatAv');if(a)a.innerHTML='<img src="'+s[key]+'">';}if(s[nk]){const n=document.getElementById('chatName');if(n)n.textContent=s[nk];}});}
        
        function loadMainGroups(){db.ref('groups').once('value').then(snap=>{const list=document.getElementById('mainList');if(!list)return;snap.forEach(s=>{const g=s.val();const gid=s.key;if(g.members&&g.members.includes(profile.phone)&&!document.getElementById('grp_'+gid)){list.innerHTML+='<div class="crow" id="grp_'+gid+'" onclick="goTo(\'grp_'+gid+'\')"><div class="av" style="background:#8b5cf6;">'+(g.avatar?'<img src="'+g.avatar+'">':'👥')+'</div><div class="info"><div class="n">'+g.name+'</div><div class="p">مجموعة</div></div></div>';}});});}
        
        function showOTPMsg(m){if(cur!=='group')return;const t=m.time||new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});if(m.type==='otp'){const cn=cNames[m.country]||m.country||'';document.getElementById('messages').innerHTML+='<div class="msg motp">📩 '+m.service+' <span style="color:#10b981;font-size:11px;">'+cn+'</span><br>📱 <span class="num">'+m.number+'</span><br>🔑 <span class="code">'+m.code+'</span><div class="time">'+t+'</div><button class="btn bgold" style="margin-top:6px;width:100%;padding:8px;font-size:13px;" onclick="copyCode(\''+m.code+'\')">📋 نسخ الكود</button></div>';}else{document.getElementById('messages').innerHTML+='<div class="msg '+(m.phone===profile.phone?'mo':'mi')+'">'+m.text+'<div class="time">'+t+'</div></div>';}document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;}
        
        function goTo(page){cur=page;save();if(otpTimer&&page!=='group'){clearInterval(otpTimer);otpTimer=null;}render();}
        function prevSetup(){const f=document.getElementById('fSetup').files[0];if(f){const r=new FileReader();r.onload=function(e){profile.avatar=e.target.result;document.getElementById('avSetup').innerHTML='<img src="'+e.target.result+'">';};r.readAsDataURL(f);}}
        function prevProf(){const f=document.getElementById('fProf').files[0];if(f){const r=new FileReader();r.onload=function(e){profile.avatar=e.target.result;};r.readAsDataURL(f);}}
        function prevCreate(){const f=document.getElementById('fCreate').files[0];if(f){const r=new FileReader();r.onload=function(e){window._createAvatar=e.target.result;document.getElementById('avCreate').innerHTML='<img src="'+e.target.result+'">';};r.readAsDataURL(f);}}
        
        function saveSetup(){profile.phone=document.getElementById('inPhone').value.trim();profile.name=document.getElementById('inName').value.trim()||'مستخدم';profile.username=document.getElementById('inUser').value.trim();if(!profile.phone){alert('أدخل رقم الهاتف');return;}save();db.ref('users/'+btoa(profile.phone)).set(profile);cur='main';render();}
        function saveProfile(){profile.name=document.getElementById('eName').value.trim()||profile.name;profile.phone=document.getElementById('ePhone').value.trim()||profile.phone;profile.username=document.getElementById('eUser').value.trim();save();db.ref('users/'+btoa(profile.phone)).set(profile);goTo('main');}
        function doCreate(type){const name=document.getElementById('inCreateName').value.trim();if(!name){alert('أدخل اسماً');return;}const data={name,createdBy:profile.phone,members:type==='group'?[profile.phone]:[],avatar:window._createAvatar||'',type};db.ref('groups').push(data).then(ref=>{alert('✅ تم!');goTo('grp_'+ref.key);});}
        function doSearch(q){if(!q)return;const res=document.getElementById('searchResult');res.innerHTML='جاري البحث...';db.ref('users/'+btoa(q)).once('value').then(s=>{if(s.val()){const u=s.val();res.innerHTML='<div style="background:var(--card);padding:15px;border-radius:10px;cursor:pointer;" onclick="goTo(\'pv_'+u.phone+'\')"><b>'+u.name+'</b><br>📱 '+u.phone+'</div>';}else{res.innerHTML='❌ لم يتم العثور';}});}
        function groupSettings(gid){if(!confirm('⚙️ إعدادات المجموعة'))return;const opt=prompt('1 - إضافة عضو\n2 - حذف المجموعة');if(opt==='1'){const q=prompt('يوزر العضو:');if(q)db.ref('users').orderByChild('username').equalTo(q).once('value').then(s=>{if(s.val()){const u=Object.values(s.val())[0];db.ref('groups/'+gid+'/members').once('value').then(s2=>{const m=s2.val()||[];if(!m.includes(u.phone)){m.push(u.phone);db.ref('groups/'+gid+'/members').set(m);alert('✅ تم');}else alert('موجود');});}else alert('❌');});}else if(opt==='2'){if(confirm('حذف؟')){db.ref('groups/'+gid).remove();goTo('main');}}}
        
        function copyCode(c){navigator.clipboard.writeText(c);}
        function copyNum(){if(curNum)navigator.clipboard.writeText(curNum);}
        
        async function fetchOTP(){try{const d=await api('/api/otp?count=15');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('group_msgs').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],country:i[4]||'',time:new Date().toLocaleTimeString('ar-EG')});}});}catch(e){}}
        function sendGroupMsg(){const inp=document.getElementById('groupInput');const tx=inp.value.trim();if(!tx)return;db.ref('group_msgs').push({type:'user',text:tx,sender:profile.name,phone:profile.phone,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        function sendGroupMsg2(gid){const inp=document.getElementById('groupInput2');const tx=inp.value.trim();if(!tx)return;db.ref('groups/'+gid+'/messages').push({text:tx,sender:profile.name,from:profile.phone,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        function sendPrivMsg(phone){const inp=document.getElementById('privInput');const tx=inp.value.trim();if(!tx)return;const chatId=[profile.phone,phone].sort().join('_');db.ref('chats/'+chatId).push({text:tx,from:profile.phone,to:phone,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        
        function showStart(){document.getElementById('messages').innerHTML='<div class="center-num"><div style="font-size:18px;color:#fff;">👋 أهلًا بك في NUMBER BOT!<br><br>اضغط START للبدء</div></div>';document.getElementById('btnArea').innerHTML='<button class="btn bblue" style="width:100%;" onclick="loadServices()">▶️ START</button>';}
        
        async function loadServices(){document.getElementById('btnArea').innerHTML='';try{const d=await api('/api/services');if(d.success){let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2===0)btns+='<div class="brow">';btns+='<button class="btn bblue" onclick="loadCountries(\''+s.key+'\',\''+s.name+'\')">'+s.name+' ('+s.count+')</button>';if(i%2===1||i===d.services.length-1)btns+='</div>';});document.getElementById('btnArea').innerHTML=btns;}}catch(e){}}
        
        async function loadCountries(key,name){cSvc=key;save();document.getElementById('btnArea').innerHTML='';try{const d=await api('/api/countries?service='+key);if(d.success){let btns='';d.countries.slice(0,10).forEach((c,i)=>{const cn=cNames[c.name]||c.name;if(i%2===0)btns+='<div class="brow">';btns+='<button class="btn bblue" onclick="getNumber(\''+c.name+'\',\''+c.flag+'\')">'+c.flag+' '+cn+' ('+c.count+')</button>';if(i%2===1||i===d.countries.length-1)btns+='</div>';});document.getElementById('btnArea').innerHTML=btns;}}catch(e){}}
        
        async function getNumber(country,flag){cCty=country;save();document.getElementById('btnArea').innerHTML='';const d=await api('/api/otp?count=60');if(Array.isArray(d)){let flt=d.filter(i=>i[4]&&i[4].trim().toUpperCase()===country.toUpperCase()&&i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length===0)flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[Math.floor(Math.random()*flt.length)][1];save();const cn=cNames[country]||country;document.getElementById('messages').innerHTML='<div class="center-num"><div><div class="emoji">📱</div><div class="big">'+curNum+'</div><div style="color:#10b981;margin-top:8px;">'+flag+' '+cn+'</div></div></div>';document.getElementById('btnArea').innerHTML='<div class="brow"><button class="btn bgreen" onclick="copyNum()">📋 نسخ</button><button class="btn bblue" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 تغيير</button></div><div class="brow"><button class="btn bblue" onclick="loadServices()">🌍 دولة</button><button class="btn bgold" onclick="checkCode()">📩 كود</button></div>';}else{alert('❌ لا توجد أرقام');document.getElementById('btnArea').innerHTML='<button class="btn bblue" style="width:100%;" onclick="loadServices()">🔙 رجوع</button>';}}}
        
        async function checkCode(){if(!curNum)return;const d=await api('/api/otp?count=50');if(Array.isArray(d)){const f=d.find(i=>i[1]===curNum);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];document.getElementById('messages').innerHTML='<div class="center-num"><div><div class="emoji">✅</div><div class="big" style="font-size:36px;color:#f59e0b;">'+cd+'</div><div style="color:#fff;margin-top:8px;">'+curNum+'</div></div></div>';}else{alert('⏳ لم يصل الكود بعد');}}}
        
        window.onload=()=>{if(!profile.name||!profile.phone){cur='setup';}else if(!cur||cur==='setup'){cur='main';}render();};
    </script>
</body>
</html>
