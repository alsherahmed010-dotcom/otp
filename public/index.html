<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0e1621; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app { width: 100%; max-width: 430px; height: 100vh; background: #17212b; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .setup { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 20px; background: #17212b; }
        .setup h2 { color: #fff; font-size: 22px; }
        .setup .avatar { width: 90px; height: 90px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; cursor: pointer; overflow: hidden; }
        .setup .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .setup input { width: 100%; background: #242f3d; border: 1px solid #334155; padding: 16px; border-radius: 12px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .setup input:focus { border-color: #3b82f6; }
        .setup input[type="file"] { display: none; }
        .setup .btn { width: 100%; padding: 16px; border-radius: 12px; background: #3b82f6; color: #fff; border: none; font-size: 17px; font-weight: 600; cursor: pointer; }
        
        .header { background: #242f3d; padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #111822; }
        .back { color: #fff; font-size: 22px; cursor: pointer; }
        .avatar-sm { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; overflow: hidden; background: #2b5278; flex-shrink: 0; }
        .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; }
        .header-info .name { font-size: 16px; color: #fff; font-weight: 600; }
        .header-info .status { font-size: 12px; color: #7d8b99; }
        
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-row { display: flex; align-items: center; padding: 14px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .chat-row:hover { background: rgba(255,255,255,0.02); }
        .chat-row .avatar-sm { width: 52px; height: 52px; font-size: 22px; }
        .chat-row .info { flex: 1; }
        .chat-row .name { font-size: 16px; color: #fff; margin-bottom: 3px; }
        .chat-row .preview { font-size: 14px; color: #7d8b99; }
        
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #0e1621; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg-in { align-self: flex-start; background: #182533; border: 1px solid #242f3d; }
        .msg-out { align-self: flex-end; background: #2b5278; }
        .msg-otp { align-self: flex-start; background: #182533; border-right: 3px solid #f59e0b; }
        .msg .sender { font-size: 12px; color: #64b5f6; font-weight: 600; margin-bottom: 3px; }
        .msg .number { color: #60a5fa; font-weight: 700; font-size: 15px; }
        .msg .code { background: #f59e0b; color: #000; padding: 3px 10px; border-radius: 5px; font-weight: 700; display: inline-block; margin: 4px 0; font-size: 16px; }
        .msg .time { font-size: 11px; color: #7d8b99; margin-top: 4px; }
        
        .btn-area { padding: 12px; border-top: 1px solid #111822; background: #17212b; display: flex; flex-direction: column; gap: 8px; }
        .btn { padding: 12px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-align: center; }
        .btn-blue { background: #2b5278; color: #fff; }
        .btn-green { background: #2e8b57; color: #fff; }
        .btn-gold { background: #f59e0b; color: #000; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        
        .input-bar { padding: 12px; background: #17212b; border-top: 1px solid #111822; display: flex; gap: 10px; }
        .input-bar input { flex: 1; background: #242f3d; border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
        .input-bar button { background: #2b5278; color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        
        .nav-bar { display: flex; background: #17212b; border-top: 1px solid #111822; padding: 8px 0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 11px; cursor: pointer; gap: 3px; background: none; border: none; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 20px; }
        .fab { position: absolute; bottom: 80px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #3b82f6; color: #fff; font-size: 24px; border: none; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(59,130,246,0.4); }
        
        .search-bar { padding: 10px 16px; }
        .search-bar input { width: 100%; background: #242f3d; border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
        
        .profile-page { padding: 20px; text-align: center; flex: 1; overflow-y: auto; }
        .profile-page .avatar-sm { width: 80px; height: 80px; font-size: 35px; margin: 0 auto 15px; cursor: pointer; }
        .profile-page input { width: 100%; background: #242f3d; border: 1px solid #334155; padding: 14px; border-radius: 10px; color: #fff; font-size: 15px; text-align: center; margin: 8px 0; outline: none; }
        
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        
        let S=JSON.parse(localStorage.getItem('hub_x')||'{}');
        let cur=S.cur||'setup',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let profile=S.profile||{name:'',phone:'',avatar:'',username:''};
        let known=new Set(),otpTimer=null;
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        
        function save(){localStorage.setItem('hub_x',JSON.stringify({cur,cSvc,cCty,curNum,profile}));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        function el(id){return document.getElementById(id);}
        
        function render(){
            const app=el('app');
            if(cur==='setup'){
                app.innerHTML='<div class="setup"><h2>🚀 أهلاً بك</h2><div class="avatar" id="avSetup" onclick="document.getElementById(\'fSetup\').click()">📷</div><input type="file" id="fSetup" accept="image/*" onchange="prevSetup(this)"><input id="inPhone" type="tel" placeholder="رقم الهاتف (مثال: +201500972046)" value="'+profile.phone+'"><input id="inName" placeholder="الاسم" value="'+profile.name+'"><input id="inUser" placeholder="يوزر نيم (اختياري)" value="'+profile.username+'"><button class="btn" onclick="saveSetup()">🚀 دخول</button></div>';
                if(profile.avatar){setTimeout(()=>{const a=el('avSetup');if(a)a.innerHTML='<img src="'+profile.avatar+'">';},100);}
            }else if(cur==='main'){
                app.innerHTML='<div class="screen"><div class="header"><div class="avatar-sm" onclick="openScreen(\'profile\')">'+(profile.avatar?'<img src="'+profile.avatar+'">':(profile.name?profile.name[0]:'👤'))+'</div><div class="header-info"><div class="name">OTP Hub</div><div class="status">'+profile.name+'</div></div></div><div class="search-bar"><input type="text" placeholder="🔍 بحث برقم أو يوزر..." onkeypress="if(event.key==\'Enter\')search(this.value)"></div><div class="chat-list"><div class="chat-row" onclick="openChat(\'bot\')"><div class="avatar-sm" style="background:#3b82f6;">🤖</div><div class="info"><div class="name">🤖 NUMBER BOT</div><div class="preview">'+(curNum?'الرقم: '+curNum:'بوت الأرقام والخدمات')+'</div></div></div><div class="chat-row" onclick="openChat(\'group\')"><div class="avatar-sm" style="background:#e17076;">👥</div><div class="info"><div class="name">👥 OTP GROUP</div><div class="preview">Live OTP</div></div></div></div><div class="nav-bar"><button class="nav-item active" onclick="openScreen(\'main\')"><span class="nav-icon">💬</span>محادثات</button><button class="nav-item" onclick="openScreen(\'profile\')"><span class="nav-icon">👤</span>ملف</button></div><button class="fab" onclick="showFab()">+</button></div>';
            }else if(cur==='bot'||cur==='group'){
                const isBot=cur==='bot';
                app.innerHTML='<div class="screen"><div class="header"><div class="back" onclick="goBack()">←</div><div class="avatar-sm" style="background:'+(isBot?'#3b82f6':'#e17076')+';">'+(isBot?'🤖':'👥')+'</div><div class="header-info"><div class="name">'+(isBot?'🤖 NUMBER BOT':'👥 OTP GROUP')+'</div><div class="status">'+(isBot?'online':'live')+'</div></div></div><div class="messages" id="messages"></div>'+(isBot?'<div class="btn-area" id="btnArea"></div>':'<div class="input-bar"><input type="text" id="groupInput" placeholder="رسالة..." onkeypress="if(event.key===\'Enter\')sendGroupMsg()"><button onclick="sendGroupMsg()">📤</button></div>')+'</div>';
            }else if(cur==='profile'){
                app.innerHTML='<div class="screen"><div class="header"><div class="back" onclick="goBack()">←</div><div class="header-info"><div class="name">👤 الملف الشخصي</div></div></div><div class="profile-page"><div class="avatar-sm" onclick="document.getElementById(\'fProf\').click()">'+(profile.avatar?'<img src="'+profile.avatar+'">':'📷')+'</div><input type="file" id="fProf" accept="image/*" onchange="prevProf(this)"><input id="eName" placeholder="الاسم" value="'+profile.name+'"><input id="ePhone" placeholder="رقم الهاتف" value="'+profile.phone+'"><input id="eUser" placeholder="يوزر نيم" value="'+profile.username+'"><button class="btn btn-blue" style="width:100%;margin-top:10px;" onclick="saveProfile()">💾 حفظ</button></div></div>';
            }
            bindEvents();
        }
        
        function prevSetup(i){const f=i.files[0];if(f){const r=new FileReader();r.onload=function(e){profile.avatar=e.target.result;const a=el('avSetup');if(a)a.innerHTML='<img src="'+e.target.result+'">';};r.readAsDataURL(f);}}
        function prevProf(i){const f=i.files[0];if(f){const r=new FileReader();r.onload=function(e){profile.avatar=e.target.result;};r.readAsDataURL(f);}}
        function saveSetup(){profile.phone=el('inPhone').value.trim();profile.name=el('inName').value.trim()||'مستخدم';profile.username=el('inUser').value.trim();if(!profile.phone){alert('من فضلك أدخل رقم الهاتف');return;}save();db.ref('users/'+btoa(profile.phone)).set(profile);cur='main';render();}
        function saveProfile(){profile.name=el('eName').value.trim()||profile.name;profile.phone=el('ePhone').value.trim()||profile.phone;profile.username=el('eUser').value.trim();save();db.ref('users/'+btoa(profile.phone)).set(profile);cur='main';render();}
        
        function bindEvents(){
            if(cur==='bot'){
                if(curNum){el('messages').innerHTML='<div class="msg msg-in">📱 <span class="number">'+curNum+'</span></div>';el('btnArea').innerHTML='<div class="btn-row"><button class="btn btn-green" onclick="copyNum(\''+curNum+'\')">📋 نسخ</button><button class="btn btn-blue" onclick="loadServices()">🌍 دولة</button></div><div class="btn-row"><button class="btn btn-blue" onclick="getNumber(\''+cCty+'\',\'\')">🔄 تغيير</button><button class="btn btn-gold" onclick="checkCode(\''+curNum+'\')">📩 كود</button></div>';}else showStart();}
            if(cur==='group'){el('messages').innerHTML='';db.ref('group_msgs').off();db.ref('group_msgs').limitToLast(50).on('child_added',s=>{if(cur==='group')showGroupMsg(s.val())});if(otpTimer)clearInterval(otpTimer);otpTimer=setInterval(fetchOTP,2000);fetchOTP();}
        }
        
        function showGroupMsg(m){
            if(cur!=='group')return;
            const t=m.time||new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            const isMe=m.phone===profile.phone;
            if(m.type==='otp'){
                const cn=cNames[m.country]||m.country||'';
                el('messages').innerHTML+='<div class="msg msg-otp">📩 '+m.service+' <span style="color:#10b981;font-size:11px;">'+cn+'</span><br>📱 <span class="number">'+m.number+'</span><br>🔑 <span class="code">'+m.code+'</span><div class="time">'+t+'</div><button class="btn btn-gold" style="margin-top:6px;width:100%;padding:8px;font-size:13px;" onclick="copyCode(\''+m.code+'\')">📋 نسخ الكود</button></div>';
            }else{
                el('messages').innerHTML+='<div class="msg '+(isMe?'msg-out':'msg-in')+'"><div class="sender" onclick="showContact(\''+m.phone+'\',\''+m.sender+'\')">👤 '+m.sender+'</div>'+m.text+'<div class="time">'+t+'</div></div>';
            }
            el('messages').scrollTop=el('messages').scrollHeight;
        }
        
        function showContact(phone,name){if(confirm('👤 '+name+'\n📱 '+phone+'\n\nفتح واتساب؟'))window.open('https://wa.me/'+phone.replace(/\D/g,''),'_blank');}
        function copyCode(c){navigator.clipboard.writeText(c);}
        function copyNum(n){navigator.clipboard.writeText(n);}
        function openScreen(s){cur=s;save();if(otpTimer)clearInterval(otpTimer);render();}
        function openChat(t){cur=t;save();render();}
        function goBack(){cur='main';save();if(otpTimer)clearInterval(otpTimer);render();}
        
        async function fetchOTP(){try{const d=await api('/api/otp?count=15');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('group_msgs').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],country:i[4]||'',time:new Date().toLocaleTimeString('ar-EG')});}});}catch(e){}}
        function sendGroupMsg(){const inp=el('groupInput'),tx=inp.value.trim();if(!tx||!profile.name)return;db.ref('group_msgs').push({type:'user',text:tx,sender:profile.name,phone:profile.phone,avatar:profile.avatar,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        
        function showFab(){
            const opt=prompt('➕ ماذا تريد أن تنشئ؟\n\n1 - 👥 مجموعة\n2 - 📢 قناة\n3 - 💬 محادثة جديدة\n\nاكتب الرقم:');
            if(opt==='1'){const n=prompt('اسم المجموعة:');if(n)alert('✅ تم إنشاء: '+n);}
            else if(opt==='2'){const n=prompt('اسم القناة:');if(n)alert('✅ تم إنشاء: '+n);}
            else if(opt==='3'){const p=prompt('رقم الهاتف (مع كود الدولة):');if(p){db.ref('users/'+btoa(p)).once('value').then(s=>{if(s.val()){if(confirm('👤 '+s.val().name+'\n📱 '+p+'\n\nفتح واتساب؟'))window.open('https://wa.me/'+p.replace(/\D/g,''),'_blank');}else{alert('❌ المستخدم غير مسجل');}});}}
        }
        
        function search(q){if(!q)return;db.ref('users').orderByChild('username').equalTo(q).once('value').then(s=>{if(s.val()){const u=Object.values(s.val())[0];if(confirm('👤 '+u.name+'\n📱 '+u.phone+'\n\nفتح واتساب؟'))window.open('https://wa.me/'+u.phone.replace(/\D/g,''),'_blank');}else{alert('❌ لم يتم العثور');}});}
        
        function showStart(){el('messages').innerHTML='<div class="msg msg-in">👋 أهلًا بك في NUMBER BOT!</div>';el('btnArea').innerHTML='<button class="btn btn-blue" style="width:100%;" onclick="loadServices()">▶️ START</button>';}
        async function loadServices(){el('btnArea').innerHTML='';try{const d=await api('/api/services');if(d.success){let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-blue" onclick="loadCountries(\''+s.key+'\',\''+s.name+'\')">'+s.name+' ('+s.count+')</button>';if(i%2===1||i===d.services.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function loadCountries(key,name){cSvc=key;save();el('btnArea').innerHTML='';try{const d=await api('/api/countries?service='+key);if(d.success){let btns='';d.countries.slice(0,10).forEach((c,i)=>{const cn=cNames[c.name]||c.name;if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-blue" onclick="getNumber(\''+c.name+'\',\''+c.flag+'\')">'+c.flag+' '+cn+' ('+c.count+')</button>';if(i%2===1||i===d.countries.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function getNumber(country,flag){cCty=country;save();el('btnArea').innerHTML='';try{const d=await api('/api/otp?count=30');if(Array.isArray(d)){const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[Math.floor(Math.random()*Math.min(flt.length,5))][1];save();const cn=cNames[country]||country;el('messages').innerHTML+='<div class="msg msg-in">📱 <span class="number">'+curNum+'</span><br><span style="color:#10b981;">'+flag+' '+cn+'</span></div>';el('btnArea').innerHTML='<div class="btn-row"><button class="btn btn-green" onclick="copyNum(\''+curNum+'\')">📋 نسخ</button><button class="btn btn-blue" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 تغيير</button></div><div class="btn-row"><button class="btn btn-blue" onclick="loadServices()">🌍 دولة</button><button class="btn btn-gold" onclick="checkCode(\''+curNum+'\')">📩 كود</button></div>';}else{el('btnArea').innerHTML='<button class="btn btn-blue" style="width:100%;" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 جرب تاني</button>';}}}catch(e){}}
        async function checkCode(num){try{const d=await api('/api/otp?count=40');if(Array.isArray(d)){const f=d.find(i=>i[1]===num);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];el('messages').innerHTML+='<div class="msg msg-in">✅ الكود: <span class="code">'+cd+'</span></div>';el('messages').scrollTop=el('messages').scrollHeight;}else{el('messages').innerHTML+='<div class="msg msg-in">⏳ لم يصل بعد...</div>';el('messages').scrollTop=el('messages').scrollHeight;}}}catch(e){}}
        
        window.onload=()=>{
            if(!profile.name||!profile.phone){cur='setup';render();}else{cur=S.cur||'main';render();}
        };
    </script>
</body>
</html>
