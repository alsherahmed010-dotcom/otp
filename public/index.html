<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أرقام وهمية لجميع المنصات - استلم الكود في ثواني مجاناً</title>
<meta name="description" content="أرقام وهمية لتفعيل الواتساب وفيسبوك وتيك توك وجميع المنصات. استلم كود التفعيل في ثواني مجاناً.">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
body{background:#000;color:#0f0;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:2px solid #0f0;margin-bottom:10px}
.header h1{font-size:20px;letter-spacing:1px;text-shadow:0 0 10px #0f0}
.header-icons{display:flex;gap:12px}
.icon-btn{background:none;border:none;color:#0f0;font-size:22px;cursor:pointer;padding:5px}
.online-dot{display:inline-block;width:10px;height:10px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-left:5px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.top-bar{display:flex;gap:8px;margin-bottom:15px}
.search-box{flex:1;background:#0a0a0a;border:1px solid #1a3a1a;color:#0f0;padding:12px;font-size:14px;border-radius:8px;outline:none}
.search-box:focus{border-color:#0f0}
.btn-sm{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:12px 14px;font-size:13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:bold}
.btn-sm:hover{background:#0f0;color:#000}
.card{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;animation:in 0.2s}
.card:hover{border-color:#0f0}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card .flag{font-size:32px;min-width:45px;text-align:center}
.card .info{flex:1}
.card .phone{color:#fff;font-weight:bold;font-size:16px;direction:ltr}
.card .code{font-size:28px;font-weight:bold;color:#ff0;letter-spacing:2px;direction:ltr;text-shadow:0 0 10px #ff0}
.stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.num-box{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.num-box:hover{border-color:#0f0}
.num-box .flag{font-size:28px}
.num-box .svc{color:#f00;font-size:10px}
.num-box .num{color:#fff;font-weight:bold;font-size:16px;direction:ltr}
.num-box .code{background:#000;border:1px solid #ff0;color:#ff0;padding:4px 10px;border-radius:4px;font-weight:bold;font-size:16px;direction:ltr;display:inline-block;margin-top:6px}
.tag{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-size:14px;display:inline-block;margin:4px}
.tag:hover{border-color:#0f0}
.tag .name{color:#fff;font-weight:bold}
.tag .count{color:#ff0;font-size:12px}
.tag .flag{font-size:24px}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn-sm{flex:1;min-width:80px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-content{background:#0a0a0a;border:1px solid #0f0;border-radius:12px;padding:20px;width:90%;max-width:400px}
.modal-content h3{color:#0f0;margin-bottom:15px;text-align:center}
.modal-content select{width:100%;background:#000;border:1px solid #0f0;color:#0f0;padding:10px;border-radius:8px;font-size:14px}
.modal-content button{margin-top:15px;width:100%}
.footer{text-align:center;padding:15px;color:#0a0;font-size:10px;margin-top:20px;border-top:1px solid #1a3a1a}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
const db=firebase.database();
var PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
var allCards=[],page='main';
var lang=localStorage.getItem('lang')||'ar';
var myNums=JSON.parse(localStorage.getItem('myNums')||'[]');
var flags={TG:'🇹🇬',LB:'🇱🇧',UA:'🇺🇦',AM:'🇦🇲',MZ:'🇲🇿',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',ID:'🇮🇩'};
var cNames={TG:'توجو',LB:'لبنان',UA:'أوكرانيا',AM:'أرمينيا',MZ:'موزمبيق',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',ID:'إندونيسيا'};

var t={
ar:{live:'OTP LIVE',search:'🔍 بحث برقم أو كود...',analysis:'🏆 تحليل',numbers:'📱 أرقام',back:'← رجوع',change:'🔄 تغيير',country:'🌍 دولة',service:'📱 خدمة',codes:'📩 أكواد',loading:'⏳ جاري التحميل...',nocodes:'❌ لا توجد أكواد',online:'متصلين',settings:'الإعدادات',chooseLang:'اختر اللغة',save:'حفظ',notif:'الإشعارات مفعلة',notifOff:'الإشعارات معطلة'},
en:{live:'OTP LIVE',search:'🔍 Search...',analysis:'🏆 Analysis',numbers:'📱 Numbers',back:'← Back',change:'🔄 Refresh',country:'🌍 Country',service:'📱 Service',codes:'📩 Codes',loading:'⏳ Loading...',nocodes:'❌ No codes',online:'Online',settings:'Settings',chooseLang:'Choose Language',save:'Save',notif:'Notifications Enabled',notifOff:'Notifications Disabled'},
fr:{live:'OTP LIVE',search:'🔍 Rechercher...',analysis:'🏆 Analyse',numbers:'📱 Numéros',back:'← Retour',change:'🔄 Changer',country:'🌍 Pays',service:'📱 Service',codes:'📩 Codes',loading:'⏳ Chargement...',nocodes:'❌ Aucun code',online:'En ligne',settings:'Paramètres',chooseLang:'Choisir la langue',save:'Enregistrer',notif:'Notifications activées',notifOff:'Notifications désactivées'}
};

function _(key){return (t[lang]&&t[lang][key])||t['ar'][key]||key;}

var uid=Date.now()+'-'+Math.random().toString(36);
var myRef=db.ref('online/'+uid);myRef.set({time:Date.now()});myRef.onDisconnect().remove();
window.addEventListener('beforeunload',function(){myRef.remove();});
db.ref('online').on('value',function(snap){var count=snap.numChildren();var el=document.getElementById('onlineCount');if(el)el.textContent=count;});

function saveNums(){localStorage.setItem('myNums',JSON.stringify(myNums));}
function extractCode(txt){var m=txt.match(/\d{3,8}[-.\s]?\d{3,8}/);if(m)return m[0];m=txt.match(/\d{4,8}/);return m?m[0]:txt.substring(0,15);}

function showMain(){
    page='main';
    document.getElementById('app').innerHTML='<div class="header"><h1>⬢ '+_('live')+' <span class="online-dot"></span> <span id="onlineCount">0</span></h1><div class="header-icons"><button class="icon-btn" onclick="showSettings()">⚙️</button></div></div><div class="top-bar"><input type="text" class="search-box" id="search" placeholder="'+_('search')+'" onkeyup="filter()"><button class="btn-sm" onclick="showAnalysis()">'+_('analysis')+'</button><button class="btn-sm" onclick="showNumbers()">'+_('numbers')+'</button></div><div id="cards"></div><div class="stats" id="stats">⬢ 0 codes</div><div class="footer">أرقام وهمية لجميع المنصات - استلم كود التفعيل مجاناً</div>';
    renderCards();
    if(myNums.length>0){showMyNums();}
}

function renderCards(){
    var q=(document.getElementById('search')?document.getElementById('search').value:'').toLowerCase();
    var html='';for(var i=0;i<allCards.length;i++){if(!q||allCards[i].search.toLowerCase().indexOf(q)>=0)html+=allCards[i].html;}
    var cards=document.getElementById('cards');if(cards)cards.innerHTML=html;
}
function filter(){renderCards();}

function showMyNums(){
    var container=document.getElementById('cards');
    if(!container) return;
    var html='<div style="margin-top:15px"><h3 style="color:#ff0;margin-bottom:8px">💾 أرقامي ('+myNums.length+')</h3><div class="grid2">';
    myNums.forEach(function(n, idx){
        html+='<div class="num-box" onclick="navigator.clipboard.writeText(\''+n.num+'\')"><div class="flag">'+(n.flag||'🌍')+'</div><div class="svc">'+n.svc+'</div><div class="num">+'+n.num+'</div><div class="code" id="live_cd_'+idx+'">'+(n.code||'---')+'</div></div>';
    });
    html+='</div></div>';
    container.insertAdjacentHTML('beforeend',html);
}

function showSettings(){
    var html='<div class="modal"><div class="modal-content"><h3>⚙️ '+_('settings')+'</h3><p style="color:#0f0;margin-bottom:8px;">'+_('chooseLang')+':</p><select id="langSelect">';
    var langs={ar:'🇸🇦 العربية',en:'🇺🇸 English',fr:'🇫🇷 Français'};
    for(var k in langs){html+='<option value="'+k+'"'+(k===lang?' selected':'')+'>'+langs[k]+'</option>';}
    html+='</select><button class="btn-sm" onclick="saveLang()">💾 '+_('save')+'</button><button class="btn-sm" style="margin-top:8px;background:#333;" onclick="closeModal()">✕ إغلاق</button></div></div>';
    document.getElementById('app').insertAdjacentHTML('beforeend',html);
}

function saveLang(){
    lang=document.getElementById('langSelect').value;
    localStorage.setItem('lang',lang);
    closeModal();
    showMain();
}
function closeModal(){var m=document.querySelector('.modal');if(m)m.remove();}

function showAnalysis(){page='analysis';document.getElementById('app').innerHTML='<div class="header"><h1>'+_('analysis')+'</h1></div><button class="btn-sm" onclick="showMain()">'+_('back')+'</button><div id="content" style="margin-top:10px;">'+_('loading')+'</div>';fetch(PROXY+'/api/otp?count=100').then(r=>r.json()).then(d=>{if(!Array.isArray(d))return;var svcs={};d.forEach(i=>{var svc=i[0];if(!svcs[svc])svcs[svc]={};var ct=(i[4]||'').trim();if(ct)svcs[svc][ct]=(svcs[svc][ct]||0)+1;});var html='';for(var svc in svcs){var top=[];for(var k in svcs[svc])top.push([k,svcs[svc][k]]);top.sort((a,b)=>b[1]-a[1]);top=top.slice(0,5);html+='<div style="margin-bottom:15px"><h3 style="color:#ff0">📱 '+svc+'</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';for(var i=0;i<top.length;i++){html+='<div class="tag"><div class="flag">'+(flags[top[i][0]]||'🌍')+'</div><div class="name">'+(cNames[top[i][0]]||top[i][0])+'</div><div class="count">'+top[i][1]+'</div></div>';}html+='</div></div>';}document.getElementById('content').innerHTML=html;}).catch(()=>{document.getElementById('content').innerHTML=_('nocodes');});}

function showNumbers(){page='services';document.getElementById('app').innerHTML='<div class="header"><h1>'+_('numbers')+'</h1></div><button class="btn-sm" onclick="showMain()">'+_('back')+'</button><div id="content" style="margin-top:10px;">'+_('loading')+'</div>';fetch(PROXY+'/api/services').then(r=>r.json()).then(d=>{if(!d.success)return;var html='';d.services.forEach(s=>{html+='<div class="tag" onclick="showCountries(\''+s.key+'\',\''+s.name+'\')"><div class="name">'+s.name+'</div><div class="count">'+s.count+'</div></div>';});document.getElementById('content').innerHTML=html;}).catch(()=>{document.getElementById('content').innerHTML=_('nocodes');});}

function showCountries(key,name){document.getElementById('app').innerHTML='<div class="header"><h1>🌍 '+name+'</h1></div><button class="btn-sm" onclick="showNumbers()">'+_('back')+'</button><div id="content" style="margin-top:10px;">'+_('loading')+'</div>';fetch(PROXY+'/api/countries?service='+key).then(r=>r.json()).then(d=>{if(!d.success)return;var html='';d.countries.forEach(c=>{html+='<div class="tag" onclick="showNums(\''+c.name+'\',\''+(c.flag||'')+'\',\''+name+'\',\''+key+'\')"><div class="flag">'+(c.flag||'🌍')+'</div><div class="name">'+(cNames[c.name]||c.name)+'</div><div class="count">'+c.count+'</div></div>';});document.getElementById('content').innerHTML=html;}).catch(()=>{document.getElementById('content').innerHTML=_('nocodes');});}

function showNums(country,flag,svcName,svcKey){
    document.getElementById('app').innerHTML='<div class="header"><h1>'+flag+' '+(cNames[country]||country)+'</h1></div><button class="btn-sm" onclick="showCountries(\''+svcKey+'\',\''+svcName+'\')">'+_('back')+'</button><div id="numsArea" style="margin-top:10px;">'+_('loading')+'</div>';
    var promises=[];for(var i=0;i<4;i++){promises.push(fetch(PROXY+'/api/request_number',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:svcKey,country:country})}).then(r=>r.json()));}
    Promise.all(promises).then(results=>{
        myNums=[];var html='<div class="grid2">';
        results.forEach((d, idx)=>{
            if(d&&d.number){
                myNums.push({num:d.number,flag:d.flag||flag,svc:svcName,country:country,code:''});
                html+='<div class="num-box" onclick="navigator.clipboard.writeText(\''+d.number+'\')"><div class="flag">'+(d.flag||flag||'🌍')+'</div><div class="svc">'+svcName+'</div><div class="num">+'+d.number+'</div><div class="code" id="live_cd_'+idx+'">---</div></div>';
            }
        });
        saveNums();
        html+='</div><div class="btn-row"><button class="btn-sm" onclick="showNums(\''+country+'\',\''+flag+'\',\''+svcName+'\',\''+svcKey+'\')">'+_('change')+'</button><button class="btn-sm" onclick="showCountries(\''+svcKey+'\',\''+svcName+'\')">'+_('country')+'</button><button class="btn-sm" onclick="showNumbers()">'+_('service')+'</button></div>';
        document.getElementById('numsArea').innerHTML=html;
    }).catch(()=>{document.getElementById('numsArea').innerHTML=_('nocodes');});
}

// تحديث تلقائي حقيقي للأكواد وأنت قاعد في مكانك
function liveUpdate(){
    fetch(PROXY+'/api/otp?count=30').then(r=>r.json()).then(d=>{
        if(!Array.isArray(d))return;
        
        // 1. تحديث الصفحة الرئيسية (الأكواد العامة)
        d.forEach(i=>{
            var code=extractCode(i[2]||'');
            var ct=(i[4]||'').trim();
            var flag=flags[ct]||'🌍';
            var cardId='card_'+i[1];
            var fullKey=i[1]+'-'+i[2];
            
            // لو الكود مش موجود في القائمة، ضيفه فوق
            if(!allCards.some(x=>x.key===fullKey)){
                var html='<div class="card" onclick="navigator.clipboard.writeText(\''+code+'\')"><span class="flag">'+flag+'</span><div class="info"><div class="phone">📱 +'+i[1]+'</div><div class="code">'+code+'</div></div></div>';
                allCards.unshift({key:fullKey, html:html, search:i[1]+' '+code});
                if(allCards.length > 50) allCards.pop();
            }
        });
        if(page==='main'){renderCards();var s=document.getElementById('stats');if(s)s.textContent='⬢ '+allCards.length+' codes';}

        // 2. تحديث الأرقام الخاصة بي (myNums) لو مفتوحة
        if(myNums.length>0){
            d.forEach(i=>{
                var code=extractCode(i[2]||'');
                myNums.forEach((n, idx)=>{
                    if(n.num === i[1]){
                        n.code = code;
                        var el = document.getElementById('live_cd_'+idx);
                        if(el) el.textContent = code;
                    }
                });
            });
            saveNums();
        }
    }).catch(()=>{});
}

showMain();
liveUpdate();
setInterval(liveUpdate, 3000); // بيحدث كل 3 ثواني أوتوماتيك بدون ما تعمل أي حاجة
</script>
</body>
</html>
