<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0a0e14; --surface: #141b22; --card: #1a2129; --accent: #3b82f6; --accent2: #8b5cf6; --gold: #f59e0b; --green: #10b981; --red: #ef4444; --text: #e2e8f0; --text2: #94a3b8; --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.3); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app { width: 100%; max-width: 450px; height: 100vh; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--shadow); }
        
        .header { background: var(--card); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .back-btn { color: var(--accent); font-size: 22px; cursor: pointer; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
        .back-btn:hover { background: rgba(59,130,246,0.1); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; flex-shrink: 0; overflow: hidden; cursor: pointer; font-weight: bold; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; }
        .header-info .name { font-size: 17px; font-weight: 600; color: #fff; }
        .header-info .status { font-size: 13px; color: var(--text2); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: transparent; border: none; color: var(--text2); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .screen.hidden { display: none !important; }
        
        .main-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .chat-item { display: flex; align-items: center; padding: 14px 18px; gap: 14px; cursor: pointer; transition: 0.2s; }
        .chat-item:hover { background: rgba(255,255,255,0.02); }
        .chat-item .avatar { width: 55px; height: 55px; font-size: 22px; }
        .chat-item .info { flex: 1; min-width: 0; }
        .chat-item .name { font-size: 17px; font-weight: 500; color: #fff; margin-bottom: 4px; }
        .chat-item .preview { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .meta { text-align: left; }
        .chat-item .time { font-size: 12px; color: var(--text2); }
        .chat-item .badge { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; margin-top: 4px; display: inline-block; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-break: break-word; animation: popIn 0.25s ease; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .msg-in { align-self: flex-start; background: var(--card); border-bottom-right-radius: 4px; }
        .msg-out { align-self: flex-end; background: var(--accent); border-bottom-left-radius: 4px; }
        .msg-otp { align-self: flex-start; background: var(--card); border-right: 3px solid var(--gold); border-bottom-right-radius: 4px; }
        .msg .sender-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
        .msg .sender-avatar { width: 28px; height: 28px; border-radius: 50%; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent2); color: #fff; overflow: hidden; }
        .msg .sender-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg .sender-name { font-size: 13px; font-weight: 600; color: #93c5fd; }
        .msg .msg-text { font-size: 15px; }
        .msg .msg-time { font-size: 11px; color: var(--text2); margin-top: 6px; }
        .msg .otp-badge { font-size: 11px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
        .msg .number { color: #60a5fa; font-weight: 700; font-size: 16px; }
        .msg .code-block { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 6px; font-weight: 700; display: inline-block; margin: 6px 0; font-size: 18px; letter-spacing: 1px; }
        .msg .country-tag { color: #10b981; font-size: 12px; }
        
        .btn-area { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); background: var(--card); display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { padding: 12px 18px; border-radius: 25px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; text-align: center; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-green { background: var(--green); color: #fff; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        .btn-row { display: flex; gap: 8px; width: 100%; }
        .btn-row .btn { flex: 1; }
        
        .input-bar { padding: 12px 16px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; align-items: center; }
        .input-bar input { flex: 1; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); padding: 12px 18px; border-radius: 25px; color: #fff; font-size: 15px; outline: none; }
        .input-bar input:focus { border-color: var(--accent); }
        .input-bar button { background: var(--accent); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.2s; flex-shrink: 0; }
        
        .fab { position: absolute; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(59,130,246,0.4); z-index: 10; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .fab:hover { transform: scale(1.1); }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); border-radius: var(--radius); padding: 25px; width: 100%; max-width: 380px; }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-content input { width: 100%; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
        .modal-content .btn { width: 100%; margin-top: 5px; }
        
        .setup-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 20px; }
        .setup-screen h2 { font-size: 22px; }
        .setup-screen .avatar { width: 90px; height: 90px; font-size: 40px; cursor: pointer; }
        .setup-screen input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 14px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .setup-screen input:focus { border-color: var(--accent); }
        .setup-screen input[type="file"] { display: none; }
        
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
        .empty-state .icon { font-size: 60px; margin-bottom: 15px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #fff; }
        
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <button class="fab hidden" id="fabBtn" onclick="showCreateModal()">+</button>
    </div>
    <div class="modal hidden" id="createModal">
        <div class="modal-content">
            <h3>➕ إنشاء جديد</h3>
            <button class="btn btn-primary" style="margin-bottom:10px;" onclick="createGroup()">👥 مجموعة جديدة</button>
            <button class="btn btn-outline" style="margin-bottom:10px;" onclick="createChannel()">📢 قناة جديدة</button>
            <button class="btn btn-outline" onclick="addMember()">👤 إضافة عضو</button>
            <button class="btn" style="background:#444;color:#fff;margin-top:10px;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        
        let S=JSON.parse(localStorage.getItem('otp_hub')||'{}');
        let cur=S.cur||'setup',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let profile=S.profile||{name:'',phone:'',avatar:''};
        let groups=S.groups||[],channels=S.channels||[],contacts=S.contacts||[];
        let known=new Set(),otpTimer=null;
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        
        function save(){localStorage.setItem('otp_hub',JSON.stringify({cur,cSvc,cCty,curNum,profile,groups,channels,contacts}));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        function el(id){return document.getElementById(id);}
        function notify(msg){if(Notification.permission==='granted')new Notification('OTP Hub',{body:msg,icon:'https://cdn-icons-png.flaticon.com/512/4712/4712027.png'});}
        
        function render(){
            const app=el('app');
            if(cur==='setup'){
                app.innerHTML='<div class="setup-screen"><h2>🎉 أهلاً بك!</h2><div class="avatar" id="setupAvatar" onclick="document.getElementById(\'fileInput\').click()">📷</div><input type="file" id="fileInput" accept="image/*" onchange="previewImage(this)"><input id="setupPhone" placeholder="رقم الهاتف (مع كود الدولة)" value="'+profile.phone+'" type="tel"><input id="setupName" placeholder="الاسم" value="'+profile.name+'"><button class="btn btn-primary" style="width:100%;" onclick="saveSetup()">🚀 دخول</button></div>';
                if(profile.avatar){const a=el('setupAvatar');a.innerHTML='<img src="'+profile.avatar+'">';}
            }else{
                app.innerHTML=renderMain();
                if(cur!=='main') app.innerHTML=renderChat();
                if(cur==='main') document.getElementById('fabBtn').classList.remove('hidden');
                else document.getElementById('fabBtn').classList.add('hidden');
            }
            bindEvents();
        }
        
        function renderMain(){
            let list='';
            groups.forEach(g=>{list+=`<div class="chat-item" onclick="openGroup('${g.id}')"><div class="avatar" style="background:var(--accent2);">👥</div><div class="info"><div class="name">${g.name}</div><div class="preview">مجموعة - ${g.members?g.members.length:0} أعضاء</div></div></div>`;});
            channels.forEach(c=>{list+=`<div class="chat-item" onclick="openChannel('${c.id}')"><div class="avatar" style="background:var(--accent);">📢</div><div class="info"><div class="name">${c.name}</div><div class="preview">قناة</div></div></div>`;});
            contacts.forEach(c=>{list+=`<div class="chat-item" onclick="openPrivate('${c.phone}')"><div class="avatar">${c.avatar?`<img src="${c.avatar}">`:'👤'}</div><div class="info"><div class="name">${c.name}</div><div class="preview">${c.phone}</div></div></div>`;});
            if(!list)list='<div class="empty-state"><div class="icon">💬</div><h3>لا توجد محادثات</h3><p>اضغط على + لإنشاء مجموعة أو إضافة جهة اتصال</p></div>';
            
            return `<div class="screen"><div class="header"><div class="avatar" onclick="openScreen('profile')">${profile.avatar?`<img src="${profile.avatar}">`:(profile.name?profile.name[0]:'👤')}</div><div class="header-info"><div class="name">OTP Hub</div><div class="status">${profile.name||'مستخدم'}</div></div><div class="header-actions"><button class="icon-btn" onclick="openScreen('settings')">⚙️</button></div></div><div class="main-list">${list}</div></div>`;
        }
        
        function renderChat(){
            let header='',body='',footer='';
            if(cur==='bot'){
                header=`<div class="header"><div class="back-btn" onclick="goBack()">←</div><div class="avatar" style="background:#3b82f6;">🤖</div><div class="header-info"><div class="name">🤖 NUMBER BOT</div><div class="status">online</div></div></div>`;
                body=`<div class="chat-area"><div class="messages" id="messages"></div><div class="btn-area" id="btnArea"></div></div>`;
            }else if(cur==='group'){
                const g=groups.find(x=>x.id===cur);
                header=`<div class="header"><div class="back-btn" onclick="goBack()">←</div><div class="avatar" style="background:var(--accent2);">👥</div><div class="header-info"><div class="name">${g?g.name:'OTP GROUP'}</div><div class="status">${g&&g.members?g.members.length:0} أعضاء</div></div></div>`;
                body=`<div class="chat-area"><div class="messages" id="messages"></div><div class="input-bar"><input type="text" id="groupInput" placeholder="رسالة..." onkeypress="if(event.key==='Enter')sendGroupMsg()"><button onclick="sendGroupMsg()">📤</button></div></div>`;
            }
            return `<div class="screen">${header}${body}</div>`;
        }
        
        function bindEvents(){
            if(cur==='setup') return;
            if(cur==='bot'){
                if(curNum){el('messages').innerHTML=`<div class="msg msg-in"><div class="msg-text">📱 الرقم: <span class="number">${curNum}</span></div></div>`;el('btnArea').innerHTML=`<div class="btn-row"><button class="btn btn-green btn-sm" onclick="copyNum('${curNum}')">📋 نسخ</button><button class="btn btn-primary btn-sm" onclick="loadServices()">🌍 دولة</button></div><div class="btn-row"><button class="btn btn-outline btn-sm" onclick="getNumber('${cCty}','')">🔄 تغيير</button><button class="btn btn-gold btn-sm" onclick="checkCode('${curNum}')">📩 كود</button></div>`;}else showStart();}
            if(cur==='group'||cur.startsWith('group_')){
                el('messages').innerHTML='';
                db.ref('groups/'+cur+'/messages').off();
                db.ref('groups/'+cur+'/messages').limitToLast(50).on('child_added',s=>{if(cur.startsWith('group_'))showGroupMsg(s.val())});
                if(otpTimer)clearInterval(otpTimer);
                otpTimer=setInterval(fetchOTP,2000);fetchOTP();
            }
        }
        
        function showGroupMsg(m){
            if(!cur.startsWith('group_'))return;
            const t=m.time||new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            const isMe=m.phone===profile.phone;
            let html='';
            if(m.type==='otp'){
                const cn=cNames[m.country]||m.country||'';
                html=`<div class="otp-badge">📩 ${m.service} <span class="country-tag">${cn}</span></div><div class="msg-text">📱 <span class="number">${m.number}</span><br>🔑 <span class="code-block">${m.code}</span></div><div class="msg-time">${t}</div><button class="btn btn-gold btn-sm" style="margin-top:6px;width:100%" onclick="copyCode('${m.code}')">📋 نسخ</button>`;
            }else{
                html=`<div class="sender-row" onclick="showContact('${m.phone}','${m.sender}','${m.avatar||''}')"><span class="sender-avatar">${m.avatar?`<img src="${m.avatar}">`:'👤'}</span><span class="sender-name">${m.sender||'مستخدم'}</span></div><div class="msg-text">${m.text}</div><div class="msg-time">${t}</div>`;
            }
            el('messages').innerHTML+=`<div class="msg ${isMe&&m.type!=='otp'?'msg-out':(m.type==='otp'?'msg-otp':'msg-in')}">${html}</div>`;
            el('messages').scrollTop=el('messages').scrollHeight;
            if(m.type==='otp')notify(`كود جديد: ${m.code} - ${m.service}`);
        }
        
        function showContact(phone,name,avatar){
            let info=`👤 ${name}\n📱 ${phone}`;
            if(confirm(info+'\n\nفتح محادثة واتساب؟'))window.open('https://wa.me/'+phone.replace(/\D/g,''),'_blank');
        }
        
        function copyCode(c){navigator.clipboard.writeText(c);}
        function copyNum(n){navigator.clipboard.writeText(n);}
        function openScreen(s){cur=s;save();if(otpTimer)clearInterval(otpTimer);render();}
        function openChat(t){cur=t;save();render();}
        function goBack(){cur='main';save();if(otpTimer)clearInterval(otpTimer);render();}
        function openGroup(id){cur='group_'+id;save();render();}
        function openChannel(id){cur='channel_'+id;save();render();}
        function openPrivate(phone){cur='private_'+phone;save();render();}
        
        function previewImage(i){const f=i.files[0];if(f){const r=new FileReader();r.onload=function(e){profile.avatar=e.target.result;el('setupAvatar').innerHTML='<img src="'+e.target.result+'">';};r.readAsDataURL(f);}}
        function saveSetup(){profile.phone=el('setupPhone').value||'';profile.name=el('setupName').value||'مستخدم';save();cur='main';render();requestNotification();}
        function requestNotification(){if('Notification' in window)Notification.requestPermission();}
        
        async function fetchOTP(){
            try{const d=await api('/api/otp?count=15');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('groups/group_0/messages').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],country:i[4]||'',time:new Date().toLocaleTimeString('ar-EG')});}});}catch(e){}
        }
        
        function sendGroupMsg(){const inp=el('groupInput'),tx=inp.value.trim();if(!tx||!profile.name)return;db.ref('groups/'+cur+'/messages').push({type:'user',text:tx,sender:profile.name,phone:profile.phone,avatar:profile.avatar,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        
        function showCreateModal(){el('createModal').classList.remove('hidden');}
        function closeModal(){el('createModal').classList.add('hidden');}
        function createGroup(){
            const name=prompt('اسم المجموعة:');
            if(name){const id='group_'+Date.now();groups.push({id,name,members:[profile.phone],createdBy:profile.name});save();el('createModal').classList.add('hidden');cur='main';render();}
        }
        function createChannel(){
            const name=prompt('اسم القناة:');
            if(name){const id='channel_'+Date.now();channels.push({id,name,createdBy:profile.name});save();el('createModal').classList.add('hidden');cur='main';render();}
        }
        function addMember(){
            const phone=prompt('رقم هاتف العضو (مع كود الدولة):');
            const name=prompt('اسم العضو:');
            if(phone&&name){contacts.push({phone,name,avatar:''});save();el('createModal').classList.add('hidden');cur='main';render();}
        }
        
        function showStart(){el('messages').innerHTML='<div class="msg msg-in"><div class="msg-text">👋 أهلًا بك في NUMBER BOT!</div></div>';el('btnArea').innerHTML='<button class="btn btn-primary btn-sm" style="width:100%;" onclick="loadServices()">▶️ START</button>';}
        async function loadServices(){el('btnArea').innerHTML='';try{const d=await api('/api/services');if(d.success){let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-outline btn-sm" onclick="loadCountries(\''+s.key+'\',\''+s.name+'\')">'+s.name+' ('+s.count+')</button>';if(i%2===1||i===d.services.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function loadCountries(key,name){cSvc=key;save();el('btnArea').innerHTML='';try{const d=await api('/api/countries?service='+key);if(d.success){let btns='';d.countries.slice(0,10).forEach((c,i)=>{const cn=cNames[c.name]||c.name;if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-outline btn-sm" onclick="getNumber(\''+c.name+'\',\''+c.flag+'\')">'+c.flag+' '+cn+' ('+c.count+')</button>';if(i%2===1||i===d.countries.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function getNumber(country,flag){cCty=country;save();el('btnArea').innerHTML='';try{const d=await api('/api/otp?count=30');if(Array.isArray(d)){const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[Math.floor(Math.random()*Math.min(flt.length,5))][1];save();const cn=cNames[country]||country;el('messages').innerHTML+='<div class="msg msg-in"><div class="msg-text">📱 <span class="number">'+curNum+'</span><br><span class="country-tag">'+flag+' '+cn+'</span></div></div>';el('btnArea').innerHTML='<div class="btn-row"><button class="btn btn-green btn-sm" onclick="copyNum(\''+curNum+'\')">📋 نسخ</button><button class="btn btn-primary btn-sm" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 تغيير</button></div><div class="btn-row"><button class="btn btn-outline btn-sm" onclick="loadServices()">🌍 دولة</button><button class="btn btn-gold btn-sm" onclick="checkCode(\''+curNum+'\')">📩 كود</button></div>';}else{el('btnArea').innerHTML='<button class="btn btn-outline btn-sm" style="width:100%;" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 جرب تاني</button>';}}}catch(e){}}
        async function checkCode(num){try{const d=await api('/api/otp?count=40');if(Array.isArray(d)){const f=d.find(i=>i[1]===num);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];el('messages').innerHTML+='<div class="msg msg-in"><div class="msg-text">✅ الكود: <span class="code-block">'+cd+'</span></div></div>';el('messages').scrollTop=el('messages').scrollHeight;}else{el('messages').innerHTML+='<div class="msg msg-in"><div class="msg-text">⏳ لم يصل بعد...</div></div>';el('messages').scrollTop=el('messages').scrollHeight;}}}catch(e){}}
        
        window.onload=()=>{
            if(!profile.name||!profile.phone){cur='setup';render();}else{cur=S.cur||'main';render();}
            if('Notification' in window&&Notification.permission==='default')requestNotification();
        };
    </script>
</body>
