<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Live - Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e1621;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .telegram-container {
            width: 100%;
            max-width: 450px;
            background-color: #17212b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0e1621;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Header */
        .tg-header {
            background-color: #242f3d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #111822;
            min-height: 56px;
        }

        .tg-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tg-back-arrow {
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .tg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2b5278;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .tg-title-info h2 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .tg-title-info p {
            font-size: 12px;
            color: #7d8b99;
        }

        /* Main List */
        .main-list {
            flex: 1;
            overflow-y: auto;
            background-color: #0e1621;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        .chat-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .chat-row:active { background-color: rgba(255,255,255,0.05); }
        .chat-row .tg-avatar { width: 48px; height: 48px; font-size: 20px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .chat-row .preview { font-size: 13px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #0e1621;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        .msg-block {
            background-color: #182533;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #ffffff;
        }

        .msg-user { color: #64b5f6; font-weight: 600; }
        .num { color: #60a5fa; font-weight: 600; font-size: 16px; cursor: pointer; }
        .code { background-color: #f59e0b; color: #000; padding: 3px 10px; border-radius: 5px; font-weight: 700; display: inline-block; margin: 4px 0; font-size: 16px; cursor: pointer; }
        .time-tag { font-size: 11px; color: #7d8b99; text-align: left; margin-top: 4px; }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            text-align: center;
            background-color: #2b5278;
            width: 100%;
            margin-bottom: 6px;
        }

        .btn:active { opacity: 0.7; transform: scale(0.98); }
        .btn-green { background-color: #2e8b57; }
        .btn-gold { background-color: #f59e0b; color: #000; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; margin-bottom: 0; }

        .number-item-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .number-item-row .btn {
            margin-bottom: 0;
            flex: 2;
            font-size: 14px;
        }
        .number-item-row .btn-fetch {
            flex: 1;
            background-color: #2675d3;
            font-size: 13px;
        }

        .btn-area {
            padding: 10px;
            border-top: 1px solid #111822;
            background-color: #17212b;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 52vh; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Chat Input Bar */
        .chat-input-bar {
            display: flex;
            padding: 8px 10px;
            background-color: #17212b;
            border-top: 1px solid #111822;
            gap: 8px;
            align-items: center;
        }

        .chat-input-bar input {
            flex: 1;
            background-color: #0e1621;
            border: 1px solid #2b5278;
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .chat-input-bar button {
            background-color: #5288c1;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Toast */
        #toast {
            visibility: hidden;
            min-width: 150px;
            background-color: #f59e0b;
            color: #000;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 99;
            left: 50%;
            bottom: 70px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: opacity 0.15s;
            opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }

        /* Bottom Nav */
        .bottom-nav { background-color: #17212b; display: flex; justify-content: space-around; padding: 6px 0; border-top: 1px solid #111822; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 12px; font-weight: 500; cursor: pointer; gap: 3px; background: none; border: none; flex: 1; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 20px; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="telegram-container" id="app">
        <div id="toast">تم النسخ!</div>
    </div>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db = firebase.database();
        const PROXY = 'https://ai-proxy-eosin.vercel.app/api/panel';
        const API_KEY = 'np_live_6DknI4df2uZ0_BFv6CGGpX_BCBAq60TG1sKev64WPkw';
        
        let S = JSON.parse(localStorage.getItem('otp_session_v13') || '{}');
        let cur = S.cur || 'main', cSvc = S.cSvc || '', cCty = S.cCty || '', cFlag = S.cFlag || '', viewMode = S.viewMode || 'services';
        let numBatchIndex = S.numBatchIndex || 0, currentNumbersPool = S.currentNumbersPool || [];
        let known = new Set(), otpTimer = null;

        function save() { 
            localStorage.setItem('otp_session_v13', JSON.stringify({cur, cSvc, cCty, cFlag, viewMode, numBatchIndex, currentNumbersPool})); 
        }

        function api(p) { return fetch(PROXY + p).then(r => r.json()); }
        function el(id) { return document.getElementById(id); }

        function showToast(msg) {
            let t = el('toast');
            if(!t) {
                t = document.createElement('div');
                t.id = 'toast';
                document.querySelector('.telegram-container').appendChild(t);
            }
            t.innerText = msg || "تم النسخ!";
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 1200);
        }

        function render() {
            requestAnimationFrame(() => {
                const app = el('app');
                let toastHTML = '<div id="toast">تم النسخ!</div>';

                if (cur === 'main') {
                    app.innerHTML = toastHTML + `
                        <div class="screen">
                            <div class="tg-header">
                                <div class="tg-header-left">
                                    <div class="tg-avatar">✈️</div>
                                    <div class="tg-title-info"><h2>Telegram</h2><p>Number Panel Live</p></div>
                                </div>
                            </div>
                            <div class="main-list">
                                <div class="chat-row" onclick="openChat('bot')">
                                    <div class="tg-avatar" style="background:#2b5278;">🤖</div>
                                    <div class="info">
                                        <div class="name">🤖 NUMBER BOT</div>
                                        <div class="preview">بوت استعراض أرقام الدول وأكوادها لجميع الخدمات</div>
                                    </div>
                                </div>
                                <div class="chat-row" onclick="openChat('group')">
                                    <div class="tg-avatar" style="background:#2e8b57;">👥</div>
                                    <div class="info">
                                        <div class="name">👥 ALL TECH OTP</div>
                                        <div class="preview">بث مباشر ومراسلة جماعية لأكواد التفعيل</div>
                                    </div>
                                </div>
                            </div>
                            <div class="bottom-nav">
                                <button class="nav-item ${viewMode !== 'hot_countries' ? 'active' : ''}" onclick="openChat('bot'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                                <button class="nav-item ${viewMode === 'hot_countries' ? 'active' : ''}" onclick="showHotCountries();"><span class="nav-icon">🔥</span>الأكثر نشاطاً</button>
                            </div>
                        </div>`;
                } else {
                    app.innerHTML = toastHTML + `
                        <div class="screen">
                            <div class="tg-header">
                                <div class="tg-header-left">
                                    <div class="tg-back-arrow" onclick="goHomeDirect()">←</div>
                                    <div class="tg-avatar">${cur === 'bot' ? '🤖' : '👥'}</div>
                                    <div class="tg-title-info">
                                        <h2>${cur === 'bot' ? '🤖 NUMBER BOT' : '👥 ALL TECH OTP'}</h2>
                                        <p>${cur === 'bot' ? 'متصل الآن' : '٨٣٤٣ عضواً، ١٥٣١ متصلاً'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="chat-body" id="messages"></div>
                            ${cur === 'bot' ? '<div class="btn-area" id="btnArea"></div>' : `
                                <div class="chat-input-bar">
                                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendGroupMsg()">
                                    <button onclick="sendGroupMsg()">📤</button>
                                </div>
                            `}
                            <div class="bottom-nav">
                                <button class="nav-item ${viewMode !== 'hot_countries' ? 'active' : ''}" onclick="openChat('bot'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                                <button class="nav-item ${viewMode === 'hot_countries' ? 'active' : ''}" onclick="showHotCountries();"><span class="nav-icon">🔥</span>الأكثر نشاطاً</button>
                            </div>
                        </div>`;
                }
                bindEvents();
            });
        }

        function bindEvents() {
            if (cur === 'bot') {
                if (viewMode === 'hot_countries') showHotCountries();
                else if (cCty) showNumbersList(cCty, cFlag, false);
                else if (cSvc) loadCountries(cSvc);
                else loadServices();
            } else if (cur === 'group') {
                el('messages').innerHTML = '<div class="msg-block">📡 نظام البث المباشر لأكواد التفعيل.</div>';
                db.ref('messages').off();
                db.ref('messages').limitToLast(20).on('child_added', s => { if (cur === 'group') showGroupMessage(s.val()); });
                if (otpTimer) clearInterval(otpTimer);
                otpTimer = setInterval(fetchOTP, 3000);
                fetchOTP();
            }
        }

        function goHomeDirect() {
            cur = 'main';
            viewMode = 'services';
            cSvc = ''; cCty = ''; cFlag = '';
            save();
            if (otpTimer) clearInterval(otpTimer);
            render();
        }

        function openChat(t) { 
            cur = t; 
            save(); 
            render(); 
        }
        
        function showGroupMessage(m) {
            if (cur !== 'group') return;
            const t = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
            if (m.type === 'otp') {
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">Alexender (المشرف)</span><br>
                        🌐 الخدمة: <b>${m.service || 'OTP'}</b><br>
                        📱 الرقم: <span class="num" onclick="copyText('${m.number}')">${m.number || ''}</span><br>
                        🔑 الكود: <span class="code" onclick="copyText('${m.code}')">${m.code}</span>
                        <div class="time-tag">${t}</div>
                    </div>`;
            } else if (m.type === 'chat') {
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">${m.user || 'عضو'}</span><br>
                        ${m.text}
                        <div class="time-tag">${t}</div>
                    </div>`;
            }
            el('messages').scrollTop = el('messages').scrollHeight;
        }

        function sendGroupMsg() {
            const input = el('chatInput');
            if(!input || !input.value.trim()) return;
            db.ref('messages').push({ type: 'chat', user: 'مستخدم (أنت)', text: input.value.trim() });
            input.value = '';
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            showToast('تم النسخ: ' + txt);
        }

        async function fetchOTP() {
            try {
                const d = await api('/api/otp?count=10');
                if (Array.isArray(d)) {
                    d.forEach(i => {
                        const k = i[1] + '-' + i[2];
                        if (!known.has(k)) {
                            known.add(k);
                            db.ref('messages').push({
                                type: 'otp', service: i[0], number: i[1],
                                code: i[2].match(/\d{4,8}/)?.[0] || i[2]
                            });
                        }
                    });
                }
            } catch (e) {}
        }

        async function showHotCountries() {
            viewMode = 'hot_countries'; cur = 'bot'; save(); render();
            el('messages').innerHTML = '<div class="msg-block">🔥 الخدمات والدول الأكثر نشاطاً في المنصة الآن:</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري التحميل...</div>';
            
            try {
                const d = await api('/api/otp?count=35');
                let items = [];
                if (Array.isArray(d)) {
                    d.forEach(i => {
                        let srv = i[0] || 'WhatsApp';
                        let cty = i.length > 4 && i[4] ? i[4] : 'زيمبابوي 🇿🇼';
                        items.push({ service: srv, country: cty });
                    });
                }
                
                // تصفية العناصر الفريدة (الخدمة مع الدولة)
                let uniqueMap = new Map();
                items.forEach(x => { uniqueMap.set(x.service + ' | ' + x.country, x); });
                let list = Array.from(uniqueMap.values()).slice(0, 15);

                if (list.length === 0) {
                    list = [
                        { service: 'WhatsApp', country: 'مصر 🇪🇬' },
                        { service: 'Telegram', country: 'إندونيسيا 🇮🇩' },
                        { service: 'Google', country: 'أمريكا 🇺🇸' }
                    ];
                }

                let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                list.forEach(item => {
                    btns += `<button class="btn" onclick="cSvc='${item.service}'; selectCountry('${item.country}','')">📌 ${item.service} ➔ ${item.country}</button>`;
                });
                el('btnArea').innerHTML = btns;
            } catch(e) { el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">🔙 رجوع</button>'; }
        }

        async function fetchSingleCode(num) {
            showToast('جاري فحص الكود...');
            try {
                const res = await fetch(PROXY + '/api/latest_otp?number=' + encodeURIComponent(num), { headers: { 'Authorization': 'Bearer ' + API_KEY } });
                const data = await res.json();
                if (data && data.success && data.has_otp) {
                    el('messages').innerHTML += `
                        <div class="msg-block">
                            📱 الرقم: <span class="num" onclick="copyText('${num}')">${num}</span><br>
                            🔑 الكود: <span class="code" onclick="copyText('${data.otp_code || data.verification_code || '---'}')">${data.otp_code || data.verification_code || '---'}</span>
                        </div>`;
                    el('messages').scrollTop = el('messages').scrollHeight;
                    showToast('تم العثور على الكود!');
                } else {
                    showToast('لا يوجد كود جديد حالياً');
                }
            } catch(err) { showToast('خطأ أثناء فحص الكود'); }
        }

        async function loadServices() {
            viewMode = 'services'; cur = 'bot'; cSvc = ''; cCty = ''; save(); render();
            el('messages').innerHTML = '<div class="msg-block">👋 أهلاً بك! اختر الخدمة المطلوبة:</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري تحميل الخدمات...</div>';
            try {
                const res = await api('/api/services');
                let servicesList = [];
                if (Array.isArray(res)) {
                    servicesList = res;
                } else if (res && res.services && Array.isArray(res.services)) {
                    servicesList = res.services;
                }

                if (servicesList.length > 0) {
                    let btns = '';
                    servicesList.forEach(s => {
                        let name = typeof s === 'string' ? s : (s.name || 'الخدمة');
                        let count = (typeof s === 'object' && s.count !== undefined) ? ` (${s.count})` : '';
                        btns += `<button class="btn" onclick="loadCountries('${name}')">${name}${count}</button>`;
                    });
                    el('btnArea').innerHTML = btns;
                } else {
                    // قائمة افتراضية احتياطية في حال تعذر جلب الخدمات مباشرة
                    let defaults = ['WhatsApp', 'Telegram', 'Google / Gmail', 'Instagram', 'TikTok', 'Facebook', 'Twitter', 'Netflix', 'Line', 'PayPal'];
                    let btns = '';
                    defaults.forEach(name => {
                        btns += `<button class="btn" onclick="loadCountries('${name}')">${name}</button>`;
                    });
                    el('btnArea').innerHTML = btns;
                }
            } catch (e) {
                let defaults = ['WhatsApp', 'Telegram', 'Google / Gmail', 'Instagram', 'TikTok', 'Facebook', 'Twitter', 'Netflix'];
                let btns = '';
                defaults.forEach(name => {
                    btns += `<button class="btn" onclick="loadCountries('${name}')">${name}</button>`;
                });
                el('btnArea').innerHTML = btns;
            }
        }

        async function loadCountries(serviceName) {
            cSvc = serviceName; cCty = ''; cFlag = ''; viewMode = 'countries'; save();
            el('messages').innerHTML = `<div class="msg-block">🌐 الخدمة: <b>${serviceName}</b>.<br>اختر الدولة المتاحة لعرض أرقامها:</div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري تحميل الدول...</div>';
            try {
                const res = await api('/api/countries?service=' + encodeURIComponent(serviceName));
                let countriesList = [];
                if (Array.isArray(res)) {
                    countriesList = res;
                } else if (res && res.countries && Array.isArray(res.countries)) {
                    countriesList = res.countries;
                }

                let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                
                if (countriesList.length > 0) {
                    countriesList.forEach(c => {
                        let name = typeof c === 'string' ? c : (c.name || 'الدولة');
                        let flag = (typeof c === 'object' && c.flag) ? c.flag : '';
                        let count = (typeof c === 'object' && c.count !== undefined) ? ` (${c.count})` : '';
                        btns += `<button class="btn" onclick="selectCountry('${name}','${flag}')">${flag} ${name}${count}</button>`;
                    });
                } else {
                    let defCountries = [
                        { name: 'مصر', flag: '🇪🇬' }, { name: 'إندونيسيا', flag: '🇮🇩' },
                        { name: 'أمريكا', flag: '🇺🇸' }, { name: 'المملكة العربية السعودية', flag: '🇸🇦' },
                        { name: 'المغرب', flag: '🇲🇦' }, { name: 'تركيا', flag: '🇹🇷' }
                    ];
                    defCountries.forEach(c => {
                        btns += `<button class="btn" onclick="selectCountry('${c.name}','${c.flag}')">${c.flag} ${c.name}</button>`;
                    });
                }
                el('btnArea').innerHTML = btns;
            } catch (e) {
                el('btnArea').innerHTML = '<button class="btn" onclick="loadServices()">🔙 رجوع</button>';
            }
        }

        function selectCountry(country, flag) {
            cCty = country; cFlag = flag; viewMode = 'numbers'; numBatchIndex = 0; currentNumbersPool = []; save();
            showNumbersList(country, flag, true);
        }

        async function showNumbersList(country, flag, fetchNew = false) {
            el('messages').innerHTML = `
                <div class="msg-block">
                    🌐 الخدمة: <b>${cSvc || 'WhatsApp'}</b><br>
                    🌍 الدولة: ${flag || ''} <b>${country}</b><br>
                    📱 جاري جلب الأرقام (3 بـ 3)...
                </div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري جلب الأرقام...</div>';
            
            try {
                if (fetchNew || currentNumbersPool.length === 0) {
                    currentNumbersPool = [];
                    try {
                        const reqRes = await fetch(PROXY + '/api/request_number', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ service: cSvc || 'WhatsApp', country: country })
                        });
                        const reqData = await reqRes.json();
                        if (reqData && reqData.success && reqData.number) currentNumbersPool.push(reqData.number);
                    } catch(err) {}

                    const d = await api(`/api/otp?count=35`);
                    if (Array.isArray(d)) {
                        d.forEach(i => {
                            if (i.length > 4 && i[4] && i[4].toUpperCase().includes(country.toUpperCase()) && i[1]) {
                                currentNumbersPool.push(i[1]);
                            }
                        });
                    }
                    currentNumbersPool = [...new Set(currentNumbersPool)];
                    if (currentNumbersPool.length === 0) currentNumbersPool = ['+16282849090', '+6288269202428', '+6288269202429', '+201012345678'];
                    numBatchIndex = 0;
                }

                let batch = currentNumbersPool.slice(numBatchIndex, numBatchIndex + 3);
                if (batch.length === 0) { numBatchIndex = 0; batch = currentNumbersPool.slice(0, 3); }

                S.numBatchIndex = numBatchIndex;
                S.currentNumbersPool = currentNumbersPool;
                save();

                let btns = `<div class="btn-row">
                                <button class="btn" onclick="loadCountries('${cSvc}')">🔙 الدول</button>
                                <button class="btn btn-gold" onclick="numBatchIndex += 3; showNumbersList('${country}', '${flag}', false)">🔄 3 أخرى</button>
                            </div><hr style="border-color:#242f3d; margin:5px 0;">`;

                batch.forEach(num => {
                    btns += `
                        <div class="number-item-row">
                            <button class="btn btn-green" onclick="copyText('${num}')">📱 ${num}</button>
                            <button class="btn btn-fetch" onclick="fetchSingleCode('${num}')">🔍 جلب الكود</button>
                        </div>`;
                });
                el('btnArea').innerHTML = btns;
            } catch (e) {
                el('btnArea').innerHTML = '<button class="btn" onclick="showNumbersList(\''+country+'\',\''+flag+'\')">❌ إعادة المحاولة</button>';
            }
        }

        window.onload = () => { render(); };
    </script>
</body>
</html>
