<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP LIVE</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
        body{background:#000;color:#0f0;min-height:100vh}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
        @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
        .app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
        .header{text-align:center;padding:20px 0;border-bottom:2px solid #0f0;margin-bottom:15px;animation:glow 2s infinite}
        @keyframes glow{0%,100%{text-shadow:0 0 10px #0f0}50%{text-shadow:0 0 30px #0f0}}
        .header h1{font-size:28px;letter-spacing:3px}
        .list{display:flex;flex-direction:column-reverse;gap:8px}
        .card{background:#0f0f0f;border:1px solid #1a3a1a;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:in 0.2s}
        @keyframes in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .card .flag{font-size:32px;min-width:40px;text-align:center}
        .card .info{flex:1}
        .card .num{color:#fff;font-weight:bold;font-size:22px;direction:ltr}
        .card .meta{color:#0ff;font-size:10px}
        .card .code{font-size:30px;font-weight:bold;color:#ff0;letter-spacing:3px;direction:ltr;text-shadow:0 0 10px #ff0;animation:glitch 2s infinite}
        @keyframes glitch{0%,100%{text-shadow:0 0 10px #ff0}50%{text-shadow:0 0 20px #ff0,2px 0 #f00}}
        .btn{border:1px solid #0f0;background:transparent;color:#0f0;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:bold;font-family:'Courier New',monospace}
        .btn:hover{background:#0f0;color:#000}
        .btn.g{border-color:#ff0;color:#ff0}
        .btn.g:hover{background:#ff0;color:#000}
        .stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
    </style>
</head>
<body>
    <div class="app">
        <div class="header"><h1>⬢ OTP LIVE</h1></div>
        <div class="list" id="list"></div>
        <div class="stats" id="stats"></div>
    </div>
    <script>
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        let known=new Set(),c=0;
        const flags={MZ:'🇲🇿',TG:'🇹🇬',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',UA:'🇺🇦',QA:'🇶🇦',TJ:'🇹🇯',HT:'🇭🇹',ID:'🇮🇩'};
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        function cp(t){navigator.clipboard.writeText(t);}
        
        function add(i){
            const cd=i[2].match(/\d{4,8}/)?.[0]||i[2];
            const ct=i[4]||'';
            document.getElementById('list').innerHTML+=`
                <div class="card">
                    <span class="flag">${flags[ct]||'🌍'}</span>
                    <div class="info">
                        <div class="meta">${i[0]} · ${cNames[ct]||ct}</div>
                        <div class="num">+${i[1]}</div>
                        <div class="code">${cd}</div>
                    </div>
                    <button class="btn g" onclick="cp('${cd}')">🔑</button>
                </div>`;
            c++;
            document.getElementById('stats').textContent='⬢ '+c;
        }
        
        async function go(){
            try{
                const d=await fetch(PROXY+'/api/otp?count=10').then(r=>r.json());
                if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);add(i);}});
            }catch(e){}
        }
        
        setInterval(go,1500);
        go();
    </script>
</body>
</html>
