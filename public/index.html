<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬢ HACK OTP - Secure Terminal</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0a0a0a; --surface: #0f0f0f; --surface2: #1a1a1a; --border: #1f3a1f; --green: #0f0; --green2: #0a0; --gold: #ff0; --red: #f00; --text: #0f0; --text2: #0a0; --sky: #0cf; --matrix: #003300; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px); pointer-events: none; z-index: 0; animation: scan 8s linear infinite; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .app { width: 100%; max-width: 420px; background: var(--surface); height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,255,0,0.2); overflow: hidden; position: relative; z-index: 1; border: 1px solid var(--border); }
        
        .header { background: #0a0a0a; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); min-height: 55px; }
        .back { color: var(--green); font-size: 20px; cursor: pointer; text-shadow: 0 0 10px var(--green); }
        .avatar { width: 42px; height: 42px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; border: 1px solid var(--green); text-shadow: 0 0 10px var(--green); box-shadow: 0 0 10px rgba(0,255,0,0.3); background: #0a0a0a; }
        .title h2 { font-size: 14px; color: var(--green); font-weight: bold; text-shadow: 0 0 5px var(--green); }
        .title p { font-size: 10px; color: var(--text2); }
        
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .screen.hidden { display: none !important; }
        
        .main-list { flex: 1; overflow-y: auto; background: #050505; }
        .chat-row { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(0,255,0,0.05); transition: 0.2s; }
        .chat-row:hover { background: rgba(0,255,0,0.03); }
        .chat-row .avatar { width: 50px; height: 50px; font-size: 22px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 14px; color: var(--green); margin-bottom: 3px; text-shadow: 0 0 5px var(--green); }
        .chat-row .preview { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #050505; }
        
        .msg { background: #0a0a0a; border: 1px solid var(--border); padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--text); }
        .msg .user { color: var(--sky); font-weight: bold; text-shadow: 0 0 5px var(--sky); }
        .msg .num { color: var(--gold); font-weight: bold; text-shadow: 0 0 5px var(--gold); font-size: 16px; }
        .msg .code { background: #000; color: var(--green); padding: 4px 12px; border: 1px solid var(--green); display: inline-block; margin: 5px 0; font-size: 16px; font-weight: bold; text-shadow: 0 0 10px var(--green); animation: glitch 2s infinite; }
        @keyframes glitch { 0%,100% { text-shadow: 0 0 10px var(--green); } 50% { text-shadow: 0 0 20px var(--green), 2px 0 red; } }
        .msg .time { font-size: 9px; color: var(--text2); margin-top: 5px; }
        
        .btn { border: 1px solid var(--green); background: #0a0a0a; color: var(--green); padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; text-shadow: 0 0 5px var(--green); transition: 0.2s; }
        .btn:hover { background: #0f0f00; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }
        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        .btn-full { width: 100%; }
        .btn-area { padding: 10px; border-top: 1px solid var(--border); background: #0a0a0a; display: flex; flex-direction: column; gap: 8px; }
        .footer { background: #0a0a0a; padding: 12px; text-align: center; border-top: 1px solid var(--border); color: var(--text2); font-size: 11px; }
        .bottom-nav { background: #0a0a0a; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text2); font-size: 10px; cursor: pointer; gap: 3px; background: none; border: none; flex: 1; }
        .nav-item.active { color: var(--green); text-shadow: 0 0 5px var(--green); }
        .nav-icon { font-size: 18px; }
        
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        let S=JSON.parse(localStorage.getItem('hack_otp')||'{}');
        let cur=S.cur||'main',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let known=new Set(),otpTimer=null;
        function save(){localStorage.setItem('hack_otp',JSON.stringify({cur,cSvc,cCty,curNum}));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        function el(id){return document.getElementById(id);}
        
        function render(){
            const app=el('app');
            if(cur==='main')app.innerHTML=`<div class="screen"><div class="header"><div class="avatar" style="color:#f00;border-color:#f00;text-shadow:0 0 10px #f00;">⬢</div><div class="title"><h2>⬢ HACK OTP TERMINAL</h2><p>Secure Connection // v4.0</p></div></div><div class="main-list"><div class="chat-row" onclick="openChat('bot')"><div class="avatar" style="color:#f0f;border-color:#f0f;">👾</div><div class="info"><div class="name" style="color:#f0f;">👾 GHOST_BOT</div><div class="preview">${curNum?'[ACTIVE] '+curNum:'[IDLE] Awaiting command...'}</div></div></div><div class="chat-row" onclick="openChat('group')"><div class="avatar" style="color:#0cf;border-color:#0cf;">💀</div><div class="info"><div class="name" style="color:#0cf;">💀 OTP_SPLOIT</div><div class="preview">Live interception feed...</div></div></div></div><div class="bottom-nav"><button class="nav-item active" onclick="openScreen('main')"><span class="nav-icon">⌬</span>TERMINAL</button></div></div>`;
            else if(cur==='bot'||cur==='group')app.innerHTML=`<div class="screen"><div class="header"><div class="back" onclick="goBack()">⟵</div><div class="avatar" style="color:${cur==='bot'?'#f0f':'#0cf'};border-color:${cur==='bot'?'#f0f':'#0cf'};">${cur==='bot'?'👾':'💀'}</div><div class="title"><h2 style="color:${cur==='bot'?'#f0f':'#0cf'};">${cur==='bot'?'👾 GHOST_BOT v2.0':'💀 OTP_SPLOIT // LIVE'}</h2><p>${cur==='bot'?'[AWAITING INPUT]':'[INTERCEPTING PACKETS]'}</p></div></div><div class="chat-body" id="messages"></div>${cur==='bot'?'<div class="btn-area" id="btnArea"></div>':'<div class="footer">⬢ PACKET INTERCEPTION ACTIVE ⬢</div>'}</div>`;
            bindEvents();
        }
        
        function bindEvents(){
            if(cur==='bot'){
                if(curNum){el('messages').innerHTML=`<div class="msg">📡 <span style="color:#f0f;">TARGET ACQUIRED:</span> <span class="num">${curNum}</span></div>`;el('btnArea').innerHTML=`<div class="btn-row"><button class="btn" onclick="copyNum('${curNum}')">📋 COPY</button><button class="btn" onclick="loadServices()">🌍 SCAN</button></div><div class="btn-row"><button class="btn" onclick="getNumber('${cCty}','')">🔄 REROLL</button><button class="btn btn-gold" onclick="checkCode('${curNum}')">📩 DECRYPT</button></div>`;}else showStart();}
            else if(cur==='group'){el('messages').innerHTML='<div class="msg">📡 <span style="color:#0cf;">INTERCEPTING OTP PACKETS...</span></div>';db.ref('messages').off();db.ref('messages').limitToLast(50).on('child_added',s=>{if(cur==='group')showOTP(s.val())});if(otpTimer)clearInterval(otpTimer);otpTimer=setInterval(fetchOTP,2000);fetchOTP();}
        }
        
        function openScreen(s){cur=s;save();if(otpTimer)clearInterval(otpTimer);render();}
        function openChat(t){cur=t;save();render();}
        function goBack(){cur='main';save();if(otpTimer)clearInterval(otpTimer);render();}
        
        function showOTP(m){if(cur!=='group')return;const t=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});const code=m.code||'WAITING...';el('messages').innerHTML+=`<div class="msg"><span class="user">⬢ ${m.service||'UNKNOWN'}</span><br>📱 <span class="num">${m.number||'---'}</span><br>🔑 <span class="code">${code}</span><div class="time">${t} // INTERCEPTED</div><button class="btn btn-gold" style="margin-top:6px;width:100%" onclick="copyCode('${code}')">📋 EXTRACT CODE</button></div>`;el('messages').scrollTop=el('messages').scrollHeight;}
        function copyCode(c){navigator.clipboard.writeText(c);alert('⬢ CODE EXTRACTED!');}
        function copyNum(n){navigator.clipboard.writeText(n);alert('⬢ NUMBER COPIED!');}
        
        async function fetchOTP(){
            try{const d=await api('/api/otp?count=15');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('messages').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2]});}});}catch(e){}
        }
        
        function showStart(){el('messages').innerHTML='<div class="msg">⬢ <span style="color:#f0f;">GHOST_BOT ONLINE</span><br>Awaiting initialization...</div>';el('btnArea').innerHTML='<button class="btn" style="border-color:#f0f;color:#f0f;" onclick="loadServices()">⬢ INITIALIZE</button>';}
        
        async function loadServices(){el('btnArea').innerHTML='<div style="color:#f0f;text-align:center;">⬢ SCANNING SERVICES...</div>';try{const d=await api('/api/services');if(d.success){let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2===0)btns+='<div class="btn-row">';btns+=`<button class="btn" style="border-color:#f0f;color:#f0f;" onclick="loadCountries('${s.key}','${s.name}')">${s.name} [${s.count}]</button>`;if(i%2===1||i===d.services.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        
        async function loadCountries(key,name){cSvc=key;save();el('btnArea').innerHTML='<div style="color:#f0f;text-align:center;">⬢ MAPPING NODES...</div>';try{const d=await api('/api/countries?service='+key);if(d.success){let btns='';d.countries.slice(0,10).forEach((c,i)=>{if(i%2===0)btns+='<div class="btn-row">';btns+=`<button class="btn" style="border-color:#f0f;color:#f0f;" onclick="getNumber('${c.name}','${c.flag}')">${c.flag} ${c.name} [${c.count}]</button>`;if(i%2===1||i===d.countries.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        
        async function getNumber(country,flag){cCty=country;save();el('btnArea').innerHTML='<div style="color:#f0f;text-align:center;">⬢ EXTRACTING NUMBER...</div>';try{const d=await api('/api/otp?count=30');if(Array.isArray(d)){const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[Math.floor(Math.random()*Math.min(flt.length,5))][1];save();el('messages').innerHTML+=`<div class="msg">⬢ <span style="color:#f0f;">NUMBER ACQUIRED:</span> <span class="num">${curNum}</span></div>`;el('btnArea').innerHTML=`<div class="btn-row"><button class="btn" onclick="copyNum('${curNum}')">📋 COPY</button><button class="btn" onclick="getNumber('${country}','${flag}')">🔄 REROLL</button></div><div class="btn-row"><button class="btn" onclick="loadServices()">🌍 RESCAN</button><button class="btn btn-gold" onclick="checkCode('${curNum}')">📩 DECRYPT</button></div>`;}else{el('btnArea').innerHTML='<button class="btn btn-red" onclick="getNumber(country,flag)">⬢ RETRY EXTRACTION</button>';}}}catch(e){}}
        
        async function checkCode(num){try{const d=await api('/api/otp?count=40');if(Array.isArray(d)){const f=d.find(i=>i[1]===num);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];el('messages').innerHTML+=`<div class="msg">⬢ <span style="color:var(--gold);">DECRYPTED:</span> <span class="code">${cd}</span></div>`;}else{alert('⬢ PACKET NOT FOUND... RETRY');}}}catch(e){}}
        
        window.onload=()=>{if(S.cur==='group'||S.cur==='bot'){cur=S.cur;render();}else render();};
    </script>
</body>
</html>
