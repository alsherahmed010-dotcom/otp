<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>أرقام وهمية لجميع المنصات - استلم الكود في ثواني مجاناً</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
        body{background:#000;color:#0f0;min-height:100vh}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
        @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
        .app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
        .top-header{display:flex;justify-content:flex-end;gap:10px;padding-bottom:5px}
        .icon-btn{background:#000;border:1px solid #1a3a1a;color:#0f0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:16px}
        .icon-btn:hover{border-color:#0f0}
        .header{text-align:center;padding:10px 0 20px;border-bottom:2px solid #0f0;margin-bottom:15px}
        .header h1{font-size:22px;letter-spacing:2px;text-shadow:0 0 10px #0f0}
        .header .sub{font-size:12px;color:#0a0;margin-top:5px}
        .online-dot{display:inline-block;width:10px;height:10px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-left:5px}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .top-bar{display:flex;gap:8px;margin-bottom:15px;align-items:center}
        .search-box{flex:1;background:#0a0a0a;border:1px solid #1a3a1a;color:#0f0;padding:12px;font-size:13px;border-radius:8px;outline:none}
        .search-box:focus{border-color:#0f0}
        .btn-sm{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:12px 14px;font-size:13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:bold}
        .btn-sm:hover{background:#0f0;color:#000}
        .card{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;animation:in .2s}
        .card:hover{border-color:#0f0}
        @keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        .card .flag{font-size:32px;min-width:45px;text-align:center}
        .card .info{flex:1}
        .card .phone{color:#fff;font-weight:bold;font-size:16px;direction:ltr;text-align:left}
        .card .code{font-size:30px;font-weight:bold;color:#ff0;letter-spacing:3px;direction:ltr;text-shadow:0 0 10px #ff0;text-align:left}
        .card .prefix{color:#0ff;font-size:11px;text-align:left}
        .stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
        .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .num-box{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:14px;text-align:center;cursor:pointer}
        .num-box:hover{border-color:#0f0}
        .num-box .flag{font-size:28px}
        .num-box .svc{color:#f00;font-size:10px}
        .num-box .num{color:#fff;font-weight:bold;font-size:18px;direction:ltr}
        .num-box .code{background:#000;border:1px solid #ff0;color:#ff0;padding:4px 10px;border-radius:4px;font-weight:bold;font-size:16px;direction:ltr;display:inline-block;margin-top:6px}
        .tag{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-size:14px;display:inline-block;margin:4px}
        .tag:hover{border-color:#0f0}
        .tag .name{color:#fff;font-weight:bold}
        .tag .count{color:#ff0;font-size:12px}
        .tag .flag{font-size:24px}
        .btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .btn-row .btn-sm{flex:1;min-width:80px}
        .footer{text-align:center;padding:15px;color:#0a0;font-size:10px;margin-top:20px;border-top:1px solid #1a3a1a}
    </style>
</head>
<body>
    <div class="app" id="app"></div>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",
    projectId: "otp-5acda",
    databaseURL: "https://otp-5acda-default-rtdb.firebaseio.com"
});
const db = firebase.database();

var PROXY = 'https://ai-proxy-eosin.vercel.app/api/panel';
var known = {}, c = 0, allCards = [], page = 'main';
var isFirstLoad = true;
var myNums = JSON.parse(localStorage.getItem('myNums') || '[]');

var flags = {TG:'🇹🇬',LB:'🇱🇧',UA:'🇺🇦',AM:'🇦🇲',MZ:'🇲🇿',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',ID:'🇮🇩'};
var cNamesAr = {TG:'توجو',LB:'لبنان',UA:'أوكرانيا',AM:'أرمينيا',MZ:'موزمبيق',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',ID:'إندونيسيا'};

function getCountryName(code) { return cNamesAr[code] || code; }
function extractCode(txt) {
    if (!txt) return '---';
    var m = txt.match(/\d{3,8}[-.\s]?\d{3,8}/);
    if (m) return m[0];
    m = txt.match(/\d{4,8}/);
    return m ? m[0] : txt.substring(0, 15);
}

function saveNums() { localStorage.setItem('myNums', JSON.stringify(myNums)); }

var myRef = db.ref('online').push();
myRef.set({time: Date.now()});
myRef.onDisconnect().remove();
db.ref('online').on('value', function(snap) {
    var el = document.getElementById('onlineCount');
    if (el) el.textContent = snap.numChildren();
});

function add(i) {
    var code = extractCode(i[2] || '');
    var ct = (i[4] || '').trim();
    var flag = flags[ct] || '🌍';
    var prefix = i[1] ? i[1].substring(0, 7) : '';
    
    allCards.unshift({
        html: '<div class="card" onclick="navigator.clipboard.writeText(\'' + code + '\')"><span class="flag">' + flag + '</span><div class="info"><div class="phone">📱 +' + i[1] + '</div><div class="prefix">🆔 Prefix: ' + prefix + '</div><div class="code">' + code + '</div></div></div>',
        search: (i[1] || '') + ' ' + code
    });
    
    if (page === 'main') renderCards();
    c++;
    var s = document.getElementById('stats');
    if (s) s.textContent = '⬢ ' + c + ' أكواد';
}

function renderCards() {
    var q = (document.getElementById('search') ? document.getElementById('search').value : '').toLowerCase();
    var html = '';
    for (var i = 0; i < allCards.length; i++) {
        if (!q || allCards[i].search.toLowerCase().indexOf(q) >= 0) html += allCards[i].html;
    }
    var cards = document.getElementById('cards');
    if (cards) cards.innerHTML = html;
}

function filter() { renderCards(); }

function showMain() {
    page = 'main';
    document.getElementById('app').innerHTML = 
        '<div class="top-header">' +
            '<button class="icon-btn" onclick="showNumbers()">📱 أرقام</button>' +
            '<button class="icon-btn" onclick="showAnalysis()">🏆 تحليل</button>' +
        '</div>' +
        '<div class="header"><h1>⬢ OTP LIVE <span class="online-dot"></span> <span id="onlineCount">0</span></h1></div>' +
        '<div class="top-bar">' +
            '<input type="text" class="search-box" id="search" placeholder="🔍 بحث برقم أو كود..." onkeyup="filter()">' +
        '</div>' +
        '<div id="cards"></div>' +
        '<div class="stats" id="stats">⬢ 0 أكواد</div>' +
        '<div class="footer">أرقام وهمية لجميع المنصات - استلم كود التفعيل مجاناً | واتساب - فيسبوك - تيك توك - انستجرام</div>';
    renderCards();
}

function showAnalysis() {
    page = 'analysis';
    document.getElementById('app').innerHTML = '<div class="header"><h1>🏆 تحليل</h1></div><button class="btn-sm" onclick="showMain()">← رجوع</button><div id="content" style="margin-top:10px">⏳ جاري التحميل...</div>';
    fetch('/api/otp?count=200').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (!Array.isArray(list) || list.length === 0) {
            document.getElementById('content').innerHTML = '<div style="color:#f00;text-align:center">❌ لا توجد أكواد</div>';
            return;
        }
        var svcs = {};
        list.forEach(function(i) {
            var svc = i[0] || 'Unknown';
            if (!svcs[svc]) svcs[svc] = {};
            var ct = (i[4] || '').trim();
            if (ct) svcs[svc][ct] = (svcs[svc][ct] || 0) + 1;
        });
        var html = '';
        for (var svc in svcs) {
            var top = [];
            for (var k in svcs[svc]) top.push([k, svcs[svc][k]]);
            top.sort(function(a, b) { return b[1] - a[1]; });
            top = top.slice(0, 5);
            html += '<div style="margin-bottom:15px"><h3 style="color:#ff0">📱 ' + svc + '</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';
            for (var i = 0; i < top.length; i++) {
                html += '<div class="tag"><div class="flag">' + (flags[top[i][0]] || '🌍') + '</div><div class="name">' + getCountryName(top[i][0]) + '</div><div class="count">' + top[i][1] + '</div></div>';
            }
            html += '</div></div>';
        }
        document.getElementById('content').innerHTML = html;
    }).catch(function() {
        document.getElementById('content').innerHTML = '<div style="color:#f00;text-align:center">❌ لا توجد أكواد</div>';
    });
}

function showNumbers() {
    page = 'services';
    document.getElementById('app').innerHTML = '<div class="header"><h1>📱 أرقام</h1></div><button class="btn-sm" onclick="showMain()">← رجوع</button><div id="content" style="margin-top:10px">⏳ جاري التحميل...</div>';
    fetch('/api/services').then(function(r) { return r.json(); }).then(function(d) {
        if (!d || !d.services) return;
        var html = '';
        d.services.forEach(function(s) {
            html += '<div class="tag" onclick="showCountries(\'' + s.key + '\',\'' + s.name + '\')"><div class="name">' + s.name + '</div><div class="count">' + s.count + '</div></div>';
        });
        document.getElementById('content').innerHTML = html;
    });
}

function showCountries(key, name) {
    document.getElementById('app').innerHTML = '<div class="header"><h1>🌍 ' + name + '</h1></div><button class="btn-sm" onclick="showNumbers()">← رجوع</button><div id="content" style="margin-top:10px">⏳ جاري التحميل...</div>';
    fetch('/api/countries?service=' + key).then(function(r) { return r.json(); }).then(function(d) {
        if (!d || !d.countries) return;
        var html = '';
        d.countries.forEach(function(c) {
            html += '<div class="tag" onclick="showNums(\'' + c.name + '\',\'' + (c.flag || '') + '\',\'' + name + '\',\'' + key + '\')"><div class="flag">' + (c.flag || '🌍') + '</div><div class="name">' + getCountryName(c.name) + '</div><div class="count">' + c.count + '</div></div>';
        });
        document.getElementById('content').innerHTML = html;
    });
}

function showNums(country, flag, svcName, svcKey) {
    document.getElementById('app').innerHTML = '<div class="header"><h1>' + flag + ' ' + getCountryName(country) + '</h1></div><button class="btn-sm" onclick="showCountries(\'' + svcKey + '\',\'' + svcName + '\')">← رجوع</button><div id="numsArea" style="margin-top:10px">⏳ جاري جلب الأرقام...</div>';
    var promises = [];
    for (var i = 0; i < 4; i++) {
        promises.push(fetch(PROXY + '/request_number', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ service: svcKey, country: country })
        }).then(function(r) { return r.json(); }));
    }
    Promise.all(promises).then(function(results) {
        myNums = [];
        var html = '<div class="grid2">';
        results.forEach(function(d) {
            if (d && d.number) {
                var obj = { num: d.number, flag: d.flag || flag, svc: svcName, country: country, code: '' };
                myNums.push(obj);
                html += '<div class="num-box" onclick="navigator.clipboard.writeText(\'' + d.number + '\')"><div class="flag">' + (d.flag || flag || '🌍') + '</div><div class="svc">' + svcName + '</div><div class="num">+' + d.number + '</div><div class="code" id="cd_' + d.number + '">---</div></div>';
            }
        });
        saveNums();
        html += '</div><div class="btn-row"><button class="btn-sm" onclick="showNums(\'' + country + '\',\'' + flag + '\',\'' + svcName + '\',\'' + svcKey + '\')">🔄 تغيير</button><button class="btn-sm" onclick="showCountries(\'' + svcKey + '\',\'' + svcName + '\')">🌍 دولة</button><button class="btn-sm" onclick="showNumbers()">📱 خدمة</button></div><div class="btn-row"><button class="btn-sm" onclick="fetchCodes(\'' + country + '\')">📩 أكواد</button></div>';
        document.getElementById('numsArea').innerHTML = html;
    });
}

function fetchCodes(country) {
    fetch('/api/otp?count=50').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (!Array.isArray(list) || list.length === 0) { alert('❌ لا توجد أكواد'); return; }
        var flt = list.filter(function(i) { return i[4] && i[4].trim() === country; });
        if (flt.length === 0) { alert('❌ لا توجد أكواد لهذه الدولة'); return; }
        flt.forEach(function(i) {
            var code = extractCode(i[2] || '');
            var el = document.getElementById('cd_' + i[1]);
            if (el) el.textContent = code;
            myNums.forEach(function(n) { if (n.num === i[1]) n.code = code; });
        });
        saveNums();
    });
}

function cleanOldUsers() {
    db.ref("online").once("value").then(function(snap) {
        snap.forEach(function(s) {
            var d = s.val();
            if (d && Date.now() - d.time > 300000) db.ref("online/" + s.key).remove();
        });
    });
}

function go() {
    fetch('/api/otp?count=20').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (Array.isArray(list)) {
            for (var idx = list.length - 1; idx >= 0; idx--) {
                var i = list[idx];
                if (!i || !i[1]) continue;
                var k = i[1] + '-' + i[2];
                if (!known[k]) {
                    known[k] = true;
                    add(i);
                }
            }
            isFirstLoad = false;
        }
    }).catch(function(){});
}

cleanOldUsers();
showMain();
go();
setInterval(go, 1000);
setInterval(cleanOldUsers, 10000);
</script>
</body>
</html>
