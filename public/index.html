<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0e1621; --surface: #17212b; --card: #1e293b; --accent: #3b82f6; --accent2: #8b5cf6; --gold: #f59e0b; --green: #10b981; --text: #f1f5f9; --text2: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app { width: 100%; max-width: 430px; height: 100vh; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: var(--card); padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 56px; }
        .back { color: var(--accent); font-size: 22px; cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff; flex-shrink: 0; overflow: hidden; background: var(--accent); font-weight: bold; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; }
        .header-info .name { font-size: 16px; font-weight: 600; color: #fff; }
        .header-info .status { font-size: 12px; color: var(--text2); }
        
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .screen.hidden { display: none !important; }
        
        .search-bar { padding: 10px 16px; }
        .search-bar input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 25px; color: #fff; font-size: 15px; outline: none; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-row { display: flex; align-items: center; padding: 13px 16px; gap: 12px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .chat-row:hover { background: rgba(255,255,255,0.02); }
        .chat-row .avatar { width: 52px; height: 52px; font-size: 21px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 3px; }
        .chat-row .preview { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.5; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg-in { align-self: flex-start; background: var(--card); border-bottom-right-radius: 3px; }
        .msg-out { align-self: flex-end; background: var(--accent); border-bottom-left-radius: 3px; }
        .msg-otp { align-self: flex-start; background: var(--card); border-right: 3px solid var(--gold); border-bottom-right-radius: 3px; }
        .msg .sender { font-size: 12px; font-weight: 600; color: #93c5fd; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .msg .sender-av { width: 24px; height: 24px; border-radius: 50%; font-size: 10px; background: var(--accent2); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
        .msg .sender-av img { width: 100%; height: 100%; object-fit: cover; }
        .msg .number { color: #60a5fa; font-weight: 700; font-size: 15px; }
        .msg .code { background: var(--gold); color: #000; padding: 3px 10px; border-radius: 5px; font-weight: 700; display: inline-block; margin: 4px 0; font-size: 16px; }
        .msg .time { font-size: 11px; color: var(--text2); margin-top: 4px; }
        .msg .country { color: var(--green); font-size: 11px; }
        
        .btn-area { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); background: var(--card); display: flex; flex-direction: column; gap: 8px; }
        .btn { padding: 11px 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-blue { background: var(--accent); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        
        .input-bar { padding: 12px 16px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .input-bar input { flex: 1; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 25px; color: #fff; font-size: 15px; outline: none; }
        .input-bar button { background: var(--accent); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        
        .nav-bar { display: flex; justify-content: space-around; padding: 10px 0; background: var(--card); border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text2); font-size: 11px; cursor: pointer; gap: 3px; background: none; border: none; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }
        
        .fab { position: absolute; bottom: 80px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 26px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(59,130,246,0.4); z-index: 10; display: flex; align-items: center; justify-content: center; }
        
        .setup { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 18px; }
        .setup .avatar { width: 85px; height: 85px; font-size: 38px; cursor: pointer; }
        .setup input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 14px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .setup input[type="file"] { display: none; }
        
        .profile-page { padding: 25px; text-align: center; overflow-y: auto; flex: 1; }
        .profile-page .avatar { width: 80px; height: 80px; font-size: 35px; margin: 0 auto 15px; cursor: pointer; }
        .profile-page input { width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: #fff; font-size: 15px; text-align: center; margin: 8px 0; outline: none; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
        .modal-box h3 { margin-bottom: 16px; font-size: 18px; }
        .modal-box .btn { width: 100%; margin-bottom: 8px; }
        
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>
    <audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        
        let S=JSON.parse(localStorage.getItem('hub_v9')||'{}');
        let cur=S.cur||'setup',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let profile=S.profile||{name:'',phone:'',avatar:'',username:''};
        let known=new Set(),otpTimer=null;
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        
        function save(){localStorage.setItem('hub_v9',JSON.stringify({cur,cSvc,cCty,curNum,profile}));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        function el(id){return document.getElementById(id);}
        
        function render(){
            const app=el('app');
            if(cur==='setup')app.innerHTML='<div class="setup"><h2 style="font-size:20px;">🚀 أهلاً بك</h2><div class="avatar" id="avSetup" onclick="document.getElementById(\'fSetup\').click()">📷</div><input type="file" id="fSetup" accept="image/*" onchange="prev(this,\'avSetup\')"><input id="inPhone" placeholder="رقم الهاتف (مع كود الدولة)" value="'+profile.phone+'" type="tel"><input id="inName" placeholder="الاسم" value="'+profile.name+'"><input id="inUser" placeholder="يوزر نيم (اختياري)" value="'+profile.username+'"><button class="btn btn-blue" style="width:100%;" onclick="saveSetup()">دخول 🚀</button></div>';
            else if(cur==='main')app.innerHTML=renderMain();
            else if(cur==='bot'||cur==='group')app.innerHTML=renderChat();
            else if(cur==='profile')app.innerHTML=renderProfile();
            bindEvents();
        }
        
        function renderMain(){
            return `<div class="screen"><div class="header"><div class="avatar" onclick="openScreen('profile')">${profile.avatar?`<img src="${profile.avatar}">`:(profile.name?profile.name[0]:'👤')}</div><div class="header-info"><div class="name">OTP Hub</div><div class="status">${profile.name||'مستخدم'}</div></div></div><div class="search-bar"><input type="text" placeholder="🔍 بحث برقم أو يوزر..." onkeypress="if(event.key==='Enter')search(this.value)"></div><div class="chat-list"><div class="chat-row" onclick="openChat('bot')"><div class="avatar" style="background:#3b82f6;">🤖</div><div class="info"><div class="name">🤖 NUMBER BOT</div><div class="preview">${curNum?'الرقم: '+curNum:'بوت الأرقام والخدمات'}</div></div></div><div class="chat-row" onclick="openChat('group')"><div class="avatar" style="background:#e17076;">👥</div><div class="info"><div class="name">👥 OTP GROUP</div><div class="preview">Live OTP</div></div></div></div><div class="nav-bar"><button class="nav-item active" onclick="openScreen('main')"><span class="nav-icon">💬</span>محادثات</button><button class="nav-item" onclick="openScreen('profile')"><span class="nav-icon">👤</span>ملف</button></div><button class="fab" onclick="showFab()">+</button></div>`;
        }
        
        function renderChat(){
            const isBot=cur==='bot';
            return `<div class="screen"><div class="header"><div class="back" onclick="goBack()">←</div><div class="avatar" style="background:${isBot?'#3b82f6':'#e17076'};">${isBot?'🤖':'👥'}</div><div class="header-info"><div class="name">${isBot?'🤖 NUMBER BOT':'👥 OTP GROUP'}</div><div class="status">${isBot?'online':'live'}</div></div></div><div class="messages" id="messages"></div>${isBot?'<div class="btn-area" id="btnArea"></div>':'<div class="input-bar"><input type="text" id="groupInput" placeholder="رسالة..." onkeypress="if(event.key===\'Enter\')sendGroupMsg()"><button onclick="sendGroupMsg()">📤</button></div>'}</div>`;
        }
        
        function renderProfile(){
            return `<div class="screen"><div class="header"><div class="back" onclick="goBack()">←</div><div class="header-info"><div class="name">👤 الملف الشخصي</div></div></div><div class="profile-page"><div class="avatar" onclick="document.getElementById('fProf').click()">${profile.avatar?`<img src="${profile.avatar}">`:'📷'}</div><input type="file" id="fProf" accept="image/*" onchange="prev(this,'avProf')"><input id="eName" placeholder="الاسم" value="${profile.name}"><input id="ePhone" placeholder="رقم الهاتف" value="${profile.phone}"><input id="eUser" placeholder="يوزر نيم" value="${profile.username}"><button class="btn btn-blue" style="width:100%;margin-top:10px;" onclick="saveProfile()">💾 حفظ</button></div></div>`;
        }
        
        function bindEvents(){
            if(cur==='setup'&&profile.avatar){const a=el('avSetup');if(a)a.innerHTML='<img src="'+profile.avatar+'">';}
            if(cur==='bot'){if(curNum){el('messages').innerHTML='<div class="msg msg-in">📱 <span class="number">'+curNum+'</span></div>';el('btnArea').innerHTML='<div class="btn-row"><button class="btn btn-green" onclick="copyNum(\''+curNum+'\')">📋 نسخ</button><button class="btn btn-blue" onclick="loadServices()">🌍 دولة</button></div><div class="btn-row"><button class="btn btn-outline" onclick="getNumber(\''+cCty+'\',\'\')">🔄 تغيير</button><button class="btn btn-gold" onclick="checkCode(\''+curNum+'\')">📩 كود</button></div>';}else showStart();}
            if(cur==='group'){el('messages').innerHTML='';db.ref('group_msgs').off();db.ref('group_msgs').limitToLast(50).on('child_added',s=>{if(cur==='group')showGroupMsg(s.val())});if(otpTimer)clearInterval(otpTimer);otpTimer=setInterval(fetchOTP,2000);fetchOTP();}
        }
        
        function showGroupMsg(m){
            if(cur!=='group')return;
            const t=m.time||new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            const isMe=m.phone===profile.phone;
            if(m.type==='otp'){
                const cn=cNames[m.country]||m.country||'';
                el('messages').innerHTML+=`<div class="msg msg-otp">📩 ${m.service} <span class="country">${cn}</span><br>📱 <span class="number">${m.number}</span><br>🔑 <span class="code">${m.code}</span><div class="time">${t}</div><button class="btn btn-gold" style="margin-top:6px;width:100%;padding:8px;font-size:13px;" onclick="copyCode('${m.code}')">📋 نسخ الكود</button></div>`;
            }else{
                el('messages').innerHTML+=`<div class="msg ${isMe?'msg-out':'msg-in'}"><div class="sender" onclick="showContact('${m.phone}','${m.sender}','${m.avatar||''}')"><span class="sender-av">${m.avatar?`<img src="${m.avatar}">`:'👤'}</span>${m.sender||'مستخدم'}</div>${m.text}<div class="time">${t}</div></div>`;
            }
            el('messages').scrollTop=el('messages').scrollHeight;
            el('sound').play().catch(()=>{});
        }
        
        function showContact(phone,name,avatar){
            const box=el('modalBox');
            box.innerHTML=`<h3>👤 ${name}</h3><p style="color:var(--text2);margin-bottom:12px;">📱 ${phone}</p><button class="btn btn-blue" onclick="openPrivate('${phone}','${name}')">💬 محادثة</button><button class="btn btn-outline" style="margin-top:8px;" onclick="closeModal()">إلغاء</button>`;
            el('modal').classList.remove('hidden');
        }
        
        function openPrivate(phone,name){
            closeModal();
            if(confirm('فتح محادثة واتساب مع '+name+'؟'))window.open('https://wa.me/'+phone.replace(/\D/g,''),'_blank');
        }
        
        function prev(input,id){const f=input.files[0];if(f){const r=new FileReader();r.onload=function(e){const a=document.getElementById(id);if(a)a.innerHTML='<img src="'+e.target.result+'">';profile.avatar=e.target.result;};r.readAsDataURL(f);}}
        function saveSetup(){profile.phone=el('inPhone').value||'';profile.name=el('inName').value||'مستخدم';profile.username=el('inUser').value||'';save();db.ref('users/'+btoa(profile.phone)).set(profile);cur='main';render();}
        function saveProfile(){profile.name=el('eName').value||profile.name;profile.phone=el('ePhone').value||profile.phone;profile.username=el('eUser').value||'';save();db.ref('users/'+btoa(profile.phone)).set(profile);cur='main';render();}
        function openScreen(s){cur=s;save();if(otpTimer)clearInterval(otpTimer);render();}
        function openChat(t){cur=t;save();render();}
        function goBack(){cur='main';save();if(otpTimer)clearInterval(otpTimer);render();}
        
        function copyCode(c){navigator.clipboard.writeText(c);}
        function copyNum(n){navigator.clipboard.writeText(n);}
        
        async function fetchOTP(){
            try{const d=await api('/api/otp?count=15');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('group_msgs').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],country:i[4]||'',time:new Date().toLocaleTimeString('ar-EG')});}});}catch(e){}
        }
        
        function sendGroupMsg(){const inp=el('groupInput'),tx=inp.value.trim();if(!tx||!profile.name)return;db.ref('group_msgs').push({type:'user',text:tx,sender:profile.name,phone:profile.phone,avatar:profile.avatar,time:new Date().toLocaleTimeString('ar-EG')});inp.value='';}
        
        function showFab(){
            const box=el('modalBox');
            box.innerHTML=`<h3>➕ إنشاء</h3><button class="btn btn-blue" onclick="createGroup()">👥 مجموعة</button><button class="btn btn-outline" style="margin:8px 0;" onclick="createChannel()">📢 قناة</button><button class="btn btn-blue" onclick="addContact()">💬 محادثة جديدة</button><button class="btn" style="background:#444;color:#fff;margin-top:8px;" onclick="closeModal()">إلغاء</button>`;
            el('modal').classList.remove('hidden');
        }
        function closeModal(){el('modal').classList.add('hidden');}
        function createGroup(){closeModal();const n=prompt('اسم المجموعة:');if(n){db.ref('groups').push({name:n,createdBy:profile.phone,members:[profile.phone]});alert('✅ تم!');}}
        function createChannel(){closeModal();const n=prompt('اسم القناة:');if(n){db.ref('channels').push({name:n,createdBy:profile.phone});alert('✅ تم!');}}
        function addContact(){closeModal();const p=prompt('رقم الهاتف (مع كود الدولة):');if(p){db.ref('users/'+btoa(p)).once('value').then(s=>{if(s.val()){if(confirm('👤 '+s.val().name+'\n📱 '+p+'\n\nفتح محادثة واتساب؟'))window.open('https://wa.me/'+p.replace(/\D/g,''),'_blank');}else{alert('❌ المستخدم غير مسجل');}});}
        
        function search(q){
            if(!q)return;
            db.ref('users').orderByChild('username').equalTo(q).once('value').then(s=>{
                if(s.val()){const u=Object.values(s.val())[0];if(confirm('👤 '+u.name+'\n📱 '+u.phone+'\n\nفتح محادثة واتساب؟'))window.open('https://wa.me/'+u.phone.replace(/\D/g,''),'_blank');}
                else{alert('❌ لم يتم العثور على المستخدم');}
            });
        }
        
        function showStart(){el('messages').innerHTML='<div class="msg msg-in">👋 أهلًا بك في NUMBER BOT!</div>';el('btnArea').innerHTML='<button class="btn btn-blue" style="width:100%;" onclick="loadServices()">▶️ START</button>';}
        async function loadServices(){el('btnArea').innerHTML='';try{const d=await api('/api/services');if(d.success){let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-outline" onclick="loadCountries(\''+s.key+'\',\''+s.name+'\')">'+s.name+' ('+s.count+')</button>';if(i%2===1||i===d.services.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function loadCountries(key,name){cSvc=key;save();el('btnArea').innerHTML='';try{const d=await api('/api/countries?service='+key);if(d.success){let btns='';d.countries.slice(0,10).forEach((c,i)=>{const cn=cNames[c.name]||c.name;if(i%2===0)btns+='<div class="btn-row">';btns+='<button class="btn btn-outline" onclick="getNumber(\''+c.name+'\',\''+c.flag+'\')">'+c.flag+' '+cn+' ('+c.count+')</button>';if(i%2===1||i===d.countries.length-1)btns+='</div>';});el('btnArea').innerHTML=btns;}}catch(e){}}
        async function getNumber(country,flag){cCty=country;save();el('btnArea').innerHTML='';try{const d=await api('/api/otp?count=30');if(Array.isArray(d)){const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[Math.floor(Math.random()*Math.min(flt.length,5))][1];save();const cn=cNames[country]||country;el('messages').innerHTML+='<div class="msg msg-in">📱 <span class="number">'+curNum+'</span><br><span class="country">'+flag+' '+cn+'</span></div>';el('btnArea').innerHTML='<div class="btn-row"><button class="btn btn-green" onclick="copyNum(\''+curNum+'\')">📋 نسخ</button><button class="btn btn-blue" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 تغيير</button></div><div class="btn-row"><button class="btn btn-outline" onclick="loadServices()">🌍 دولة</button><button class="btn btn-gold" onclick="checkCode(\''+curNum+'\')">📩 كود</button></div>';}else{el('btnArea').innerHTML='<button class="btn btn-outline" style="width:100%;" onclick="getNumber(\''+country+'\',\''+flag+'\')">🔄 جرب تاني</button>';}}}catch(e){}}
        async function checkCode(num){try{const d=await api('/api/otp?count=40');if(Array.isArray(d)){const f=d.find(i=>i[1]===num);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];el('messages').innerHTML+='<div class="msg msg-in">✅ الكود: <span class="code">'+cd+'</span></div>';el('messages').scrollTop=el('messages').scrollHeight;}else{el('messages').innerHTML+='<div class="msg msg-in">⏳ لم يصل بعد...</div>';el('messages').scrollTop=el('messages').scrollHeight;}}}catch(e){}}
        
        window.onload=()=>{
            if(!profile.name||!profile.phone){cur='setup';render();}else{cur=S.cur||'main';render();}
        };
    </script>
</body>
</html>
