<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⬢ OTP LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
body{background:#000;color:#0f0;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite;z-index:0}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
.scanline{position:fixed;top:0;left:0;width:100%;height:2px;background:rgba(0,255,0,.4);animation:scanline 3s linear infinite;z-index:100;pointer-events:none}
@keyframes scanline{0%{top:0}100%{top:100vh}}
.top-header{display:flex;justify-content:flex-end;gap:8px;padding-bottom:5px}
.icon-btn{background:#000;border:1px solid #1a3a1a;color:#0f0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.header{text-align:center;padding:10px 0 15px;border-bottom:2px solid #0f0;margin-bottom:15px}
.header h1{font-size:22px;letter-spacing:3px;text-shadow:0 0 15px #0f0}
.header .sub{font-size:10px;color:#0a0;margin-top:5px}
.live-dot{display:inline-block;width:10px;height:10px;background:#0f0;border-radius:50%;animation:blink 1s infinite;margin-left:5px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.top-bar{display:flex;gap:8px;margin-bottom:15px}
.search-box{flex:1;background:#0a0a0a;border:1px solid #1a3a1a;color:#0f0;padding:12px;font-size:13px;border-radius:8px;outline:none}
.btn-sm{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:10px 12px;font-size:12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:bold}
.card{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;animation:in .3s}
.card.new{border-color:#ff0}
@keyframes in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.card .flag{font-size:32px;min-width:45px;text-align:center}
.card .info{flex:1}
.card .phone{color:#fff;font-weight:bold;font-size:15px;direction:ltr;text-align:left}
.card .code{font-size:28px;font-weight:bold;color:#ff0;letter-spacing:3px;direction:ltr;text-align:left}
.card .svc{color:#f00;font-size:10px}
.copy-btn{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px}
.footer{text-align:center;padding:15px;color:#0a0;font-size:10px;margin-top:20px;border-top:1px solid #1a3a1a}
.loading{text-align:center;color:#0a0;padding:30px}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="app" id="app"></div>

<script>
const BASE = 'https://numberpanel.tech/api';
const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://thingproxy.freeboard.io/fetch/'
];

var known = {};
var allCards = [];
var totalCodes = 0;
var isFirstLoad = true;
var proxyIndex = 0;

var flags = {'Ukraine':'🇺🇦','Togo':'🇹🇬','Haiti':'🇭🇹','Mozambique':'🇲🇿','Burkina Faso':'🇧🇫','Libya':'🇱🇾','USA':'🇺🇸'};

function extractCode(txt) {
    if (!txt) return '---';
    var codes = txt.match(/\d{3}[-.\s]?\d{3}/g);
    if (codes) return codes[0];
    var m = txt.match(/\d{4,8}/);
    return m ? m[0] : '---';
}

function addCard(i, isNew) {
    var code = extractCode(i[2] || '');
    var ct = (i[4] || '').trim();
    var flag = flags[ct] || '🌍';
    var svc = i[0] || '';
    var phone = i[1] || '';
    
    allCards.unshift({
        html: '<div class="card' + (isNew ? ' new' : '') + '">' +
            '<span class="flag">' + flag + '</span>' +
            '<div class="info">' +
                '<div class="phone">📱 +' + phone + ' <span class="svc">[' + svc + ']</span></div>' +
                '<div class="code">' + code + '</div>' +
            '</div>' +
            '<button class="copy-btn" onclick="event.stopPropagation();copyCode(\'' + code + '\')">📋 نسخ</button>' +
        '</div>'
    });
    totalCodes++;
}

function copyCode(c) { navigator.clipboard.writeText(c); }

function renderCards(q) {
    q = (q || '').toLowerCase();
    var html = '';
    for (var i = 0; i < allCards.length && i < 50; i++) {
        if (!q || allCards[i].html.toLowerCase().indexOf(q) >= 0) html += allCards[i].html;
    }
    document.getElementById('cards').innerHTML = html || '<div class="loading">❌ مفيش نتايج</div>';
    document.getElementById('stats').textContent = '⬢ ' + totalCodes + ' أكواد';
}

function showMain() {
    document.getElementById('app').innerHTML = 
        '<div class="top-header">' +
            '<button class="icon-btn" onclick="showAnalysis()">🏆 تحليل</button>' +
            '<button class="icon-btn" onclick="showNumbers()">📱 أرقام</button>' +
        '</div>' +
        '<div class="header"><h1>⬢ OTP LIVE <span class="live-dot"></span></h1><div class="sub">تحديث كل ثانية</div></div>' +
        '<div class="top-bar"><input type="text" class="search-box" placeholder="🔍 بحث..." onkeyup="renderCards(this.value)"></div>' +
        '<div id="stats" style="color:#0a0;font-size:11px;padding:5px">⬢ 0 أكواد</div>' +
        '<div id="cards"><div class="loading">⏳ جاري التحميل...</div></div>' +
        '<div class="footer">OTP LIVE</div>';
}

function showAnalysis() {
    document.getElementById('app').innerHTML = '<div class="header"><h1>🏆 تحليل</h1></div><button class="btn-sm" onclick="showMain()">← رجوع</button><div id="content" style="margin-top:10px"><div class="loading">⏳...</div></div>';
    
    fetch(PROXIES[0] + encodeURIComponent(BASE + '/stats/detailed?period=daily'))
    .then(r => r.json())
    .then(d => {
        document.getElementById('content').innerHTML = 
            '<div style="background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:20px;text-align:center">' +
            '<p style="font-size:30px;color:#ff0">📊 ' + (d.otp_count || 0) + '</p><p>كود اليوم</p>' +
            '<p>🌍 ' + (d.countries_count || 0) + ' دولة</p>' +
            '<p>📱 ' + (d.services_count || 0) + ' خدمة</p></div>';
    })
    .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">❌ فشل</div>'; });
}

function showNumbers() {
    document.getElementById('app').innerHTML = '<div class="header"><h1>📱 أرقام</h1></div><button class="btn-sm" onclick="showMain()">← رجوع</button><div id="content" style="margin-top:10px"><div class="loading">⏳...</div></div>';
    
    fetch(PROXIES[0] + encodeURIComponent(BASE + '/my_numbers'), {headers: {'Authorization': 'Bearer np_live_6DknI4df2uZ0_BFv6CGGpX_BCBAq60TG1sKev64WPkw'}})
    .then(r => r.json())
    .then(d => {
        var nums = d.numbers || [];
        document.getElementById('content').innerHTML = nums.length === 0 ? 
            '<div class="loading">❌ لا توجد أرقام</div>' :
            nums.map(n => '<div style="background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:15px;margin-bottom:8px">📱 +' + n + '</div>').join('');
    })
    .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">❌ فشل</div>'; });
}

function fetchOTP() {
    var proxy = PROXIES[proxyIndex];
    fetch(proxy + encodeURIComponent(BASE + '/otp?count=50'))
    .then(r => r.json())
    .then(d => {
        var list = Array.isArray(d) ? d : (d.data || []);
        if (list.length > 0) {
            var newCount = 0;
            for (var idx = 0; idx < list.length; idx++) {
                var i = list[idx];
                if (!i || !i[1]) continue;
                var k = i[1] + '-' + i[2];
                if (!known[k]) {
                    known[k] = true;
                    addCard(i, !isFirstLoad);
                    if (!isFirstLoad) newCount++;
                }
            }
            isFirstLoad = false;
            var q = document.querySelector('.search-box') ? document.querySelector('.search-box').value : '';
            renderCards(q);
            var stats = document.getElementById('stats');
            if (stats) stats.textContent = '⬢ ' + totalCodes + ' أكواد' + (newCount > 0 ? ' | +' + newCount + ' 🔥' : '');
        }
    })
    .catch(() => {
        proxyIndex = (proxyIndex + 1) % PROXIES.length;
    });
}

showMain();
fetchOTP();
setInterval(fetchOTP, 1000);
</script>
</body>
</html>
