var flags = {TG:'🇹🇬',LB:'🇱🇧',UA:'🇺🇦',AM:'🇦🇲',MZ:'🇲🇿',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',ID:'🇮🇩'};

function getCountryName(code) {
    return (curLang === 'ar' ? cNamesAr[code] : cNamesEn[code]) || code;
}

function applyLangDir() {
    document.documentElement.lang = curLang;
    document.documentElement.dir = curLang === 'ar' ? 'rtl' : 'ltr';
}

function setLanguage(lang) {
    curLang = lang;
    localStorage.setItem('appLang', lang);
    applyLangDir();
    if (page === 'settings') showSettings();
    else showMain();
}

function toggleNotifications() {
    if (!("Notification" in window)) {
        alert(dict[curLang].notifNotSupported);
        return;
    }
    if (Notification.permission === "granted") {
        alert(dict[curLang].notifActive);
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function(permission) {
            if (permission === "granted") {
                alert(dict[curLang].notifSuccessMsg);
                new Notification("OTP Live", {
                    body: curLang === 'ar' ? "سيصلك إشعار فور وصول أي كود جديد!" : "You will receive notifications for new codes!"
                });
            } else {
                alert(dict[curLang].notifBlocked);
            }
            if (page === 'settings') showSettings();
            else showMain();
        });
    } else {
        alert(dict[curLang].notifBlocked);
    }
}

function triggerCodeNotification(phone, code) {
    if ("Notification" in window && Notification.permission === "granted") {
        new Notification(dict[curLang].newCodeTitle, {
            body: (curLang === 'ar' ? 'الرقم: ' : 'Phone: ') + '+' + phone + '\n' + (curLang === 'ar' ? 'الكود: ' : 'Code: ') + code
        });
    }
}

var myRef = db.ref('online').push();
myRef.set({time: Date.now()});
myRef.onDisconnect().remove();
db.ref('online').on('value', function(snap) {
    var count = snap.numChildren();
    var el = document.getElementById('onlineCount');
    if (el) el.textContent = count;
});

function saveNums() { localStorage.setItem('myNums', JSON.stringify(myNums)); }

function extractCode(txt) {
    if (!txt) return '---';
    var m = txt.match(/\d{3,8}[-.\s]?\d{3,8}/);
    if (m) return m[0];
    m = txt.match(/\d{4,8}/);
    return m ? m[0] : txt.substring(0, 15);
}

function add(i) {
    var code = extractCode(i[2] || '');
    var ct = (i[4] || '').trim();
    var flag = flags[ct] || '🌍';
    var prefix = i[1] ? i[1].substring(0, 7) : '';
    
    allCards.unshift({
        html: '<div class="card" onclick="navigator.clipboard.writeText(\'' + code + '\')"><span class="flag">' + flag + '</span><div class="info"><div class="phone">📱 +' + i[1] + '</div><div class="prefix">🆔 Prefix: ' + prefix + '</div><div class="code">' + code + '</div></div></div>',
        search: (i[1] || '') + ' ' + code
    });
    
    if (page === 'main') { renderCards(); }
    c++;
    var s = document.getElementById('stats');
    if (s) s.textContent = '⬢ ' + c + ' ' + dict[curLang].codesCount;
}

function renderCards() {
    var q = (document.getElementById('search') ? document.getElementById('search').value : '').toLowerCase();
    var html = '';
    for (var i = 0; i < allCards.length; i++) {
        if (!q || allCards[i].search.toLowerCase().indexOf(q) >= 0) html += allCards[i].html;
    }
    var cards = document.getElementById('cards');
    if (cards) cards.innerHTML = html;
}

function filter() { renderCards(); }

function showMain() {
    page = 'main';
    applyLangDir();
    var notifIcon = ("Notification" in window && Notification.permission === "granted") ? "🔔" : "🔕";
    
    document.getElementById('app').innerHTML = 
        '<div class="top-header">' +
            '<button class="icon-btn" onclick="toggleNotifications()" title="' + dict[curLang].notifLabel + '">' + notifIcon + '</button>' +
            '<button class="icon-btn" onclick="showSettings()" title="' + dict[curLang].btnSettings + '">⚙️</button>' +
        '</div>' +
        '<div class="header"><h1>⬢ OTP LIVE <span class="online-dot"></span> <span id="onlineCount">0</span></h1></div>' +
        '<div class="top-bar">' +
            '<input type="text" class="search-box" id="search" placeholder="' + dict[curLang].searchPlaceholder + '" onkeyup="filter()">' +
            '<button class="btn-sm" onclick="showAnalysis()">' + dict[curLang].btnAnalysis + '</button>' +
            '<button class="btn-sm" onclick="showNumbers()">' + dict[curLang].btnNumbers + '</button>' +
        '</div>' +

        '<div id="myNumsArea"></div>' +

    renderCards();

    page = 'settings';

        '<button class="btn-sm" onclick="showMain()">' + dict[curLang].back + '</button>' +

            '<div class="setting-box">' +
                '<h3>' + dict[curLang].langLabel + '</h3>' +

                    '<button class="btn-sm ' + (curLang === 'ar' ? 'btn-active' : '') + '" onclick="setLanguage(\'ar\')">العربية 🇪🇬</button>' +
                    '<button class="btn-sm ' + (curLang === 'en' ? 'btn-active' : '') + '" onclick="setLanguage(\'en\')">English 🇬🇧</button>' +
                '</div>' +
            '</div>' +
            '<div class="setting-box">' +
                '<h3>' + dict[curLang].notifLabel + '</h3>' +

function showMyNums() {
    var html = '<div style="margin-top:15px"><h3 style="color:#ff0;margin-bottom:8px">' + dict[curLang].myNumbers + ' (' + myNums.length + ')</h3><div class="grid2">';
    myNums.forEach(function(n) {
        html += '<div class="num-box" onclick="navigator.clipboard.writeText(\'' + n.num + '\')"><div class="flag">' + (n.flag || '🌍') + '</div><div class="svc">' + n.svc + '</div><div class="num">+' + n.num + '</div><div class="code">' + (n.code || '---') + '</div></div>';
    });
    html += '</div></div>';
    var area = document.getElementById('myNumsArea');
    if (area) area.innerHTML = html;
}

function showAnalysis() {
    page = 'analysis';
    document.getElementById('app').innerHTML = '<div class="header"><h1>' + dict[curLang].btnAnalysis + '</h1></div><button class="btn-sm" onclick="showMain()">' + dict[curLang].back + '</button><div id="content" style="margin-top:10px;">' + dict[curLang].loading + '</div>';
    fetch(PROXY + '/otp?count=200').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (!Array.isArray(list) || list.length === 0) {
            document.getElementById('content').innerHTML = '<div style="color:#f00;text-align:center;">' + dict[curLang].noCodes + '</div>';
            return;
        }
        var svcs = {};
        list.forEach(function(i) {
            var svc = i[0] || 'Unknown';
            if (!svcs[svc]) svcs[svc] = {};
            var ct = (i[4] || '').trim();
            if (ct) svcs[svc][ct] = (svcs[svc][ct] || 0) + 1;
        });
        var html = '';
        for (var svc in svcs) {
            var top = [];
            for (var k in svcs[svc]) top.push([k, svcs[svc][k]]);
            top.sort(function(a, b) { return b[1] - a[1]; });
            top = top.slice(0, 5);
            html += '<div style="margin-bottom:15px"><h3 style="color:#ff0">📱 ' + svc + '</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';
            for (var i = 0; i < top.length; i++) {
                html += '<div class="tag"><div class="flag">' + (flags[top[i][0]] || '🌍') + '</div><div class="name">' + getCountryName(top[i][0]) + '</div><div class="count">' + top[i][1] + '</div></div>';
            }
            html += '</div></div>';
        }
        document.getElementById('content').innerHTML = html;
    }).catch(function(e) {
        document.getElementById('content').innerHTML = '<div style="color:#f00;text-align:center;">' + dict[curLang].noCodes + '</div>';
    });
}

function showNumbers() {
    page = 'services';
    document.getElementById('app').innerHTML = '<div class="header"><h1>' + dict[curLang].btnNumbers + '</h1></div><button class="btn-sm" onclick="showMain()">' + dict[curLang].back + '</button><div id="content" style="margin-top:10px;">' + dict[curLang].loading + '</div>';
    fetch(PROXY + '/services').then(function(r) { return r.json(); }).then(function(d) {
        if (!d || !d.services) return;
        var html = '';
        d.services.forEach(function(s) {
            html += '<div class="tag" onclick="showCountries(\'' + s.key + '\',\'' + s.name + '\')"><div class="name">' + s.name + '</div><div class="count">' + s.count + '</div></div>';
        });
        document.getElementById('content').innerHTML = html;
    });
}

function showCountries(key, name) {
    document.getElementById('app').innerHTML = '<div class="header"><h1>🌍 ' + name + '</h1></div><button class="btn-sm" onclick="showNumbers()">' + dict[curLang].back + '</button><div id="content" style="margin-top:10px;">' + dict[curLang].loading + '</div>';
    fetch(PROXY + '/countries?service=' + key).then(function(r) { return r.json(); }).then(function(d) {
        if (!d || !d.countries) return;
        var html = '';
        d.countries.forEach(function(c) {
            html += '<div class="tag" onclick="showNums(\'' + c.name + '\',\'' + (c.flag || '') + '\',\'' + name + '\',\'' + key + '\')"><div class="flag">' + (c.flag || '🌍') + '</div><div class="name">' + getCountryName(c.name) + '</div><div class="count">' + c.count + '</div></div>';
        });
        document.getElementById('content').innerHTML = html;
    });
}

function showNums(country, flag, svcName, svcKey) {
    document.getElementById('app').innerHTML = '<div class="header"><h1>' + flag + ' ' + getCountryName(country) + '</h1></div><button class="btn-sm" onclick="showCountries(\'' + svcKey + '\',\'' + svcName + '\')">' + dict[curLang].back + '</button><div id="numsArea" style="margin-top:10px;">' + dict[curLang].fetchingNums + '</div>';
    var promises = [];
    for (var i = 0; i < 4; i++) {
        promises.push(fetch(PROXY + '/request_number', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ service: svcKey, country: country })
        }).then(function(r) { return r.json(); }));
    }
    Promise.all(promises).then(function(results) {
        myNums = [];
        var html = '<div class="grid2">';
        results.forEach(function(d) {
            if (d && d.number) {
                var obj = { num: d.number, flag: d.flag || flag, svc: svcName, country: country, code: '' };
                myNums.push(obj);
                html += '<div class="num-box" onclick="navigator.clipboard.writeText(\'' + d.number + '\')"><div class="flag">' + (d.flag || flag || '🌍') + '</div><div class="svc">' + svcName + '</div><div class="num">+' + d.number + '</div><div class="code" id="cd_' + d.number + '">---</div></div>';
            }
        });
        saveNums();
        html += '</div><div class="btn-row"><button class="btn-sm" onclick="showNums(\'' + country + '\',\'' + flag + '\',\'' + svcName + '\',\'' + svcKey + '\')">' + dict[curLang].changeBtn + '</button><button class="btn-sm" onclick="showCountries(\'' + svcKey + '\',\'' + svcName + '\')">' + dict[curLang].countryBtn + '</button><button class="btn-sm" onclick="showNumbers()">' + dict[curLang].serviceBtn + '</button></div><div class="btn-row"><button class="btn-sm" onclick="fetchCodes(\'' + country + '\')">' + dict[curLang].codesBtn + '</button></div>';
        document.getElementById('numsArea').innerHTML = html;
    });
}

function fetchCodes(country) {
    fetch(PROXY + '/otp?count=50').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (!Array.isArray(list) || list.length === 0) { alert(dict[curLang].noCodes); return; }
        var flt = list.filter(function(i) { return i[4] && i[4].trim() === country; });
        if (flt.length === 0) { alert(dict[curLang].noCodesCountry); return; }
        flt.forEach(function(i) {
            var code = extractCode(i[2] || '');
            var el = document.getElementById('cd_' + i[1]);
            if (el) el.textContent = code;
            myNums.forEach(function(n) { if (n.num === i[1]) { n.code = code; } });
        });
        saveNums();
    });
}

function cleanOldUsers() {
    db.ref("online").once("value").then(function(snap) {
        snap.forEach(function(s) {
            var d = s.val();
            if (d && Date.now() - d.time > 300000) { db.ref("online/" + s.key).remove(); }
        });
    });
}

function go() {
    fetch(PROXY + '/otp?count=20').then(function(r) { return r.json(); }).then(function(d) {
        var list = Array.isArray(d) ? d : (d.data || d.otp || []);
        if (Array.isArray(list)) {
            for (var idx = list.length - 1; idx >= 0; idx--) {
                var i = list[idx];
                if (!i || !i[1]) continue;
                var k = i[1] + '-' + i[2];
                if (!known[k]) {
                    known[k] = true;
                    if (!isFirstLoad) {
                        triggerCodeNotification(i[1], extractCode(i[2] || ''));
                    }
                    add(i);
                }
            }
            isFirstLoad = false;
        }
    }).catch(function(e){});
}

cleanOldUsers();
showMain();
go();

setInterval(go, 1000);
setInterval(cleanOldUsers, 10000);
</script>
