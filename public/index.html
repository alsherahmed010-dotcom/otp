<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Live - Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e1621;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .telegram-container {
            width: 100%;
            max-width: 450px;
            background-color: #17212b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0e1621;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Header */
        .tg-header {
            background-color: #242f3d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #111822;
            min-height: 56px;
        }

        .tg-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tg-back-arrow {
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .tg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2b5278;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .tg-title-info h2 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .tg-title-info p {
            font-size: 12px;
            color: #7d8b99;
        }

        /* Main List */
        .main-list {
            flex: 1;
            overflow-y: auto;
            background-color: #0e1621;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        .chat-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .chat-row:active { background-color: rgba(255,255,255,0.05); }
        .chat-row .tg-avatar { width: 48px; height: 48px; font-size: 20px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .chat-row .preview { font-size: 13px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #0e1621;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        .msg-block {
            background-color: #182533;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #ffffff;
        }

        .msg-user { color: #64b5f6; font-weight: 600; }
        .num { color: #60a5fa; font-weight: 600; font-size: 16px; cursor: pointer; }
        .code { background-color: #f59e0b; color: #000; padding: 3px 10px; border-radius: 5px; font-weight: 700; display: inline-block; margin: 4px 0; font-size: 16px; cursor: pointer; }
        .time-tag { font-size: 11px; color: #7d8b99; text-align: left; margin-top: 4px; }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            text-align: center;
            background-color: #2b5278;
            width: 100%;
            margin-bottom: 6px;
        }

        .btn:active { opacity: 0.7; transform: scale(0.98); }
        .btn-green { background-color: #2e8b57; }
        .btn-gold { background-color: #f59e0b; color: #000; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; margin-bottom: 0; }

        .number-item-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .number-item-row .btn {
            margin-bottom: 0;
            flex: 2;
            font-size: 14px;
        }
        .number-item-row .btn-fetch {
            flex: 1;
            background-color: #2675d3;
            font-size: 13px;
        }

        .btn-area {
            padding: 10px;
            border-top: 1px solid #111822;
            background-color: #17212b;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 52vh; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Chat Input Bar */
        .chat-input-bar {
            display: flex;
            padding: 8px 10px;
            background-color: #17212b;
            border-top: 1px solid #111822;
            gap: 8px;
            align-items: center;
        }

        .chat-input-bar input {
            flex: 1;
            background-color: #0e1621;
            border: 1px solid #2b5278;
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .chat-input-bar button {
            background-color: #5288c1;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Toast */
        #toast {
            visibility: hidden;
            min-width: 150px;
            background-color: #f59e0b;
            color: #000;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 99;
            left: 50%;
            bottom: 70px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: opacity 0.15s;
            opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }

        /* Bottom Nav */
        .bottom-nav { background-color: #17212b; display: flex; justify-content: space-around; padding: 6px 0; border-top: 1px solid #111822; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 12px; font-weight: 500; cursor: pointer; gap: 3px; background: none; border: none; flex: 1; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 20px; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="telegram-container" id="app">
        <div id="toast">تم النسخ!</div>
    </div>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db = firebase.database();
        const BASE_URL = 'https://numberpanel.tech';
        const API_KEY = 'np_live_6DknI4df2uZ0_BFv6CGGpX_BCBAq60TG1sKev64WPkw';
        
        let S = JSON.parse(localStorage.getItem('otp_session_v17') || '{}');
        let cur = S.cur || 'main', cSvc = S.cSvc || '', cCty = S.cCty || '', viewMode = S.viewMode || 'services';
        let known = new Set(), otpTimer = null;

        function save() { 
            localStorage.setItem('otp_session_v17', JSON.stringify({cur, cSvc, cCty, viewMode})); 
        }

        function el(id) { return document.getElementById(id); }

        function showToast(msg) {
            let t = el('toast');
            if(!t) {
                t = document.createElement('div');
                t.id = 'toast';
                document.querySelector('.telegram-container').appendChild(t);
            }
            t.innerText = msg || "تم النسخ!";
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 1200);
        }

        function render() {
            requestAnimationFrame(() => {
                const app = el('app');
                let toastHTML = '<div id="toast">تم النسخ!</div>';

                if (cur === 'main') {
                    app.innerHTML = toastHTML + `
                        <div class="screen">
                            <div class="tg-header">
                                <div class="tg-header-left">
                                    <div class="tg-avatar">✈️</div>
                                    <div class="tg-title-info"><h2>Telegram</h2><p>Number Panel Live</p></div>
                                </div>
                            </div>
                            <div class="main-list">
                                <div class="chat-row" onclick="openChat('bot')">
                                    <div class="tg-avatar" style="background:#2b5278;">🤖</div>
                                    <div class="info">
                                        <div class="name">🤖 NUMBER BOT</div>
                                        <div class="preview">بوت جلب الخدمات والدول والأرقام من المنصة مباشرة</div>
                                    </div>
                                </div>
                                <div class="chat-row" onclick="openChat('group')">
                                    <div class="tg-avatar" style="background:#2e8b57;">👥</div>
                                    <div class="info">
                                        <div class="name">👥 ALL TECH OTP</div>
                                        <div class="preview">بث مباشر ومراسلة جماعية لأكواد التفعيل</div>
                                    </div>
                                </div>
                            </div>
                            <div class="bottom-nav">
                                <button class="nav-item active" onclick="openChat('bot'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                            </div>
                        </div>`;
                } else {
                    app.innerHTML = toastHTML + `
                        <div class="screen">
                            <div class="tg-header">
                                <div class="tg-header-left">
                                    <div class="tg-back-arrow" onclick="goHomeDirect()">←</div>
                                    <div class="tg-avatar">${cur === 'bot' ? '🤖' : '👥'}</div>
                                    <div class="tg-title-info">
                                        <h2>${cur === 'bot' ? '🤖 NUMBER BOT' : '👥 ALL TECH OTP'}</h2>
                                        <p>${cur === 'bot' ? 'متصل الآن' : '٨٣٤٣ عضواً، ١٥٣١ متصلاً'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="chat-body" id="messages"></div>
                            ${cur === 'bot' ? '<div class="btn-area" id="btnArea"></div>' : `
                                <div class="chat-input-bar">
                                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendGroupMsg()">
                                    <button onclick="sendGroupMsg()">📤</button>
                                </div>
                            `}
                            <div class="bottom-nav">
                                <button class="nav-item active" onclick="openChat('bot'); loadServices();"><span class="nav-icon">💬</span>محادثات</button>
                            </div>
                        </div>`;
                }
                bindEvents();
            });
        }

        function bindEvents() {
            if (cur === 'bot') {
                if (cCty) selectCountry(cCty);
                else if (cSvc) loadCountries(cSvc);
                else loadServices();
            } else if (cur === 'group') {
                el('messages').innerHTML = '<div class="msg-block">📡 نظام البث المباشر لأكواد التفعيل.</div>';
                db.ref('messages').off();
                db.ref('messages').limitToLast(20).on('child_added', s => { if (cur === 'group') showGroupMessage(s.val()); });
                if (otpTimer) clearInterval(otpTimer);
                otpTimer = setInterval(fetchOTP, 3000);
                fetchOTP();
            }
        }

        function goHomeDirect() {
            cur = 'main';
            viewMode = 'services';
            cSvc = ''; cCty = '';
            save();
            if (otpTimer) clearInterval(otpTimer);
            render();
        }

        function openChat(t) { 
            cur = t; 
            save(); 
            render(); 
        }
        
        function showGroupMessage(m) {
            if (cur !== 'group') return;
            const t = new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});
            if (m.type === 'otp') {
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">Alexender (المشرف)</span><br>
                        🌐 الخدمة: <b>${m.service || 'OTP'}</b><br>
                        📱 الرقم: <span class="num" onclick="copyText('${m.number}')">${m.number || ''}</span><br>
                        🔑 الكود: <span class="code" onclick="copyText('${m.code}')">${m.code}</span>
                        <div class="time-tag">${t}</div>
                    </div>`;
            } else if (m.type === 'chat') {
                el('messages').innerHTML += `
                    <div class="msg-block">
                        <span class="msg-user">${m.user || 'عضو'}</span><br>
                        ${m.text}
                        <div class="time-tag">${t}</div>
                    </div>`;
            }
            el('messages').scrollTop = el('messages').scrollHeight;
        }

        function sendGroupMsg() {
            const input = el('chatInput');
            if(!input || !input.value.trim()) return;
            db.ref('messages').push({ type: 'chat', user: 'مستخدم (أنت)', text: input.value.trim() });
            input.value = '';
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            showToast('تم النسخ: ' + txt);
        }

        async function fetchOTP() {
            try {
                const res = await fetch(BASE_URL + '/api/otp?count=10', { headers: { 'Authorization': 'Bearer ' + API_KEY } });
                const d = await res.json();
                if (Array.isArray(d)) {
                    d.forEach(i => {
                        const k = i[1] + '-' + i[2];
                        if (!known.has(k)) {
                            known.add(k);
                            db.ref('messages').push({
                                type: 'otp', service: i[0], number: i[1],
                                code: i[2].match(/\d{4,8}/)?.[0] || i[2]
                            });
                        }
                    });
                }
            } catch (e) {}
        }

        async function fetchSingleCode(num) {
            showToast('جاري فحص الكود...');
            try {
                const res = await fetch(BASE_URL + '/api/latest_otp?number=' + encodeURIComponent(num), { headers: { 'Authorization': 'Bearer ' + API_KEY } });
                const data = await res.json();
                if (data && (data.success || data.النجاح) && (data.has_otp || data.رمز_التحقق_من_كلمة_المرور)) {
                    let code = data.otp_code || data.verification_code || data.رمز_التحقق_من_كلمة_المرور || '---';
                    el('messages').innerHTML += `
                        <div class="msg-block">
                            📱 الرقم: <span class="num" onclick="copyText('${num}')">${num}</span><br>
                            🔑 الكود: <span class="code" onclick="copyText('${code}')">${code}</span>
                        </div>`;
                    el('messages').scrollTop = el('messages').scrollHeight;
                    showToast('تم العثور على الكود!');
                } else {
                    showToast('لا يوجد كود جديد حالياً');
                }
            } catch(err) { showToast('خطأ أثناء فحص الكود'); }
        }

        function loadServices() {
            viewMode = 'services'; cur = 'bot'; cSvc = ''; cCty = ''; save(); render();
            el('messages').innerHTML = '<div class="msg-block">👋 أهلاً بك! جاري جلب الخدمات المتاحة من السيرفر...</div>';
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري التحميل...</div>';

            fetch(BASE_URL + '/api/services', { headers: { 'Authorization': 'Bearer ' + API_KEY } })
                .then(r => r.json())
                .then(res => {
                    let list = [];
                    if (res && (res.services || res.الخدمات)) {
                        let raw = res.services || res.الخدمات;
                        list = raw.map(s => typeof s === 'string' ? s : (s.name || s.الاسم)).filter(Boolean);
                    } else if (Array.isArray(res)) {
                        list = res.map(s => typeof s === 'string' ? s : (s.name || s.الاسم)).filter(Boolean);
                    }

                    if (list.length > 0) {
                        el('messages').innerHTML = '<div class="msg-block">👋 اختر الخدمة المطلوبة من القائمة أدناه:</div>';
                        let btns = '';
                        list.forEach(name => {
                            btns += `<button class="btn" onclick="loadCountries('${name}')">${name}</button>`;
                        });
                        el('btnArea').innerHTML = btns;
                    } else {
                        el('messages').innerHTML = '<div class="msg-block">⚠️ لم يتم العثور على خدمات متاحة حالياً من الـ API.</div>';
                        el('btnArea').innerHTML = '';
                    }
                })
                .catch(e => {
                    el('messages').innerHTML = '<div class="msg-block">❌ حدث خطأ أثناء الاتصال بالـ API لجلب الخدمات.</div>';
                    el('btnArea').innerHTML = '';
                });
        }

        function loadCountries(serviceName) {
            cSvc = serviceName; cCty = ''; viewMode = 'countries'; save();
            el('messages').innerHTML = `<div class="msg-block">🌐 الخدمة: <b>${serviceName}</b>.<br>جاري جلب الدول المتاحة لهذه الخدمة...</div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري التحميل...</div>';

            fetch(BASE_URL + '/api/countries?service=' + encodeURIComponent(serviceName), { headers: { 'Authorization': 'Bearer ' + API_KEY } })
                .then(r => r.json())
                .then(res => {
                    let list = [];
                    if (res && (res.countries || res.بلدان)) {
                        let raw = res.countries || res.بلدان;
                        list = raw.map(c => typeof c === 'string' ? c : (c.name || c.الاسم)).filter(Boolean);
                    } else if (Array.isArray(res)) {
                        list = res.map(c => typeof c === 'string' ? c : (c.name || c.الاسم)).filter(Boolean);
                    }

                    if (list.length > 0) {
                        el('messages').innerHTML = `<div class="msg-block">🌐 الخدمة: <b>${serviceName}</b>.<br>اختر الدولة المطلوبة:</div>`;
                        let btns = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div><hr style="border-color:#242f3d; margin:5px 0;">`;
                        list.forEach(c => {
                            btns += `<button class="btn" onclick="selectCountry('${c}')">🌍 ${c}</button>`;
                        });
                        el('btnArea').innerHTML = btns;
                    } else {
                        el('messages').innerHTML = `<div class="msg-block">⚠️ لا توجد دول متاحة حالياً لهذه الخدمة.</div>`;
                        el('btnArea').innerHTML = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div>`;
                    }
                })
                .catch(e => {
                    el('messages').innerHTML = `<div class="msg-block">❌ حدث خطأ أثناء جلب الدول.</div>`;
                    el('btnArea').innerHTML = `<div class="btn-row"><button class="btn" onclick="loadServices()">🔙 الخدمات</button></div>`;
                });
        }

        async function selectCountry(country) {
            cCty = country; viewMode = 'numbers'; save();
            el('messages').innerHTML = `
                <div class="msg-block">
                    🌐 الخدمة: <b>${cSvc}</b><br>
                    🌍 الدولة: <b>${country}</b><br>
                    📱 جاري طلب رقم جديد من السيرفر...
                </div>`;
            el('btnArea').innerHTML = '<div style="text-align:center;color:#7d8b99;padding:10px;">جاري توليد الرقم...</div>';

            try {
                const res = await fetch(BASE_URL + '/api/request_number', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service: cSvc, country: country })
                });
                const data = await res.json();
                
                let num = '';
                if (data && (data.number || data.الرقم)) {
                    num = data.number || data.الرقم;
                }

                if (num) {
                    let btns = `<div class="btn-row">
                                    <button class="btn" onclick="loadCountries('${cSvc}')">🔙 الدول</button>
                                    <button class="btn btn-gold" onclick="selectCountry('${country}')">🔄 طلب رقم جديد</button>
                                </div><hr style="border-color:#242f3d; margin:5px 0;">`;

                    btns += `
                        <div class="number-item-row">
                            <button class="btn btn-green" onclick="copyText('${num}')">📱 ${num}</button>
                            <button class="btn btn-fetch" onclick="fetchSingleCode('${num}')">🔍 جلب الكود</button>
                        </div>`;
                    
                    el('btnArea').innerHTML = btns;
                    el('messages').innerHTML = `
                        <div class="msg-block">
                            🌐 الخدمة: <b>${cSvc}</b><br>
                            🌍 الدولة: <b>${country}</b><br>
                            ✅ تم الحصول على الرقم بنجاح:
                        </div>`;
                } else {
                    let errText = data.message || data.خطأ || 'فشل توليد الرقم من السيرفر';
                    el('messages').innerHTML = `
                        <div class="msg-block">
                            ❌ ${errText}
                        </div>`;
                    el('btnArea').innerHTML = `<div class="btn-row"><button class="btn" onclick="loadCountries('${cSvc}')">🔙 الدول</button></div>`;
                }
            } catch (e) {
                el('messages').innerHTML = `<div class="msg-block">❌ خطأ في الاتصال بالشبكة أثناء طلب الرقم.</div>`;
                el('btnArea').innerHTML = `<div class="btn-row"><button class="btn" onclick="loadCountries('${cSvc}')">🔙 الدول</button></div>`;
            }
        }

        window.onload = () => { render(); };
    </script>
</body>
</html>
