<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP LIVE</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root{--bg:#0a0a0a;--green:#0f0;--gold:#ff0;--red:#f00;--cyan:#0ff}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
        body{background:#000;color:var(--green);min-height:100vh}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
        @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
        .app{max-width:550px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
        .header{text-align:center;padding:20px 0;border-bottom:2px solid var(--green);margin-bottom:15px;animation:glow 2s infinite}
        @keyframes glow{0%,100%{text-shadow:0 0 10px var(--green)}50%{text-shadow:0 0 30px var(--green)}}
        .header h1{font-size:28px;letter-spacing:3px}
        .list{display:flex;flex-direction:column;gap:8px}
        .card{background:#0f0f0f;border:1px solid #1a3a1a;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fadeIn 0.3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .card .flag{font-size:30px;min-width:40px;text-align:center}
        .card .info{flex:1;min-width:120px}
        .card .num{color:#fff;font-weight:bold;font-size:20px;direction:ltr}
        .card .meta{color:var(--cyan);font-size:10px}
        .card .code{font-size:28px;font-weight:bold;color:var(--gold);letter-spacing:3px;direction:ltr;text-shadow:0 0 10px var(--gold);animation:glitch 2s infinite}
        @keyframes glitch{0%,100%{text-shadow:0 0 10px var(--gold)}50%{text-shadow:0 0 20px var(--gold),2px 0 var(--red)}}
        .card .btns{display:flex;gap:6px;min-width:90px}
        .btn{border:1px solid var(--green);background:transparent;color:var(--green);padding:6px 10px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:bold;font-family:'Courier New',monospace;flex:1;text-align:center}
        .btn:hover{background:var(--green);color:#000}
        .btn.gold{border-color:var(--gold);color:var(--gold)}
        .btn.gold:hover{background:var(--gold);color:#000}
        .stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
        @media(max-width:400px){.card{flex-wrap:wrap}.card .btns{width:100%}}
    </style>
</head>
<body>
    <div class="app">
        <div class="header"><h1>⬢ OTP LIVE</h1></div>
        <div class="list" id="list"></div>
        <div class="stats" id="stats"></div>
    </div>
    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
        let known=new Set(),count=0;
        const flags={MZ:'🇲🇿',TG:'🇹🇬',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',UA:'🇺🇦',QA:'🇶🇦',TJ:'🇹🇯',HT:'🇭🇹',ID:'🇮🇩'};
        const cNames={MZ:'موزمبيق',TG:'توجو',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',UA:'أوكرانيا',QA:'قطر',TJ:'طاجيكستان',HT:'هايتي',ID:'إندونيسيا'};
        function getFlag(c){return flags[c]||'🌍';}
        function getCName(c){return cNames[c]||c;}
        function copyText(t){navigator.clipboard.writeText(t);}
        
        function addCard(i){
            const code=i[2].match(/\d{4,8}/)?.[0]||i[2];
            const country=i[4]||'';
            document.getElementById('list').innerHTML=`
                <div class="card">
                    <span class="flag">${getFlag(country)}</span>
                    <div class="info">
                        <div class="meta">${i[0]} · ${getCName(country)}</div>
                        <div class="num">+${i[1]}</div>
                        <div class="code">${code}</div>
                    </div>
                    <div class="btns">
                        <button class="btn" onclick="copyText('${i[1]}')">📋</button>
                        <button class="btn gold" onclick="copyText('${code}')">🔑</button>
                    </div>
                </div>
            `+document.getElementById('list').innerHTML;
            count++;
            document.getElementById('stats').textContent='⬢ '+count+' Packets';
        }
        
        async function fetchOTP(){
            try{
                const d=await fetch(PROXY+'/api/otp?count=10').then(r=>r.json());
                if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);addCard(i);}});
            }catch(e){}
        }
        
        setInterval(fetchOTP,2000);
        fetchOTP();
    </script>
</body>
</html>
