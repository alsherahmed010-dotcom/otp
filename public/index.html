<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OTP HUB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
body{background:#000;color:#0f0;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
.header{text-align:center;padding:20px 0;border-bottom:2px solid #0f0;margin-bottom:10px}
.header h1{font-size:26px;letter-spacing:3px;text-shadow:0 0 10px #0f0}
.top-bar{display:flex;gap:8px;margin-bottom:15px}
.search-box{flex:1;background:#0a0a0a;border:1px solid #1a3a1a;color:#0f0;padding:12px;font-size:14px;font-family:'Courier New',monospace;border-radius:8px;outline:none}
.search-box:focus{border-color:#0f0}
.btn-sm{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:12px 14px;font-size:13px;font-family:'Courier New',monospace;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:bold}
.btn-sm:hover{background:#0f0;color:#000}
.card{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;animation:in 0.2s}
.card:hover{border-color:#0f0}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card .flag{font-size:32px;min-width:45px;text-align:center}
.card .info{flex:1}
.card .phone{color:#fff;font-weight:bold;font-size:16px;direction:ltr}
.card .code{font-size:30px;font-weight:bold;color:#ff0;letter-spacing:3px;direction:ltr;text-shadow:0 0 10px #ff0}
.card .prefix{color:#0ff;font-size:11px}
.stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
.back-btn{background:#0a0a0a;border:1px solid #0f0;color:#0f0;padding:8px 16px;font-size:13px;font-family:'Courier New',monospace;border-radius:8px;cursor:pointer;margin-bottom:15px;display:inline-block}
.back-btn:hover{background:#0f0;color:#000}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.num-box{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.num-box:hover{border-color:#0f0}
.num-box .flag{font-size:28px}
.num-box .svc{color:#f00;font-size:10px}
.num-box .num{color:#fff;font-weight:bold;font-size:18px;direction:ltr}
.num-box .code{background:#000;border:1px solid #ff0;color:#ff0;padding:4px 10px;border-radius:4px;font-weight:bold;font-size:16px;direction:ltr;display:inline-block;margin-top:6px}
.tag{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-size:14px;display:inline-block;margin:4px}
.tag:hover{border-color:#0f0}
.tag .name{color:#fff;font-weight:bold}
.tag .count{color:#ff0;font-size:12px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn-sm{flex:1}
</style></head>
<body>
<div class="app" id="app"></div>
<script>
var PROXY='https://ai-proxy-eosin.vercel.app/api/panel';
var known={},c=0,allCards=[],page='main';
var myNums=JSON.parse(localStorage.getItem('myNumbers')||'[]');
var savedSvc=localStorage.getItem('savedSvc')||'';
var savedCty=localStorage.getItem('savedCty')||'';
var flags={TG:'🇹🇬',LB:'🇱🇧',UA:'🇺🇦',AM:'🇦🇲',MZ:'🇲🇿',ZW:'🇿🇼',LY:'🇱🇾',BF:'🇧🇫',ID:'🇮🇩'};
var cNames={TG:'توجو',LB:'لبنان',UA:'أوكرانيا',AM:'أرمينيا',MZ:'موزمبيق',ZW:'زيمبابوي',LY:'ليبيا',BF:'بوركينا فاسو',ID:'إندونيسيا'};

function saveNums(){localStorage.setItem('myNumbers',JSON.stringify(myNums));}
function extractCode(txt){var m=txt.match(/\d{3,8}[-.\s]?\d{3,8}/);if(m)return m[0];m=txt.match(/\d{4,8}/);return m?m[0]:txt.substring(0,15);}

function add(i){
    var code=extractCode(i[2]||'');var ct=(i[4]||'').trim();var flag=flags[ct]||'🌍';var prefix=i[1]?i[1].substring(0,7):'';
    allCards.unshift({html:'<div class="card" onclick="navigator.clipboard.writeText(\''+code+'\')"><span class="flag">'+flag+'</span><div class="info"><div class="phone">📱 +'+i[1]+'</div><div class="prefix">🆔 Prefix: '+prefix+'</div><div class="code">'+code+'</div></div></div>',search:i[1]+' '+code});
    if(page==='main'){renderCards();}
    c++;var s=document.getElementById('stats');if(s)s.textContent='⬢ '+c+' codes';
}

function renderCards(){
    var q=(document.getElementById('search')?document.getElementById('search').value:'').toLowerCase();
    var html='';for(var i=0;i<allCards.length;i++){if(!q||allCards[i].search.toLowerCase().indexOf(q)>=0)html+=allCards[i].html;}
    var cards=document.getElementById('cards');if(cards)cards.innerHTML=html;
}
function filter(){renderCards();}

function showMain(){
    page='main';
    document.getElementById('app').innerHTML='<div class="header"><h1>⬢ OTP LIVE</h1></div><div class="top-bar"><input type="text" class="search-box" id="search" placeholder="🔍 بحث برقم أو كود..." onkeyup="filter()"><button class="btn-sm" onclick="showNumbers()">📱 أرقام</button><button class="btn-sm" onclick="showAnalysis()">🏆 تحليل</button></div><div id="cards"></div><div class="stats" id="stats">⬢ '+c+' codes</div>';
    renderCards();
}

function showAnalysis(){
    page='analysis';
    document.getElementById('app').innerHTML='<div class="header"><h1>🏆 تحليل</h1></div><button class="back-btn" onclick="showMain()">← رجوع</button><div id="content">⏳ جاري التحميل...</div>';
    fetch(PROXY+'/api/otp?count=200').then(function(r){return r.json();}).then(function(d){
        if(!Array.isArray(d))return;
        var svcs={};d.forEach(function(i){var svc=i[0];if(!svcs[svc])svcs[svc]={};var ct=(i[4]||'').trim();if(ct)svcs[svc][ct]=(svcs[svc][ct]||0)+1;});
        var html='';for(var svc in svcs){var top=[];for(var k in svcs[svc])top.push([k,svcs[svc][k]]);top.sort(function(a,b){return b[1]-a[1];});top=top.slice(0,5);
            html+='<div style="margin-bottom:15px"><h3 style="color:#ff0">📱 '+svc+'</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';
            for(var i=0;i<top.length;i++){html+='<div class="tag"><div style="font-size:24px">'+(flags[top[i][0]]||'🌍')+'</div><div class="name">'+(cNames[top[i][0]]||top[i][0])+'</div><div class="count">'+top[i][1]+'</div></div>';}
            html+='</div></div>';}
        document.getElementById('content').innerHTML=html;
    });
}

// صفحة الأرقام - خدمات ← دول ← 4 أرقام
function showNumbers(){
    page='services';
    document.getElementById('app').innerHTML='<div class="header"><h1>📱 الأرقام</h1></div><button class="back-btn" onclick="showMain()">← رجوع</button><div id="content">⏳ جاري التحميل...</div>';
    fetch(PROXY+'/api/services').then(function(r){return r.json();}).then(function(d){
        if(!d.success)return;
        var html='';d.services.forEach(function(s){html+='<div class="tag" onclick="showCountries(\''+s.key+'\',\''+s.name+'\')"><div class="name">'+s.name+'</div><div class="count">'+s.count+'</div></div>';});
        document.getElementById('content').innerHTML=html;
    });
}

function showCountries(key,name){
    localStorage.setItem('savedSvc',key);
    document.getElementById('app').innerHTML='<div class="header"><h1>🌍 '+name+'</h1></div><button class="back-btn" onclick="showNumbers()">← خدمات</button><div id="content">⏳ جاري التحميل...</div>';
    fetch(PROXY+'/api/countries?service='+key).then(function(r){return r.json();}).then(function(d){
        if(!d.success)return;
        var html='';d.countries.forEach(function(c){html+='<div class="tag" onclick="showCountryNums(\''+c.name+'\',\''+(c.flag||'')+'\',\''+name+'\')"><div style="font-size:24px">'+(c.flag||'🌍')+'</div><div class="name">'+(cNames[c.name]||c.name)+'</div><div class="count">'+c.count+'</div></div>';});
        document.getElementById('content').innerHTML=html;
    });
}

function showCountryNums(country,flag,svc){
    localStorage.setItem('savedCty',country);
    document.getElementById('app').innerHTML='<div class="header"><h1>'+flag+' '+(cNames[country]||country)+'</h1></div><button class="back-btn" onclick="showCountries(\''+svc+'\',\''+svc+'\')">← دول</button><div id="content">⏳ جاري جلب الأرقام...</div><div id="codes"></div>';
    fetchNums(country,svc);
}

function fetchNums(country,svc){
    var promises=[];
    for(var i=0;i<4;i++){
        promises.push(fetch(PROXY+'/api/request_number',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:svc,country:country})}).then(function(r){return r.json();}));
    }
    Promise.all(promises).then(function(results){
        var newNums=[];
        var html='<div class="grid4">';
        results.forEach(function(d){
            if(d.success&&d.number){
                newNums.push({num:d.number,country:country,flag:d.flag||flag,svc:svc,code:''});
                html+='<div class="num-box" onclick="navigator.clipboard.writeText(\''+d.number+'\')"><div class="flag">'+(d.flag||flag||'🌍')+'</div><div class="svc">'+svc+'</div><div class="num">+'+d.number+'</div><div class="code" id="code_'+d.number+'">---</div></div>';
            }
        });
        html+='</div>';
        html+='<div class="btn-row"><button class="btn-sm" onclick="showCountryNums(\''+country+'\',\''+flag+'\',\''+svc+'\')">🔄 تغيير</button><button class="btn-sm" onclick="fetchCodes(\''+country+'\')">📩 جلب الأكواد</button></div>';
        document.getElementById('content').innerHTML=html;
        // حفظ الأرقام
        newNums.forEach(function(n){myNums.push(n);});
        saveNums();
    });
}

function fetchCodes(country){
    fetch(PROXY+'/api/otp?count=50').then(function(r){return r.json();}).then(function(d){
        if(!Array.isArray(d))return;
        var flt=d.filter(function(i){return i[4]&&i[4].trim()===country;});
        flt.forEach(function(i){
            var code=extractCode(i[2]||'');
            var el=document.getElementById('code_'+i[1]);
            if(el)el.textContent=code;
        });
    });
}

// تحميل الأرقام المحفوظة
if(savedSvc&&savedCty){page='numbers';}

function go(){
    fetch(PROXY+'/api/otp?count=10').then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){d.forEach(function(i){var k=i[1]+'-'+i[2];if(!known[k]){known[k]=true;add(i);}});}});
}

showMain();go();setInterval(go,2000);
</script>
</body>
</html>
