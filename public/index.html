<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OTP LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace}
body{background:#000;color:#0f0;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.03) 2px,rgba(0,255,0,0.03) 4px);pointer-events:none;animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:15px}
.header{text-align:center;padding:20px 0;border-bottom:2px solid #0f0;margin-bottom:15px}
.header h1{font-size:26px;letter-spacing:3px;text-shadow:0 0 10px #0f0}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;animation:in 0.2s}
.card:hover{border-color:#0f0}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card .flag{font-size:32px;min-width:45px;text-align:center}
.card .info{flex:1}
.card .phone{color:#fff;font-weight:bold;font-size:16px;direction:ltr}
.card .prefix{color:#0ff;font-size:11px}
.card .code{font-size:30px;font-weight:bold;color:#ff0;letter-spacing:3px;direction:ltr;text-shadow:0 0 10px #ff0}
.stats{text-align:center;color:#0a0;font-size:11px;padding:10px}
</style></head>
<body>
<div class="app"><div class="header"><h1>⬢ OTP LIVE</h1></div><div class="list" id="list"></div><div class="stats" id="stats">⬢ 0 codes</div></div>

var known={},c=0;

CY:'🇨🇾',CZ:'🇨🇿',DK:'🇩🇰',DJ:'🇩🇯',DM:'🇩🇲',DO:'🇩🇴',EC:'🇪🇨',EG:'🇪🇬',SV:'🇸🇻',GQ:'🇬🇶',
ER:'🇪🇷',EE:'🇪🇪',SZ:'🇸🇿',ET:'🇪🇹',FJ:'🇫🇯',FI:'🇫🇮',FR:'🇫🇷',GA:'🇬🇦',GM:'🇬🇲',GE:'🇬🇪',

HK:'🇭🇰',HU:'🇭🇺',IS:'🇮🇸',IN:'🇮🇳',ID:'🇮🇩',IR:'🇮🇷',IQ:'🇮🇶',IE:'🇮🇪',IL:'🇮🇱',IT:'🇮🇹',
JM:'🇯🇲',JP:'🇯🇵',JO:'🇯🇴',KZ:'🇰🇿',KE:'🇰🇪',KI:'🇰🇮',KP:'🇰🇵',KR:'🇰🇷',KW:'🇰🇼',KG:'🇰🇬',
LA:'🇱🇦',LV:'🇱🇻',LB:'🇱🇧',LS:'🇱🇸',LR:'🇱🇷',LY:'🇱🇾',LI:'🇱🇮',LT:'🇱🇹',LU:'🇱🇺',MG:'🇲🇬',

function extractCode(txt){
    var m=txt.match(/\d{3,8}[-.\s]?\d{3,8}/);
    if(m)return m[0];
    m=txt.match(/\d{4,8}/);
    return m?m[0]:txt.substring(0,15);
}

function add(i){
    var code=extractCode(i[2]||'');
    var ct=(i[4]||'').trim();
    var flag=flags[ct]||'🌍';
    var prefix=i[1]?i[1].substring(0,7):'';
    
    var div=document.createElement('div');
    div.className='card';
    div.onclick=function(){navigator.clipboard.writeText(code);};
    div.innerHTML='<span class="flag">'+flag+'</span><div class="info"><div class="phone">📱 +'+i[1]+'</div><div class="prefix">🆔 Prefix: '+prefix+'</div><div class="code">'+code+'</div></div>';
    
    var list=document.getElementById('list');
    if(list.firstChild){list.insertBefore(div,list.firstChild);}
    else{list.appendChild(div);}
    c++;
    document.getElementById('stats').textContent='⬢ '+c+' codes';
}

function go(){
    fetch(PROXY+'/api/otp?count=10')
    .then(function(r){return r.json();})
    .then(function(d){
        if(Array.isArray(d)){
            d.forEach(function(i){
                var k=i[1]+'-'+i[2];
                if(!known[k]){
                    known[k]=true;
                    add(i);
                }
            });
        }
    })
    .catch(function(e){console.log(e);});
}

go();
setInterval(go,2000);
</script>
