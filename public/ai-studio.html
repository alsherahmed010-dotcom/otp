<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NEXUS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#111;--border:#1a3a1a;--green:#0f0;--gold:#ff0;--blue:#4285f4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#000;color:var(--green);height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.water-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.wave{position:absolute;bottom:0;left:-50%;width:200%;height:200px;background:linear-gradient(180deg,transparent,#0066ff11,#0044ff22);border-radius:50%;animation:wave 8s linear infinite}
.wave:nth-child(2){animation-delay:2s;opacity:.7}
.wave:nth-child(3){animation-delay:4s;opacity:.5}
.wave:nth-child(4){animation-delay:6s;opacity:.3}
@keyframes wave{0%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(25%) rotate(2deg)}100%{transform:translateX(50%) rotate(0deg)}}
.bubble{position:absolute;bottom:-50px;background:rgba(0,100,255,.1);border-radius:50%;animation:rise 6s infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.6}100%{transform:translateY(-100vh) scale(1.5);opacity:0}}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(10,10,10,.9);z-index:10;flex-shrink:0}
.header h1{font-size:18px;text-shadow:0 0 10px var(--green)}
.model-select{background:#111;border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;font-family:'Cairo',sans-serif}
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;z-index:5}
.msg{max-width:80%;padding:12px 16px;border-radius:15px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap;z-index:5}
.user-msg{align-self:flex-end;background:rgba(0,40,0,.9);border:1px solid var(--green);border-bottom-left-radius:4px}
.ai-msg{align-self:flex-start;background:rgba(10,10,10,.9);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg img{max-width:100%;border-radius:10px;margin:5px 0;display:block}
.msg video{max-width:100%;border-radius:10px;margin:5px 0}
.input-area{padding:15px 20px;border-top:1px solid var(--border);background:rgba(10,10,10,.9);z-index:10;flex-shrink:0}
.input-box{display:flex;align-items:center;gap:10px;background:rgba(20,20,20,.9);border-radius:25px;padding:5px 15px;border:1px solid var(--border)}
.input-box input{flex:1;background:none;border:none;color:#fff;padding:12px;font-size:14px;outline:none;font-family:'Cairo',sans-serif}
.send-btn{background:var(--green);color:#000;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0}
.plus-btn{background:none;border:none;color:var(--green);font-size:22px;cursor:pointer;flex-shrink:0}
.preview-box{display:none;align-items:center;gap:10px;background:rgba(20,20,20,.9);border-radius:10px;padding:8px 12px;margin-bottom:10px;z-index:10}
.preview-box img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.preview-box span{flex:1;color:#888;font-size:12px}
.preview-box .remove{color:var(--green);cursor:pointer;font-size:18px}
.loading-dots{display:inline-flex;gap:4px}
.loading-dots span{width:6px;height:6px;background:var(--green);border-radius:50%;animation:b 1.4s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.code-block{background:#000;color:#34d399;padding:12px;border-radius:8px;font-family:monospace;direction:ltr;text-align:left;margin-top:8px;white-space:pre-wrap;position:relative}
.copy-btn{position:absolute;top:5px;right:5px;background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--green);border-radius:2px}
</style>
</head>
<body>
<div class="water-bg">
<div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>
</div>
<div class="header"><h1>⬢ NEXUS AI</h1><select class="model-select" id="model-select" onchange="changeModel()"></select></div>
<div class="chat-area" id="chat-area"><div id="welcome" style="text-align:center;margin-top:35%;font-size:18px;color:#888;">✦<br><br>اسألني أي شيء...</div></div>
<div class="input-area">
<div class="preview-box" id="preview-box"><img id="preview-img" src=""><span id="preview-name">صورة</span><span class="remove" onclick="removeImage()">✕</span></div>
<div class="input-box">
<button class="plus-btn" onclick="document.getElementById('file-input').click()">+</button>
<input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(event)">
<input type="text" id="user-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendMessage()">
<button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
</div>
</div>
<script>
const NEXII_KEY='sk-e0683fb0c7af3fc6-dcdb07-72c65552';
const NEXII_BASE='https://ai.nexii.cloud/v1';
const GEMINI_URL='https://pubgskin.vercel.app/api/chat';
const AGNES='sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
const MODELS=[
{id:'cf/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b',label:'DeepSeek R1',p:'nexii'},
{id:'cf/@cf/zai-org/glm-5.2',label:'GLM 5.2',p:'nexii'},
{id:'cf/@cf/deepseek-ai/deepseek-v4-flash-0731',label:'DeepSeek V4',p:'nexii'},
{id:'cf/@cf/qwen/qwq-32b',label:'QwQ 32B',p:'nexii'},
{id:'cf/@cf/meta/llama-4-scout-17b-16e-instruct',label:'Llama 4 Scout',p:'nexii'},
{id:'auto/best-reasoning',label:'Auto Reasoning',p:'nexii'},
{id:'auto/best-coding',label:'Auto Coding',p:'nexii'},
{id:'cf/@cf/meta/llama-3.3-70b-instruct-fp8-fast',label:'Llama 70B',p:'nexii'},
{id:'cf/@cf/mistralai/mistral-small-3.1-24b-instruct',label:'Mistral Small',p:'nexii'},
{id:'cf/@cf/qwen/qwen2.5-coder-32b-instruct',label:'Qwen Coder',p:'nexii'},
{id:'cf/@cf/google/gemma-4-26b-a4b-it',label:'Gemma 4',p:'nexii'},
{id:'auto/best-chat',label:'Auto Chat',p:'nexii'},
{id:'cf/@cf/meta/llama-3.1-8b-instruct-fp8',label:'Llama 8B',p:'nexii'},
{id:'auto/best-fast',label:'Auto Fast',p:'nexii'},
{id:'gemini-3.6-flash',label:'Gemini 3.6',p:'gemini'},
{id:'gemini-flash-latest',label:'Gemini Latest',p:'gemini'}
];
let history=[];
let selectedImage=null;
let currentModel=localStorage.getItem('aiModel')||MODELS[0].id;
populateModels();
function populateModels(){document.getElementById('model-select').innerHTML=MODELS.map(function(m){return '<option value="'+m.id+'"'+(m.id===currentModel?' selected':'')+' class="bg-[#1e1f20]">'+m.label+'</option>';}).join('');}
function changeModel(){currentModel=document.getElementById('model-select').value;localStorage.setItem('aiModel',currentModel);}
function handleFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var max=800;var ratio=Math.min(max/img.width,max/img.height,1);canvas.width=Math.floor(img.width*ratio);canvas.height=Math.floor(img.height*ratio);var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);selectedImage=canvas.toDataURL('image/jpeg',0.8);document.getElementById('preview-img').src=selectedImage;document.getElementById('preview-name').textContent=f.name;document.getElementById('preview-box').style.display='flex';};img.src=ev.target.result;};r.readAsDataURL(f);}
function removeImage(){selectedImage=null;document.getElementById('file-input').value='';document.getElementById('preview-box').style.display='none';}
function appendMsg(role,text,image,isHtml){var area=document.getElementById('chat-area');var w=document.getElementById('welcome');if(w)w.style.display='none';var d=document.createElement('div');d.className='msg '+(role==='user'?'user-msg':'ai-msg');if(image)d.innerHTML='<img src="'+image+'"><br>'+text;else if(isHtml)d.innerHTML=text;else d.textContent=text;area.appendChild(d);area.scrollTop=area.scrollHeight;return d;}
function showLoading(text){var area=document.getElementById('chat-area');var d=document.createElement('div');d.className='msg ai-msg';d.innerHTML='<span class="loading-dots"><span></span><span></span><span></span></span> <span style="color:#a8c7fa;font-size:12px;">'+text+'</span>';area.appendChild(d);area.scrollTop=area.scrollHeight;return d;}
function formatText(t){if(!t)return'';t=t.replace(/```([\s\S]+?)```/g,function(m,code){return '<div class="code-block"><button class="copy-btn" onclick="navigator.clipboard.writeText(this.nextSibling.textContent)">📋 نسخ</button><span>'+code.replace(/</g,'&lt;')+'</span></div>';});t=t.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');t=t.replace(/`([^`]+)`/g,'<code style="background:#282a2c;padding:2px 6px;border-radius:4px;">$1</code>');return t.replace(/\n/g,'<br>');}
function callNexii(model,text){var messages=[];history.forEach(function(h){messages.push({role:h.role,content:h.text});});messages.push({role:'user',content:text});return fetch(NEXII_BASE+'/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+NEXII_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:messages,max_tokens:2048})}).then(function(r){return r.text();}).then(function(t){try{var d=JSON.parse(t);if(d.choices&&d.choices[0]&&d.choices[0].message)return d.choices[0].message.content||d.choices[0].message.reasoning_content||'';}catch(e){}var full='';var ls=t.split('\n');for(var i=0;i<ls.length;i++){if(ls[i].indexOf('data: ')>-1){var x=ls[i].substring(ls[i].indexOf('data: ')+6);if(x==='[DONE]')break;try{var j=JSON.parse(x);full+=j.choices[0].delta.content||'';}catch(e2){}}}return full;});}
function callGemini(model,text){return fetch(GEMINI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,contents:[{role:'user',parts:[{text:text}]}]})}).then(function(r){return r.json();}).then(function(d){return d.candidates?.[0]?.content?.parts?.[0]?.text||('❌ '+(d.error?.message||'مفيش رد'));});}
async function genImage(prompt){var loading=showLoading('جاري انشاء الصورة...');try{var resp=await fetch('https://apihub.agnes-ai.com/v1/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+AGNES,'Content-Type':'application/json'},body:JSON.stringify({model:'agnes-image-2.1-flash',prompt:prompt,size:'1K',ratio:'1:1',extra_body:{response_format:'url'}})});var data=await resp.json();loading.remove();var url=data.data?.[0]?.url;if(url){appendMsg('assistant','<img src="'+url+'" style="max-width:100%;border-radius:10px;">',null,true);}else{appendMsg('assistant','❌ '+JSON.stringify(data).substring(0,100));}}catch(e){loading.remove();appendMsg('assistant','❌ '+e.message);}}
async function editImage(base64Img,prompt){var loading=showLoading('جاري تعديل الصورة...');try{var resp=await fetch('https://apihub.agnes-ai.com/v1/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+AGNES,'Content-Type':'application/json'},body:JSON.stringify({model:'agnes-image-2.1-flash',prompt:prompt,size:'1K',ratio:'1:1',extra_body:{image:[base64Img],response_format:'url'}})});var data=await resp.json();loading.remove();var url=data.data?.[0]?.url;if(url){appendMsg('assistant','<img src="'+url+'" style="max-width:100%;border-radius:10px;">',null,true);}else{appendMsg('assistant','❌ '+JSON.stringify(data).substring(0,100));}}catch(e){loading.remove();appendMsg('assistant','❌ '+e.message);}}
async function genVideo(prompt){var loading=showLoading('جاري انشاء الفيديو...');try{var resp=await fetch('https://apihub.agnes-ai.com/v1/videos',{method:'POST',headers:{'Authorization':'Bearer '+AGNES,'Content-Type':'application/json'},body:JSON.stringify({model:'agnes-video-v2.0',prompt:prompt,num_frames:81,frame_rate:24})});var data=await resp.json();var vid=data.video_id||data.id;var poll=setInterval(async function(){var r=await fetch('https://apihub.agnes-ai.com/agnesapi?video_id='+vid,{headers:{'Authorization':'Bearer '+AGNES}});var d=await r.json();if(d.status==='completed'){clearInterval(poll);loading.remove();appendMsg('assistant','<video src="'+(d.metadata?.url||d.url)+'" controls style="max-width:100%;border-radius:10px;"></video>',null,true);}else if(d.status==='failed'){clearInterval(poll);loading.remove();appendMsg('assistant','❌ فشل');}},3000);}catch(e){loading.remove();appendMsg('assistant','❌ '+e.message);}}
async function sendMessage(){var input=document.getElementById('user-input');var text=input.value.trim();if(!text&&!selectedImage)return;var sendBtn=document.getElementById('send-btn');sendBtn.textContent='⏳';
if(selectedImage&&text){appendMsg('user',text,selectedImage);history.push({role:'user',text:text,image:selectedImage});await editImage(selectedImage,text);input.value='';removeImage();sendBtn.textContent='↑';return;}
if(/(صمم|ارسم|انشئ|اصنع|تخيل).*(صورة|صوره)/i.test(text)){appendMsg('user',text);history.push({role:'user',text:text});await genImage(text);input.value='';sendBtn.textContent='↑';return;}
if(/(صمم|انشئ|اصنع|اعمل).*(فيديو|فديو)/i.test(text)){appendMsg('user',text);history.push({role:'user',text:text});await genVideo(text);input.value='';sendBtn.textContent='↑';return;}
if(selectedImage){appendMsg('user',text||'حلل الصورة',selectedImage);history.push({role:'user',text:text||'حلل الصورة',image:selectedImage});}else{appendMsg('user',text);history.push({role:'user',text:text});}input.value='';removeImage();
var loading=showLoading('جاري التفكير...');
try{var m=MODELS.find(function(x){return x.id===currentModel;});var reply='';if(m.p==='nexii'){reply=await callNexii(currentModel,text);if(!reply)reply='❌ مفيش رد';}else{reply=await callGemini(currentModel,text);}loading.remove();history.push({role:'assistant',text:reply});appendMsg('assistant',formatText(reply),null,true);}catch(e){loading.remove();appendMsg('assistant','❌ '+e.message);}sendBtn.textContent='↑';}
</script>
</body>
</html>
